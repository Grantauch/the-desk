# netlify.toml — deploy settings.
# Netlify build, function, security, and caching settings.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/cold-openers"
  to = "/detour-shelf/#story-bank"
  status = 301

[[redirects]]
  from = "/rabbit-holes"
  to = "/detour-shelf/#ready-decks"
  status = 301

[[redirects]]
  from = "/cold-openers/*"
  to = "/detour-shelf/#story-bank"
  status = 301

[[redirects]]
  from = "/rabbit-holes/*"
  to = "/detour-shelf/#ready-decks"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  # hashed build assets never change — cache them forever
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
