# netlify.toml — deploy settings.
# Netlify build, function, security, and caching settings.

[build]
  command = "npm run verify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # The Robber Barons Firebase web key is public by design and belongs in the page.
  # The database rules in docs/robber-barons-online/ protect the data, not this key.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBA-NZ3otPFmOJOHAASrWk0A6Km3PnLCV0"

[[redirects]]
  from = "/cold-openers"
  to = "/detour-shelf/#story-bank"
  status = 301

[[redirects]]
  from = "/rabbit-holes"
  to = "/detour-shelf/#ready-decks"
  status = 301

[[redirects]]
  from = "/cold-openers/*"
  to = "/detour-shelf/#story-bank"
  status = 301

[[redirects]]
  from = "/rabbit-holes/*"
  to = "/detour-shelf/#ready-decks"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  # hashed build assets never change — cache them forever
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # The editor is intentionally unlisted, uncached, and locked behind Netlify Identity.
  for = "/editor/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'"
