# netlify.toml — deploy settings.
# Netlify build, function, security, and caching settings.

[build]
  command = "npm run verify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # The Robber Barons Firebase web key is public by design and belongs in the page.
  # The database rules in docs/robber-barons-online/ protect the data, not this key.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBA-NZ3otPFmOJOHAASrWk0A6Km3PnLCV0"

# The original, release-sealed /hubs/bts-americas-most-hated.html remains intact.
# Route the classroom-friendly URL to its expanded interactive assignment.
[[redirects]]
  from = "/hubs/bts-americas-most-hated"
  to = "/hubs/bts-americas-most-hated-research.html"
  status = 302
  force = true

[[redirects]]
  from = "/press"
  to = "/hubs/ush9-stop-the-presses.html"
  status = 301

[[redirects]]
  from = "/buzz"
  to = "/hubs/jeopardy-buzz.html"
  status = 301

[[redirects]]
  from = "/cold-openers"
  to = "/detour-shelf/#story-bank"
  status = 301

[[redirects]]
  from = "/rabbit-holes"
  to = "/detour-shelf/#ready-decks"
  status = 301

[[redirects]]
  from = "/cold-openers/*"
  to = "/detour-shelf/#story-bank"
  status = 301

[[redirects]]
  from = "/rabbit-holes/*"
  to = "/detour-shelf/#ready-decks"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/hubs/checkling/camp/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  # hashed build assets never change — cache them forever
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Icons and social cards change only when they are redrawn, and a stale one
  # for a day is harmless. A day of caching with revalidation keeps repeat
  # visits cheap without pinning a wrong icon for a year.
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  # The manifest is tiny and drives the home-screen install, so keep it fresh.
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  # The editor is intentionally unlisted, uncached, and locked behind Netlify Identity.
  for = "/editor/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'"
