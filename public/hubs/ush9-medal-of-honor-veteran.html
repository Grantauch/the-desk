<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veteran · The Medal of Honor Project · the desk</title>
<meta name="description" content="One World War I Medal of Honor recipient: his story, his service record, his official citation and links to learn more.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://grant-desk.com/hubs/ush9-medal-of-honor-veteran.html">
<link rel="stylesheet" href="/hubs/moh/moh.css">
<style>
.vhero{padding:3rem 0 2.2rem;position:relative}
.vhero .wrap{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end}
.vhero .back{display:inline-block;margin-bottom:1.2rem;color:var(--mute);text-decoration:none;font:600 1rem var(--display);letter-spacing:.1em;text-transform:uppercase}
.vhero .back:hover{color:var(--star)}
.vhero h1{font-size:clamp(3rem,8.5vw,6.4rem);color:var(--star)}
.vhero .unit{font:600 1.15rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ribbon2);margin:.8rem 0 0}
.vhero .hook{font:italic 400 1.45rem/1.45 var(--serif);color:var(--bone);margin:1.2rem 0 0;max-width:40rem}
.pick{display:flex;flex-direction:column;gap:.6rem;align-items:flex-end}
.photo{width:220px;aspect-ratio:4/5;border-radius:.5rem;overflow:hidden;border:6px solid var(--paper);box-shadow:0 16px 30px rgba(0,0,0,.45);background:var(--paper2)}
.photo img{width:100%;height:100%;object-fit:cover}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:1.4rem;margin-top:2rem}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.4rem}
.num{background:var(--navy2);border:1px solid var(--line);border-radius:.7rem;padding:1rem 1.1rem}
.num b{display:block;font:800 2.9rem/1 var(--display);color:var(--bronze2)}
.num span{color:var(--mute);font-size:.98rem}
.mapbox{background:var(--navy2);border:1px solid var(--line);border-radius:.7rem;padding:1rem}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox p{margin:.6rem 0 0;color:var(--mute);font-size:.95rem}
.story{margin-top:3rem}
.chapter{display:grid;grid-template-columns:12rem 1fr;gap:2rem;padding:1.8rem 0;border-top:1px solid var(--line)}
.chapter h3{font-size:1.6rem;color:var(--bronze2)}
.chapter .when{display:block;font:600 .95rem var(--display);letter-spacing:.1em;color:var(--mute);margin-top:.4rem;text-transform:uppercase}
.chapter p{font:400 1.18rem/1.7 var(--serif);color:var(--bone);max-width:44rem}
.citation{margin-top:2.5rem;display:grid;grid-template-columns:1.3fr .7fr;gap:1.4rem}
.citation .paper{position:relative}
.citation .paper .seal{position:absolute;top:1.1rem;right:1.2rem;width:54px;opacity:.9}
.citation blockquote{margin:0;font:400 1.14rem/1.75 var(--serif)}
.citation mark{background:rgba(207,159,69,.32);color:inherit;padding:0 .1rem;border-radius:.2rem}
.citation .note{margin-top:1rem;font:italic 400 1rem/1.5 var(--serif);color:#7a2a1d}
.words dl{margin:0}
.words dt{font:800 1.15rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--bronze2);margin-top:.9rem}
.words dd{margin:.15rem 0 0;color:var(--bone)}
.draw{margin-top:2.5rem;background:linear-gradient(160deg,#1f3150,#152238);border:1px solid var(--line);border-radius:.8rem;padding:1.3rem 1.5rem}
.links ul{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.6rem}
.links li a{display:block;background:var(--navy2);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1rem;text-decoration:none}
.links li a:hover{border-color:var(--ribbon)}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem}
.pager a{flex:1;background:var(--navy2);border:1px solid var(--line);border-radius:.7rem;padding:1rem 1.2rem;text-decoration:none;color:var(--bone)}
.pager a span{display:block;font:600 .85rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pager a b{font:800 1.4rem var(--display);text-transform:uppercase;color:var(--star)}
.pager a.next{text-align:right}
.missing{padding:6rem 0;text-align:center}
@media (max-width:860px){.vhero .wrap,.grid2,.citation,.chapter{grid-template-columns:1fr}.pick{align-items:flex-start}.nums{grid-template-columns:1fr 1fr 1fr}.chapter{gap:.6rem}}
@media print{.paper{box-shadow:none}.pick,.pager,.links{display:none}}
</style>
</head>
<body>

    </nav>
  </div>
</header>

<main id="main-content">
  <div id="page"></div>
</main>

<footer class="mfoot"><div class="wrap"><p>Story written for this class from the sources listed above. The citation is quoted word for word. <a href="/hubs/ush9-medal-of-honor.html">Back to all veterans</a></p></div></footer>

<script src="/hubs/moh/spec.js"></script>
<script src="/hubs/moh/veterans.js"></script>
<script src="/hubs/moh/map.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MOH, list = window.MOH_VETERANS || [], page = document.getElementById('page');
  var slug = new URLSearchParams(location.search).get('v') || '';
  var i = list.findIndex(function (v) { return v.slug === slug; });
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  if (i < 0) {
    page.appendChild(el('section', { class: 'wrap missing' }, [el('h2', { text: 'Pick a veteran first' }), el('p', {}, [el('a', { href: '/hubs/ush9-medal-of-honor.html#veterans', text: 'Go to the list of veterans' })])]));
    return;
  }
  var v = list[i];
  document.title = v.name + ' · The Medal of Honor Project · the desk';
  var age = M.age(v.born, v.action);

  // hero
  var hero = el('section', { class: 'vhero' });
  var w = el('div', { class: 'wrap' });
  var left = el('div', {}, [
    el('a', { class: 'back', href: '/hubs/ush9-medal-of-honor.html#veterans', text: '← All veterans' }),
    el('p', { class: 'kicker', text: v.rank + ' · ' + v.branch }),
    el('h1', { text: v.name }),
    el('p', { class: 'unit', text: v.unit }),
    el('p', { class: 'hook', text: v.hook })
  ]);
  var pick = el('div', { class: 'pick' });
  // A photo appears only when the teacher has added one at /hubs/moh/photos/<slug>.jpg
  var photo = el('div', { class: 'photo', hidden: '' });
  var img = el('img', { alt: 'Portrait of ' + v.name, loading: 'lazy' });
  img.addEventListener('load', function () { photo.hidden = false; });
  img.src = '/hubs/moh/photos/' + v.slug + '.jpg';
  photo.appendChild(img);
  pick.appendChild(photo);
  pick.appendChild(el('a', { class: 'btn', href: '/hubs/ush9-medal-of-honor-project.html?pick=' + v.slug, text: 'Pick ' + v.name.split(' ').slice(-1)[0] }));
  w.appendChild(left); w.appendChild(pick); hero.appendChild(w); page.appendChild(hero);
  page.appendChild(el('div', { class: 'ribbon', 'aria-hidden': 'true' }));

  var body = el('div', { class: 'wrap' });
  // numbers
  var nums = el('div', { class: 'nums' });
  v.numbers.forEach(function (n) { nums.appendChild(el('div', { class: 'num' }, [el('b', { text: n[0] }), el('span', { text: n[1] })])); });
  body.appendChild(nums);

  // service record and map
  var grid = el('div', { class: 'grid2' });
  var rows = [['Born', M.niceDate(v.born) + ', ' + v.bornPlace + (v.bornApprox ? ', the date he gave' : '')], ['Hometown', v.home], ['Branch', v.branch], ['Unit', v.unit], ['Rank', v.rank],
    ['The action', v.actionLabel], ['Where', v.place], ['Age that day', String(age)], ['Medal', v.awarded], ['Died', M.niceDate(v.died) + (v.diedPlace ? ', ' + v.diedPlace : '')]];
  if (v.buried) rows.push(['Buried', v.buried]);
  var dl = el('dl');
  rows.forEach(function (r) { dl.appendChild(el('dt', { text: r[0] })); dl.appendChild(el('dd', { text: r[1] })); });
  grid.appendChild(el('div', { class: 'paper record' }, [el('h3', { text: 'Service record', style: 'margin-bottom:1rem' }), dl]));

  var map = window.MOH_MAP, mapBox = el('div', { class: 'mapbox' });
  if (map) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + map.w + ' ' + map.h); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Map of France and its neighbors in 1914 with a marker at ' + v.place);
    var bg = document.createElementNS(ns, 'rect'); bg.setAttribute('width', map.w); bg.setAttribute('height', map.h); bg.setAttribute('fill', '#0b1322'); svg.appendChild(bg);
    Object.keys(map.paths).forEach(function (k) {
      var p = document.createElementNS(ns, 'path'); p.setAttribute('d', map.paths[k]);
      p.setAttribute('fill', k === 'france' ? '#2a3d5e' : k === 'germany' ? '#3a2b2b' : '#1c2a42'); p.setAttribute('stroke', '#5a7299'); p.setAttribute('stroke-width', '1.5');
      svg.appendChild(p);
    });
    function label(text, lon, lat, color) {
      var t = document.createElementNS(ns, 'text'), xy = proj(lon, lat);
      t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1]); t.setAttribute('fill', color || '#a7b2c6'); t.setAttribute('font-size', '30'); t.setAttribute('font-family', 'Barlow Condensed, Arial Narrow, sans-serif'); t.setAttribute('font-weight', '600'); t.setAttribute('letter-spacing', '3');
      t.textContent = text; svg.appendChild(t);
    }
    function proj(lon, lat) { return [(lon - map.lon0) / (map.lon1 - map.lon0) * map.w, (map.lat1 - lat) / (map.lat1 - map.lat0) * map.h]; }
    label('FRANCE', 1.4, 47.2); label('GERMANY', 7.9, 51.2, '#c79a8a'); label('BELGIUM', 3.6, 50.95); label('PARIS', 2.0, 48.62, '#cfd8e6');
    var paris = proj(2.35, 48.86), dot = document.createElementNS(ns, 'circle'); dot.setAttribute('cx', paris[0]); dot.setAttribute('cy', paris[1]); dot.setAttribute('r', 6); dot.setAttribute('fill', '#cfd8e6'); svg.appendChild(dot);
    var xy = proj(v.lon, v.lat);
    var ring = document.createElementNS(ns, 'circle'); ring.setAttribute('cx', xy[0]); ring.setAttribute('cy', xy[1]); ring.setAttribute('r', 26); ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#e7bf6a'); ring.setAttribute('stroke-width', '4'); svg.appendChild(ring);
    var pin = document.createElementNS(ns, 'circle'); pin.setAttribute('cx', xy[0]); pin.setAttribute('cy', xy[1]); pin.setAttribute('r', 11); pin.setAttribute('fill', '#cf9f45'); pin.setAttribute('stroke', '#0d1626'); pin.setAttribute('stroke-width', '3'); svg.appendChild(pin);
    mapBox.appendChild(svg);
  }
  mapBox.appendChild(el('p', { text: 'The gold marker shows ' + v.place + '. Borders are from 1914.' }));
  grid.appendChild(mapBox);
  body.appendChild(grid);

  // story
  var story = el('section', { class: 'story', 'aria-label': 'His story' });
  story.appendChild(el('p', { class: 'kicker', text: 'His story' }));
  [['Before the war', v.bornPlace, v.before], ['The day', v.actionLabel, v.day], ['After the war', 'The rest of his life', v.after]].forEach(function (c) {
    var col = el('div');
    c[2].forEach(function (p) { col.appendChild(el('p', { text: p })); });
    story.appendChild(el('div', { class: 'chapter' }, [el('div', {}, [el('h3', { text: c[0] }), el('span', { class: 'when', text: c[1] })]), col]));
  });
  body.appendChild(story);

  // citation with the hard words marked
  var cite = el('section', { class: 'citation', id: 'citation', 'aria-label': 'Official citation' });
  var q = el('blockquote');
  var text = v.citation, words = v.words.map(function (w) { return w[0]; });
  var pattern = new RegExp('\\b(' + words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')\\b', 'gi');
  var last = 0, m;
  while ((m = pattern.exec(text))) {
    q.appendChild(document.createTextNode(text.slice(last, m.index)));
    q.appendChild(el('mark', { text: m[0] }));
    last = m.index + m[0].length;
  }
  q.appendChild(document.createTextNode(text.slice(last)));
  var paper = el('div', { class: 'paper' }, [
    el('p', { class: 'kicker', style: 'color:#8a5a12', text: 'The official citation' }),
    el('h3', { text: 'Why he received the medal', style: 'margin-bottom:1rem;max-width:80%' }), q
  ]);
  if (v.citeNote) paper.appendChild(el('p', { class: 'note', text: v.citeNote }));
  cite.appendChild(paper);
  var wd = el('dl');
  v.words.forEach(function (w) { wd.appendChild(el('dt', { text: w[0] })); wd.appendChild(el('dd', { text: w[1] })); });
  cite.appendChild(el('div', { class: 'words' }, [el('p', { class: 'kicker', text: 'Words to know' }), el('p', { style: 'color:var(--mute)', text: 'The highlighted words in the citation, in plain English.' }), wd]));
  body.appendChild(cite);

  body.appendChild(el('div', { class: 'draw' }, [el('p', { class: 'kicker', text: 'An idea for your art' }), el('p', { style: 'margin:0;font:italic 400 1.15rem/1.55 var(--serif)', text: v.scene })]));

  var links = el('section', { class: 'links', style: 'margin-top:2.5rem' }, [el('p', { class: 'kicker', text: 'Want more? Optional' }), el('p', { style: 'color:var(--mute)', text: 'You do not need these for the project. They are here if you want to go deeper.' })]);
  var ul = el('ul');
  v.links.forEach(function (l) { ul.appendChild(el('li', {}, [el('a', { href: l[1], target: '_blank', rel: 'noopener', text: l[0] })])); });
  links.appendChild(ul);
  body.appendChild(links);

  var prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  body.appendChild(el('nav', { class: 'pager', 'aria-label': 'Other veterans' }, [
    el('a', { href: '?v=' + prev.slug }, [el('span', { text: '← Previous' }), el('b', { text: prev.name })]),
    el('a', { class: 'next', href: '?v=' + next.slug }, [el('span', { text: 'Next →' }), el('b', { text: next.name })])
  ]));
  page.appendChild(body);
})();
</script>
<script src="/hubs/desk-save.js" defer></script>
</body>
</html>
