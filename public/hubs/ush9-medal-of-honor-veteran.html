<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veteran · The Medal of Honor Project · the desk</title>
<meta name="description" content="One World War I Medal of Honor recipient: his story, his service record, his official citation and links to learn more.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://grant-desk.com/hubs/ush9-medal-of-honor-veteran.html">
<link rel="stylesheet" href="/hubs/moh/moh.css">
<link rel="stylesheet" href="/hubs/moh/exhibit.css">
</head>
<body>
<a class="skip" href="#main-content">Skip to main content</a>
<header class="mbar">
  <div class="wrap">
    <a class="brand" href="/hubs/ush9-medal-of-honor.html"><span aria-hidden="true">★</span> Medal of Honor Project</a>
    <nav aria-label="Project">
      <a href="/hubs/ush9-medal-of-honor.html#veterans">Veterans</a>
      <a href="/hubs/ush9-medal-of-honor.html#how">How it works</a>
      <a class="go" href="/hubs/ush9-medal-of-honor-project.html">My project</a>
    </nav>
  </div>
</header>

<main id="main-content">
  <div id="page"></div>
  <noscript><p class="wrap missing">Turn on JavaScript to read this veteran’s profile.</p></noscript>
</main>

<footer class="mfoot"><div class="wrap"><p>Story written for this class from the sources listed above. The citation is quoted word for word.</p><p class="foot-nav"><a href="/hubs/ush9-medal-of-honor.html#veterans">Back to all veterans</a></p></div></footer>

<script src="/hubs/moh/spec.js"></script>
<script src="/hubs/moh/veterans.js"></script>
<script src="/hubs/moh/map.js"></script>
<script src="/hubs/moh/portraits.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MOH, list = window.MOH_VETERANS || [], page = document.getElementById('page');
  var slug = new URLSearchParams(location.search).get('v') || '';
  var i = list.findIndex(function (v) { return v.slug === slug; });
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  if (i < 0) {
    page.appendChild(el('section', { class: 'wrap missing' }, [el('h1', { class: 'exhibit-title', text: 'Choose a veteran' }), el('p', {}, [el('a', { href: '/hubs/ush9-medal-of-honor.html#veterans', text: 'Go to the list of veterans' })])]));
    return;
  }
  var v = list[i];
  document.title = v.name + ' · The Medal of Honor Project · the desk';
  var age = M.age(v.born, v.action);

  var gallery = '/hubs/ush9-medal-of-honor.html#veterans';
  var project = '/hubs/ush9-medal-of-honor-project.html?pick=' + v.slug;
  var portraits = window.MOH_PORTRAITS;
  var portrait = portraits.records[v.slug];
  var hero = el('header', { class: 'profile-hero' }, [el('div', { class: 'wrap' }, [
    el('div', { class: 'profile-copy' }, [
      el('a', { class: 'back', href: gallery, text: '← All veterans' }),
      el('p', { class: 'kicker', text: v.rank + ' · ' + v.branch }),
      el('h1', { class: 'exhibit-title', text: v.name }),
      el('p', { class: 'unit', text: v.unit }),
      el('p', { class: 'hook', text: v.hook }),
      el('div', { class: 'hero-actions' }, [
        el('a', { class: 'btn', href: project, text: 'Choose this veteran' }),
        el('a', { class: 'btn ghost', href: '#story', text: 'Read his story ↓' })
      ])
    ]),
    el('figure', { class: 'profile-portrait' }, [
      portraits.image(v.slug, 'profile'),
      el('figcaption', {}, [
        portrait.caption + ' · ',
        el('a', { href: portrait.url, text: portrait.credit })
      ])
    ])
  ])]);
  page.appendChild(hero);
  var navItems = [['record', 'Service record'], ['story', 'His story'], ['citation', 'Official citation'], ['sources', 'Sources']];
  page.appendChild(el('nav', { class: 'profile-jumps', 'aria-label': 'On this profile' }, [
    el('div', { class: 'wrap' }, navItems.map(function (item) {
      return el('a', { href: '#' + item[0], text: item[1] });
    }))
  ]));

  var nums = el('div', { class: 'profile-numbers' });
  v.numbers.forEach(function (n) {
    nums.appendChild(el('div', { class: 'profile-number' }, [el('b', { text: n[0] }), el('span', { text: n[1] })]));
  });

  var grid = el('div', { class: 'record-layout' });
  var rows = [['Born', M.niceDate(v.born) + ', ' + v.bornPlace + (v.bornApprox ? ', the date he gave' : '')], ['Hometown', v.home], ['Branch', v.branch], ['Unit', v.unit], ['Rank', v.rank],
    ['The action', v.actionLabel], ['Where', v.place], ['Age that day', String(age)], ['Medal', v.awarded], ['Died', M.niceDate(v.died) + (v.diedPlace ? ', ' + v.diedPlace : '')]];
  if (v.buried) rows.push(['Buried', v.buried]);
  var dl = el('dl', { class: 'record-list' });
  rows.forEach(function (r) { dl.append(el('dt', { text: r[0] }), el('dd', { text: r[1] })); });
  grid.appendChild(dl);

  var map = window.MOH_MAP, mapBox = el('figure', { class: 'mapbox' });
  if (map) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + map.w + ' ' + map.h); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Map of France and its neighbors in 1914 with a marker at ' + v.place);
    var bg = document.createElementNS(ns, 'rect'); bg.setAttribute('width', map.w); bg.setAttribute('height', map.h); bg.setAttribute('fill', '#292820'); svg.appendChild(bg);
    Object.keys(map.paths).forEach(function (k) {
      var p = document.createElementNS(ns, 'path'); p.setAttribute('d', map.paths[k]);
      p.setAttribute('fill', k === 'france' ? '#554b36' : k === 'germany' ? '#584034' : '#423c2d'); p.setAttribute('stroke', '#af9571'); p.setAttribute('stroke-width', '1.5');
      svg.appendChild(p);
    });
    function label(text, lon, lat, color) {
      var t = document.createElementNS(ns, 'text'), xy = proj(lon, lat);
      t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1]); t.setAttribute('fill', color || '#ebd2ac'); t.setAttribute('font-size', '30'); t.setAttribute('font-family', 'Barlow Condensed, Arial Narrow, sans-serif'); t.setAttribute('font-weight', '600'); t.setAttribute('letter-spacing', '3');
      t.textContent = text; svg.appendChild(t);
    }
    function proj(lon, lat) { return [(lon - map.lon0) / (map.lon1 - map.lon0) * map.w, (map.lat1 - lat) / (map.lat1 - map.lat0) * map.h]; }
    label('FRANCE', 1.4, 47.2); label('GERMANY', 7.9, 51.2, '#efc2a8'); label('BELGIUM', 3.6, 50.95); label('PARIS', 2.0, 48.62, '#f9e7ca');
    var paris = proj(2.35, 48.86), dot = document.createElementNS(ns, 'circle'); dot.setAttribute('cx', paris[0]); dot.setAttribute('cy', paris[1]); dot.setAttribute('r', 6); dot.setAttribute('fill', '#f9e7ca'); svg.appendChild(dot);
    var xy = proj(v.lon, v.lat);
    var ring = document.createElementNS(ns, 'circle'); ring.setAttribute('cx', xy[0]); ring.setAttribute('cy', xy[1]); ring.setAttribute('r', 26); ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#f4d59e'); ring.setAttribute('stroke-width', '4'); svg.appendChild(ring);
    var pin = document.createElementNS(ns, 'circle'); pin.setAttribute('cx', xy[0]); pin.setAttribute('cy', xy[1]); pin.setAttribute('r', 11); pin.setAttribute('fill', '#f5ce87'); pin.setAttribute('stroke', '#211b14'); pin.setAttribute('stroke-width', '3'); svg.appendChild(pin);
    mapBox.appendChild(svg);
  }
  mapBox.appendChild(el('figcaption', { text: 'Action location: ' + v.place + '. Borders shown as of 1914.' }));
  grid.appendChild(mapBox);
  page.appendChild(el('section', { class: 'exhibit-section light-section', id: 'record', 'aria-labelledby': 'record-title' }, [
    el('div', { class: 'wrap' }, [
      el('h2', { class: 'exhibit-title', id: 'record-title', text: 'Service record' }),
      nums, grid
    ])
  ]));

  var chapters = el('div', { class: 'chapters' });
  [['Before the war', v.bornPlace, v.before], ['The day', v.actionLabel, v.day], ['After the war', 'What followed', v.after]].forEach(function (c) {
    var col = el('div');
    c[2].forEach(function (p) { col.appendChild(el('p', { text: p })); });
    chapters.appendChild(el('section', { class: 'chapter' }, [
      el('div', {}, [el('h3', { text: c[0] }), el('span', { class: 'when', text: c[1] })]), col
    ]));
  });
  page.appendChild(el('section', { class: 'exhibit-section light-section story', id: 'story', 'aria-labelledby': 'story-title' }, [
    el('div', { class: 'wrap' }, [
      el('h2', { class: 'exhibit-title', id: 'story-title', text: 'His story' }), chapters
    ])
  ]));

  var q = el('blockquote');
  var text = v.citation, words = v.words.map(function (w) { return w[0]; });
  var pattern = new RegExp('\\b(' + words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')\\b', 'gi');
  var last = 0, m;
  while ((m = pattern.exec(text))) {
    q.appendChild(document.createTextNode(text.slice(last, m.index)));
    q.appendChild(el('mark', { text: m[0] }));
    last = m.index + m[0].length;
  }
  q.appendChild(document.createTextNode(text.slice(last)));
  var paper = el('div', { class: 'citation-document' }, [
    el('h3', { text: 'Why he received the medal' }), q
  ]);
  if (v.citeNote) paper.appendChild(el('p', { class: 'note', text: v.citeNote }));
  var wd = el('dl');
  v.words.forEach(function (w) { wd.append(el('dt', { text: w[0] }), el('dd', { text: w[1] })); });
  page.appendChild(el('section', { class: 'exhibit-section citation', id: 'citation', 'aria-labelledby': 'citation-title' }, [
    el('div', { class: 'wrap' }, [
      el('h2', { class: 'exhibit-title', id: 'citation-title', text: 'Official citation' }),
      el('div', { class: 'citation-layout' }, [
        paper,
        el('aside', { class: 'words', 'aria-labelledby': 'words-title' }, [
          el('h3', { id: 'words-title', text: 'Words to know' }),
          el('p', { text: 'The highlighted words in the citation, in plain English.' }), wd
        ])
      ])
    ])
  ]));

  var ul = el('ul');
  v.links.forEach(function (l) { ul.appendChild(el('li', {}, [el('a', { href: l[1], text: l[0] })])); });
  ul.appendChild(el('li', {}, [el('a', { href: portrait.url, text: 'Image credit and source · ' + portrait.credit })]));

  var prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  page.appendChild(el('div', { class: 'exhibit-section light-section profile-end' }, [
    el('div', { class: 'wrap' }, [
      el('div', { class: 'profile-resources' }, [
        el('section', { class: 'art-idea' }, [
          el('h2', { class: 'exhibit-title', text: 'An idea for your art' }), el('p', { text: v.scene })
        ]),
        el('section', { class: 'links', id: 'sources' }, [
          el('h2', { class: 'exhibit-title', text: 'Sources' }), ul
        ])
      ]),
      el('div', { class: 'project-next' }, [
        el('p', { text: 'Ready to build your project around ' + v.name + '?' }),
        el('a', { class: 'btn', href: project, text: 'Choose this veteran' })
      ]),
      el('nav', { class: 'pager', 'aria-label': 'Other veterans' }, [
        el('a', { href: '?v=' + prev.slug }, [el('span', { text: '← Previous' }), el('b', { text: prev.name })]),
        el('a', { class: 'next', href: '?v=' + next.slug }, [el('span', { text: 'Next →' }), el('b', { text: next.name })])
      ])
    ])
  ]));
})();
</script>
<script src="/hubs/desk-save.js" defer></script>
</body>
</html>
