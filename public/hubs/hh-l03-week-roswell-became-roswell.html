<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading StoryHub…</title><style>html,body{margin:0;min-height:100%;background:#08100f;color:#f1e2c0;font-family:system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}.dot{width:9px;height:9px;border-radius:50%;background:#d79a3c;display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.2;transform:scale(.7)}}</style></head><body><main><div><span class="dot"></span><p>Opening The Week Roswell Became Roswell…</p></div></main><script>(async()=>{try{const base='/hubs/hh-l03-week-roswell-parts/';const files=['part-00.txt','part-01.txt','part-02.txt','part-03.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<main><div><h1>StoryHub did not load</h1><p>Please refresh once.</p></div></main>';console.error(e)}})();</script></body></html>
