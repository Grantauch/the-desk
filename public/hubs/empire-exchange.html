<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empire Exchange | Loading</title><style>body{margin:0;background:#10171c;color:#f5f2e7;font:16px/1.5 system-ui;min-height:100vh;display:grid;place-items:center}.box{text-align:center}.bar{width:min(420px,80vw);height:8px;background:#26343c;border-radius:9px;overflow:hidden;margin:16px auto}.bar i{display:block;height:100%;background:#ffcd66;width:38%;animation:p 1s ease-in-out infinite alternate}@keyframes p{to{transform:translateX(165%)}}</style></head><body><div class="box"><strong>Opening Empire Exchange…</strong><div class="bar"><i></i></div><span id="s">Loading the illustrated market.</span></div><script>(async()=>{try{const n=12;const b=await Promise.all(Array.from({length:n},(_,i)=>fetch(`/hubs/empire-exchange-data/part-${String(i).padStart(2,'0')}.bin`).then(r=>{if(!r.ok)throw new Error(`part ${i}: ${r.status}`);return r.arrayBuffer()})));const total=b.reduce((n,x)=>n+x.byteLength,0),all=new Uint8Array(total);let o=0;for(const x of b){all.set(new Uint8Array(x),o);o+=x.byteLength}if(!('DecompressionStream'in window))throw new Error('Browser does not support gzip decompression');const ds=new DecompressionStream('gzip'),stream=new Blob([all]).stream().pipeThrough(ds),html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').textContent='Empire Exchange could not load. Refresh once or tell Mr. Grant.';console.error(e)}})()</script></body></html>
