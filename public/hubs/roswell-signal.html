<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071112">
  <meta name="description" content="An immersive Hidden History investigation that teaches the first week of the Roswell record and the Project Mogul explanation.">
  <title>The Roswell Signal · Hidden History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --void:#050b0d;
      --night:#071112;
      --night-2:#0c1b1c;
      --night-3:#132627;
      --panel:#102021;
      --panel-2:#162b2c;
      --paper:#e9e2cb;
      --paper-2:#f4eedb;
      --ink:#17201d;
      --white:#f1f6ef;
      --mist:#b7c8c2;
      --dim:#7f9891;
      --signal:#92f29e;
      --signal-2:#4fc66e;
      --amber:#f2b84b;
      --amber-2:#d99022;
      --red:#ff6666;
      --blue:#65b8d7;
      --violet:#aa91e8;
      --line:rgba(202,231,220,.18);
      --paper-line:rgba(34,43,38,.22);
      --shadow:0 30px 90px rgba(0,0,0,.48);
      --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
      --mono:"IBM Plex Mono",Consolas,monospace;
      --body:"Inter","Segoe UI",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--white);
      background:
        radial-gradient(circle at 18% -10%,rgba(79,198,110,.14),transparent 35rem),
        radial-gradient(circle at 88% 10%,rgba(101,184,215,.10),transparent 28rem),
        linear-gradient(150deg,var(--void),var(--night) 48%,#081517);
      font-family:var(--body);
      font-size:17px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.28;
      background-image:
        linear-gradient(rgba(146,242,158,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(146,242,158,.025) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom,#000,transparent 92%);
      z-index:-1;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index:100;
      mix-blend-mode:screen;
    }
    button,input,textarea,select{font:inherit}
    button{touch-action:manipulation}
    a{color:inherit}
    .skip-link{
      position:fixed;left:16px;top:-80px;z-index:200;
      background:var(--signal);color:#071112;padding:10px 16px;border-radius:0 0 8px 8px;font-weight:800;
    }
    .skip-link:focus{top:0}
    #topbar{
      position:fixed;inset:0 0 auto 0;z-index:70;
      min-height:74px;
      border-bottom:1px solid rgba(146,242,158,.25);
      background:rgba(5,11,13,.92);
      backdrop-filter:blur(16px);
    }
    .top-inner{
      width:min(1260px,calc(100% - 30px));
      min-height:74px;margin:auto;
      display:grid;grid-template-columns:270px 1fr 270px;align-items:center;gap:22px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .scope{
      position:relative;width:34px;height:34px;border:1px solid rgba(146,242,158,.6);border-radius:50%;
      box-shadow:0 0 18px rgba(146,242,158,.12) inset;
      flex:0 0 auto;overflow:hidden;
    }
    .scope::before,.scope::after{content:"";position:absolute;background:rgba(146,242,158,.35)}
    .scope::before{width:1px;height:100%;left:50%;top:0}
    .scope::after{height:1px;width:100%;left:0;top:50%}
    .scope i{
      position:absolute;width:50%;height:1px;left:50%;top:50%;transform-origin:left center;
      background:linear-gradient(90deg,var(--signal),transparent);
      animation:sweep 3.8s linear infinite;
    }
    .brand strong{display:block;font-family:var(--display);font-size:20px;line-height:1;letter-spacing:.08em}
    .brand small{display:block;margin-top:4px;color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
    #meter{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
    .meter-seg{height:5px;background:#18302e;border:1px solid rgba(146,242,158,.08);position:relative;overflow:hidden}
    .meter-seg.done{background:var(--signal);box-shadow:0 0 11px rgba(146,242,158,.3)}
    .meter-seg.current::after{content:"";position:absolute;inset:0;background:var(--amber);animation:pulse 1.5s ease-in-out infinite}
    .top-status{display:flex;justify-content:flex-end;align-items:center;gap:13px;min-width:0}
    .top-status-copy{text-align:right;min-width:0}
    #stepLabel{display:block;color:var(--mist);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #saveLabel{display:block;height:14px;color:var(--signal);font-family:var(--mono);font-size:9px}
    .sound-btn{
      border:1px solid var(--line);background:transparent;color:var(--dim);
      padding:8px 9px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;cursor:pointer;
    }
    .sound-btn[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
    #stage{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:108px 0 118px;outline:none}
    .sheet{
      position:relative;min-height:640px;
      border:1px solid rgba(191,224,212,.18);
      background:
        linear-gradient(145deg,rgba(17,35,35,.98),rgba(8,19,20,.98));
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .sheet::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;
      background:linear-gradient(90deg,transparent 49.92%,rgba(146,242,158,.06) 50%,transparent 50.08%);
    }
    .sheet.paper{
      color:var(--ink);
      border-top:7px solid var(--amber);
      background:
        linear-gradient(rgba(83,68,35,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(83,68,35,.025) 1px,transparent 1px),
        var(--paper);
      background-size:27px 27px,27px 27px,auto;
    }
    .docket{
      min-height:48px;padding:0 28px;
      display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;
      border-bottom:1px solid var(--line);
      color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    }
    .paper .docket{border-color:var(--paper-line);color:#675f4e}
    .docket b{color:var(--signal);font-weight:600}
    .paper .docket b{color:#946213}
    .sheet-body{position:relative;padding:44px 50px 52px;z-index:1}
    .case-head{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:start;margin-bottom:30px}
    .eyebrow{
      color:var(--signal);font-family:var(--mono);font-size:11px;font-weight:600;
      letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;
    }
    .paper .eyebrow{color:#986719}
    h1,h2,h3,h4{margin:0;font-family:var(--display);line-height:.96;text-transform:uppercase}
    h1{font-size:clamp(66px,9.6vw,132px);letter-spacing:-.045em}
    h2{font-size:clamp(46px,6vw,76px);letter-spacing:-.032em;max-width:890px}
    h3{font-size:31px;letter-spacing:-.015em}
    h4{font-size:22px;letter-spacing:.01em}
    p{margin:0 0 14px}
    .lead{max-width:860px;color:#c4d2cd;font-size:20px;line-height:1.55}
    .paper .lead{color:#37433f}
    .time-chip{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--line);padding:8px 11px;color:var(--mist);
      font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
    }
    .paper .time-chip{border-color:var(--paper-line);color:#695f4c}
    .time-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
    .lesson-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:start}
    .lesson-grid.equal{grid-template-columns:1fr 1fr}
    .briefing{
      padding:22px 24px;border-left:4px solid var(--signal);
      background:rgba(146,242,158,.06);color:#dce8e3;
    }
    .paper .briefing{border-color:#ad7418;background:rgba(146,105,30,.08);color:#2b3833}
    .briefing strong{color:var(--white)}
    .paper .briefing strong{color:#18231f}
    .rule{
      margin-top:22px;padding:16px 18px;border:1px dashed rgba(242,184,75,.55);
      color:#eadbb5;background:rgba(242,184,75,.06);
    }
    .paper .rule{color:#4d402a;background:rgba(170,112,20,.08)}
    .rule b{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--amber);text-transform:uppercase}
    .paper .rule b{color:#8f5f12}
    .figure{
      position:relative;margin:0;background:#05090a;border:1px solid rgba(255,255,255,.16);
      overflow:hidden;box-shadow:0 18px 36px rgba(0,0,0,.28);
    }
    .paper .figure{border-color:rgba(31,41,36,.24);box-shadow:0 16px 30px rgba(65,48,22,.16)}
    .figure img{display:block;width:100%;height:100%;object-fit:cover;filter:contrast(1.04) saturate(.82)}
    .figure figcaption{
      position:absolute;left:0;right:0;bottom:0;padding:34px 14px 11px;
      color:#e8efe9;background:linear-gradient(transparent,rgba(0,0,0,.88));
      font-family:var(--mono);font-size:9px;letter-spacing:.03em;
    }
    .paper .figure figcaption{color:#fff}
    .img-tall{height:470px}
    .img-wide{height:330px}
    .stamp{
      display:inline-block;border:2px solid currentColor;padding:4px 9px;
      font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      transform:rotate(-2deg);
    }
    .stamp.green{color:var(--signal)}
    .stamp.amber{color:var(--amber)}
    .stamp.red{color:var(--red)}
    .challenge{
      margin-top:30px;border:1px solid rgba(242,184,75,.38);background:rgba(4,10,11,.54);
    }
    .paper .challenge{border-color:rgba(128,88,24,.32);background:rgba(255,251,235,.62)}
    .challenge-head{
      display:flex;justify-content:space-between;gap:18px;align-items:center;padding:12px 17px;
      border-bottom:1px solid rgba(242,184,75,.22);
      color:var(--amber);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    }
    .challenge-body{padding:19px}
    .question{font-size:18px;font-weight:700;margin-bottom:14px}
    .options{display:grid;gap:9px}
    .options.inline{grid-template-columns:repeat(3,1fr)}
    .choice{
      width:100%;border:1px solid rgba(200,227,216,.22);background:rgba(255,255,255,.035);
      color:var(--white);padding:13px 15px;text-align:left;cursor:pointer;transition:.18s ease;
    }
    .paper .choice{border-color:rgba(31,42,36,.22);background:rgba(255,255,255,.48);color:var(--ink)}
    .choice:hover,.choice:focus-visible{border-color:var(--signal);transform:translateY(-1px);outline:none}
    .choice[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;background:rgba(242,184,75,.10)}
    .choice.correct{border-color:var(--signal);background:rgba(79,198,110,.13)}
    .choice.wrong{border-color:var(--red);background:rgba(255,102,102,.10)}
    .feedback{
      display:none;margin-top:14px;padding:14px 16px;border-left:3px solid var(--signal);
      background:rgba(79,198,110,.08);color:#dce8e3;
    }
    .paper .feedback{color:#28352f;background:rgba(70,130,76,.09)}
    .feedback.show{display:block;animation:rise .24s ease-out}
    .feedback.no{border-color:var(--red);background:rgba(255,102,102,.08)}
    .button-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .btn{
      min-height:44px;border:1px solid rgba(189,220,208,.22);background:#172a2a;color:var(--white);
      padding:10px 17px;border-radius:3px;font-family:var(--mono);font-size:11px;font-weight:600;
      letter-spacing:.065em;text-transform:uppercase;cursor:pointer;transition:.18s ease;
    }
    .btn:hover,.btn:focus-visible{transform:translateY(-1px);border-color:var(--signal);outline:none}
    .btn.primary{background:var(--signal);border-color:var(--signal);color:#061008}
    .btn.amber{background:var(--amber);border-color:var(--amber);color:#211500}
    .btn.ghost{background:transparent}
    .btn.danger{background:transparent;color:#ff9b9b;border-color:rgba(255,102,102,.48)}
    .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
    .field{display:grid;gap:7px}
    .field label{color:var(--mist);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .paper .field label{color:#625a49}
    .field input,.field textarea,.field select{
      width:100%;border:1px solid rgba(193,222,211,.26);background:rgba(1,8,8,.5);
      color:var(--white);padding:12px 13px;border-radius:2px;outline:none;
    }
    .paper .field input,.paper .field textarea,.paper .field select{
      border-color:rgba(35,47,40,.26);background:rgba(255,255,255,.54);color:var(--ink);
    }
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--signal);box-shadow:0 0 0 2px rgba(146,242,158,.12)}
    .field textarea{min-height:104px;resize:vertical}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .word-count{text-align:right;color:var(--dim);font:10px var(--mono)}
    .word-count.good{color:var(--signal-2)}
    .micro{color:var(--dim);font:11px var(--mono);line-height:1.5}
    .paper .micro{color:#746b58}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      border:1px solid var(--line);background:transparent;color:var(--mist);padding:8px 11px;
      font:600 10px var(--mono);letter-spacing:.045em;text-transform:uppercase;cursor:pointer;
    }
    .paper .chip{border-color:var(--paper-line);color:#5c5445}
    .chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(242,184,75,.09)}
    .paper .chip[aria-pressed="true"]{color:#84570f}
    #bottomNav{
      position:fixed;inset:auto 0 0 0;z-index:75;min-height:76px;
      border-top:1px solid rgba(146,242,158,.22);background:rgba(5,11,13,.94);backdrop-filter:blur(16px);
    }
    .nav-inner{
      width:min(1180px,calc(100% - 32px));min-height:76px;margin:auto;
      display:grid;grid-template-columns:170px 1fr 230px;gap:20px;align-items:center;
    }
    #navHint{text-align:center;color:var(--dim);font:10px var(--mono);letter-spacing:.055em}
    #nextBtn{justify-self:end;min-width:220px}
    #toast{
      position:fixed;left:50%;bottom:91px;z-index:120;transform:translate(-50%,20px);
      opacity:0;pointer-events:none;max-width:min(520px,calc(100% - 30px));
      background:var(--signal);color:#07110a;padding:11px 17px;border-radius:3px;
      box-shadow:0 14px 34px rgba(0,0,0,.35);font:700 12px var(--mono);transition:.2s ease;
    }
    #toast.show{opacity:1;transform:translate(-50%,0)}

    /* cover */
    .cover{min-height:720px}
    .cover .sheet-body{padding:56px 58px 46px}
    .cover-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:42px;align-items:center}
    .cover h1 span{display:block;color:var(--signal);text-shadow:0 0 26px rgba(146,242,158,.16)}
    .cover-deck{max-width:710px;margin:20px 0 28px;color:#c7d6d0;font-size:23px;line-height:1.45}
    .mission-line{
      display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 28px;color:var(--amber);
      font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    }
    .mission-line span{border:1px solid rgba(242,184,75,.32);padding:7px 9px;background:rgba(242,184,75,.04)}
    .intake{display:grid;gap:14px;max-width:720px;padding-top:6px}
    .initial-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .confidence{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .confidence input{grid-column:1/-1;width:100%;accent-color:var(--signal)}
    .confidence strong{color:var(--signal);font:700 13px var(--mono)}
    .hero-visual{position:relative;height:570px}
    .radar{
      position:absolute;width:390px;height:390px;right:5px;top:8px;border:1px solid rgba(146,242,158,.36);border-radius:50%;
      background:
        radial-gradient(circle,transparent 18%,rgba(146,242,158,.11) 18.4%,transparent 18.8%,transparent 38%,rgba(146,242,158,.09) 38.4%,transparent 38.8%,transparent 59%,rgba(146,242,158,.08) 59.4%,transparent 59.8%),
        linear-gradient(90deg,transparent 49.8%,rgba(146,242,158,.15) 50%,transparent 50.2%),
        linear-gradient(transparent 49.8%,rgba(146,242,158,.15) 50%,transparent 50.2%),
        radial-gradient(circle,rgba(39,91,60,.26),rgba(5,12,12,.1) 65%);
      box-shadow:0 0 80px rgba(146,242,158,.08) inset,0 0 42px rgba(0,0,0,.5);
      overflow:hidden;
    }
    .radar::before{
      content:"";position:absolute;inset:50% 50% 50% 50%;width:50%;height:50%;transform-origin:0 0;
      background:conic-gradient(from -20deg,rgba(146,242,158,.36),transparent 28deg);
      animation:sweepRadar 5s linear infinite;
    }
    .radar .blip{position:absolute;width:7px;height:7px;background:var(--signal);border-radius:50%;box-shadow:0 0 16px var(--signal);animation:blip 2.5s infinite}
    .radar .b1{left:32%;top:28%}.radar .b2{left:68%;top:56%;animation-delay:.8s}.radar .b3{left:43%;top:71%;animation-delay:1.5s}
    .hero-card{position:absolute;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 26px 50px rgba(0,0,0,.4);background:#101514}
    .hero-card img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1)}
    .hero-card.news{width:330px;height:232px;right:78px;bottom:10px;transform:rotate(-3deg)}
    .hero-card.mogul{width:210px;height:235px;left:4px;top:190px;transform:rotate(4deg)}
    .hero-card::after{content:attr(data-tag);position:absolute;left:10px;bottom:10px;background:#08110f;color:var(--signal);padding:6px 8px;font:600 9px var(--mono);letter-spacing:.08em}
    .redacted{display:inline-block;background:#07100e;color:#07100e;transform:rotate(-1deg);padding:0 4px;box-shadow:0 0 0 1px rgba(146,242,158,.07)}

    /* Page 1 */
    .phrase-lab{margin-top:20px;padding:20px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
    .phrase-track{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;align-items:center;gap:10px}
    .phrase-card{min-height:128px;padding:17px;border:1px solid rgba(185,219,206,.22);display:flex;flex-direction:column;justify-content:center}
    .phrase-card b{color:var(--signal);font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .phrase-card strong{font-size:19px;line-height:1.35}
    .phrase-arrow{text-align:center;color:var(--amber);font-size:28px}
    .phrase-card.dimmed{opacity:.42;filter:blur(1.8px)}
    .phrase-card.revealed{animation:tune .45s ease both}

    /* Page 2 */
    .timeline-wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:24px}
    .timeline{position:relative;display:grid;gap:10px;padding-left:25px}
    .timeline::before{content:"";position:absolute;left:8px;top:13px;bottom:13px;width:1px;background:rgba(146,242,158,.28)}
    .timeline-event{
      position:relative;border:1px solid var(--paper-line);padding:13px 15px;background:rgba(255,255,255,.42);
      opacity:.28;filter:blur(1px);transform:translateX(6px);transition:.28s ease;
    }
    .timeline-event::before{content:"";position:absolute;left:-22px;top:20px;width:9px;height:9px;background:#958d77;border:3px solid var(--paper)}
    .timeline-event.revealed{opacity:1;filter:none;transform:none}
    .timeline-event.revealed::before{background:#9a6816;box-shadow:0 0 0 3px rgba(154,104,22,.12)}
    .timeline-event b{display:block;color:#885a10;font:700 11px var(--mono);letter-spacing:.08em;margin-bottom:4px}
    .timeline-event strong{font-size:15px}
    .map-panel{
      position:sticky;top:100px;min-height:365px;border:1px solid var(--paper-line);overflow:hidden;
      background:
        radial-gradient(circle at 25% 28%,rgba(167,113,27,.16),transparent 25%),
        linear-gradient(28deg,transparent 48%,rgba(78,71,55,.10) 49%,transparent 50%),
        #d9cfb3;
    }
    .map-panel::before{content:"NEW MEXICO · NOT TO SCALE";position:absolute;top:14px;left:14px;color:#6f6654;font:600 9px var(--mono);letter-spacing:.1em}
    .map-road{position:absolute;left:18%;top:18%;width:63%;height:68%;border-right:2px dashed rgba(89,74,43,.34);transform:rotate(17deg)}
    .map-dot{position:absolute}
    .map-dot i{display:block;width:13px;height:13px;border-radius:50%;background:#273a31;border:3px solid #d9cfb3;box-shadow:0 0 0 1px #273a31}
    .map-dot b{display:block;margin-top:7px;font:700 10px var(--mono);letter-spacing:.04em}
    .map-dot.ranch{left:20%;top:27%;color:#8a5910}.map-dot.ranch i{background:#a56d15;box-shadow:0 0 0 1px #a56d15}
    .map-dot.corona{left:47%;top:18%}.map-dot.roswell{right:13%;bottom:18%}
    .distance{position:absolute;left:30%;top:54%;transform:rotate(21deg);color:#785d2f;font:600 10px var(--mono)}
    .debris-box{position:absolute;left:16px;right:16px;bottom:16px;padding:12px;background:rgba(246,239,216,.86);border:1px solid rgba(77,65,43,.22);font-size:13px}

    /* Page 3 */
    .signal-chain{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:28px 0}
    .chain-node{
      position:relative;min-height:125px;border:1px solid rgba(192,222,210,.2);background:rgba(255,255,255,.025);
      color:var(--white);padding:15px 12px;text-align:left;cursor:pointer;transition:.2s ease;
    }
    .chain-node::after{content:"›";position:absolute;right:-9px;top:45%;color:var(--amber);z-index:2;font-size:24px}
    .chain-node:last-child::after{display:none}
    .chain-node b{display:block;color:var(--dim);font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .chain-node strong{display:block;margin-top:8px;font-family:var(--display);font-size:21px;line-height:1}
    .chain-node span{display:block;margin-top:7px;color:var(--dim);font-size:11px;line-height:1.35}
    .chain-node.open{border-color:var(--signal);background:rgba(79,198,110,.08)}
    .chain-node.open b,.chain-node.open span{color:var(--signal)}
    .access-panel{min-height:150px;border-left:4px solid var(--amber);padding:18px 20px;background:rgba(242,184,75,.06)}
    .access-panel .access-label{color:var(--amber);font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase}
    .access-panel h3{margin:8px 0 10px}
    .atomic-callout{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:center;margin-top:20px;border:1px dashed rgba(255,102,102,.48);padding:16px}
    .atomic-callout strong{font:900 48px var(--display);color:var(--red);text-align:center}

    /* Page 4 */
    .reversal{
      display:grid;grid-template-columns:1fr 72px 1fr;gap:15px;align-items:stretch;margin:24px 0;
    }
    .release-card{padding:22px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
    .release-card.late{border-color:rgba(242,184,75,.45);background:rgba(242,184,75,.06)}
    .release-card time{display:block;color:var(--signal);font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase}
    .release-card.late time{color:var(--amber)}
    .release-card h3{margin:8px 0 12px}
    .clock-flip{align-self:center;text-align:center;color:var(--red);font:900 36px var(--display);line-height:.8}
    .clock-flip span{display:block;margin-top:7px;color:var(--dim);font:600 9px var(--mono);letter-spacing:.08em}
    .fact-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
    .fact-chip{padding:13px;border:1px solid var(--line);color:var(--mist);font-size:13px}
    .fact-chip b{display:block;color:var(--signal);font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
    .classify-list{display:grid;gap:10px}
    .classify-row{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(160,133,76,.22)}
    .classify-row:last-child{border-bottom:0}
    .pill-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .pill{
      border:1px solid rgba(46,55,49,.23);background:rgba(255,255,255,.5);color:#3d463f;
      padding:8px 7px;font:600 9px var(--mono);text-transform:uppercase;cursor:pointer;
    }
    .pill[aria-pressed="true"]{border-color:#8b5d14;color:#754b0b;background:rgba(194,137,45,.12)}
    .pill.correct{border-color:#34784b;color:#245f39;background:rgba(61,143,82,.12)}
    .pill.wrong{border-color:#ad4545;color:#8b2929;background:rgba(183,65,65,.10)}

    /* Page 5 */
    .source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .source-card{position:relative;min-height:355px;border:1px solid var(--line);background:#0d1718;overflow:hidden}
    .source-image{height:188px;position:relative;overflow:hidden;background:#060909}
    .source-image img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);transition:.35s ease}
    .source-card.scanned .source-image img{filter:grayscale(.25) contrast(1.04)}
    .source-image::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#0d1718)}
    .scan-line{position:absolute;left:0;right:0;top:-3px;height:2px;background:var(--signal);box-shadow:0 0 12px var(--signal);opacity:0}
    .source-card.scanning .scan-line{opacity:1;animation:scan 1s ease-in-out}
    .source-copy{padding:14px 17px 17px}
    .source-copy .source-no{color:var(--signal);font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}
    .source-copy h3{margin:5px 0 8px}
    .scan-result{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .source-card.scanned .scan-result{display:grid;animation:rise .25s ease}
    .scan-box{padding:10px;border:1px solid rgba(181,215,202,.16);color:#b8c8c2;font-size:12px;line-height:1.42}
    .scan-box b{display:block;color:var(--amber);font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
    .scan-btn{position:absolute;right:13px;top:152px;z-index:3}

    /* Page 6 */
    .logic-board{padding:24px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
    .logic-line{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:10px}
    .logic-claim{padding:18px;border:1px solid rgba(196,225,214,.2);min-height:118px;display:flex;align-items:center;font-weight:700}
    .logic-symbol{text-align:center;font:900 34px var(--display);color:var(--red)}
    .hypotheses{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:17px}
    .hypothesis{min-height:105px;padding:12px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
    .hypothesis b{color:var(--amber);font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase}
    .hypothesis span{display:block;margin-top:7px;font-size:13px;line-height:1.35}
    .verdict-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
    .verdict-box{padding:16px;border-top:4px solid var(--signal);background:rgba(79,198,110,.07)}
    .verdict-box:nth-child(2){border-color:var(--violet);background:rgba(170,145,232,.07)}
    .verdict-box:nth-child(3){border-color:var(--amber);background:rgba(242,184,75,.07)}
    .verdict-box b{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .verdict-box span{display:block;margin-top:7px;color:var(--mist);font-size:13px}

    /* Page 7 */
    .declass-banner{
      position:relative;margin:-44px -50px 34px;padding:38px 50px 32px;
      background:
        linear-gradient(90deg,rgba(146,242,158,.07),transparent 55%),
        #08110f;border-bottom:1px solid rgba(146,242,158,.22);overflow:hidden;
    }
    .declass-banner::after{
      content:"DECLASSIFIED";position:absolute;right:46px;top:32px;color:rgba(146,242,158,.22);
      border:4px solid currentColor;padding:5px 12px;font:800 28px var(--mono);letter-spacing:.14em;transform:rotate(-5deg);
    }
    .mission-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
    .mission-step{min-height:155px;border:1px solid var(--paper-line);padding:15px;background:rgba(255,255,255,.35);cursor:pointer;text-align:left;color:var(--ink)}
    .mission-step b{display:block;color:#8b5b10;font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .mission-step strong{display:block;font-family:var(--display);font-size:23px;line-height:1;margin-top:8px;text-transform:uppercase}
    .mission-step span{display:none;margin-top:9px;font-size:12px;line-height:1.4;color:#4e574f}
    .mission-step.open{border-color:#a56b11;background:rgba(255,248,222,.8)}
    .mission-step.open span{display:block;animation:rise .2s ease}
    .people-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
    .person{padding:11px;border:1px solid var(--paper-line);background:rgba(255,255,255,.38)}
    .person b{display:block;font-family:var(--display);font-size:18px;text-transform:uppercase}
    .person span{font-size:11px;color:#5d6258}
    .balloon-lab{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;margin-top:24px}
    .balloon-visual{height:440px}
    .component-list{display:grid;gap:9px}
    .component{
      border:1px solid var(--paper-line);background:rgba(255,255,255,.45);color:var(--ink);padding:13px;text-align:left;cursor:pointer;
    }
    .component b{display:block;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#76511a}
    .component span{display:block;margin-top:5px;font-size:13px}
    .component.open{border-color:#3e7d50;background:rgba(77,149,94,.11)}
    .cover-story{margin-top:20px;display:grid;grid-template-columns:1fr auto 1fr;gap:13px;align-items:stretch}
    .cover-box{padding:18px;border:1px solid var(--paper-line);background:rgba(255,255,255,.46)}
    .cover-box b{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#7b5415}
    .cover-box h3{margin:7px 0}
    .cover-arrow{align-self:center;font:900 28px var(--display);color:#9a6816}

    /* Page 8 */
    .match-lab{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:start}
    .match-col{display:grid;gap:9px}
    .match-title{color:#6b624f;font:700 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
    .material{
      min-height:82px;border:1px solid var(--paper-line);background:rgba(255,255,255,.47);color:var(--ink);
      padding:12px 14px;text-align:left;cursor:pointer;transition:.18s ease;
    }
    .material b{display:block;color:#8a5b11;font:700 9px var(--mono);letter-spacing:.06em;text-transform:uppercase}
    .material span{display:block;margin-top:5px;font-size:14px}
    .material.selected{border-color:#9b6410;box-shadow:0 0 0 2px rgba(155,100,16,.12)}
    .material.matched{border-color:#4f8a5d;background:rgba(74,139,91,.12)}
    .material.wrong{animation:shake .28s ease;border-color:#a84949}
    .match-beam{min-height:350px;display:flex;align-items:center;justify-content:center;color:#9a6816;font:900 36px var(--display)}
    .evidence-ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
    .rung{padding:14px;border-top:5px solid #8b5d15;background:rgba(255,255,255,.44)}
    .rung b{display:block;font:700 10px var(--mono);color:#744b0e;text-transform:uppercase}
    .rung span{display:block;margin-top:5px;font-size:13px}
    .flight-box{margin-top:18px;padding:20px;border:1px dashed rgba(150,96,15,.48);background:rgba(255,248,220,.52)}
    .flight-box h3{margin-bottom:9px}

    /* Page 9 */
    .records-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:24px}
    .gao-cover{height:500px}
    .records-stack{display:grid;gap:13px}
    .record-card{border:1px solid var(--line);padding:18px;background:rgba(255,255,255,.025)}
    .record-card b{color:var(--signal);font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .record-card h3{margin:7px 0 10px}
    .record-card ul{margin:8px 0 0;padding-left:20px;color:var(--mist)}
    .record-card li{margin:6px 0}
    .missing-rule{padding:18px;border:2px solid var(--amber);color:#f0e0b9;background:rgba(242,184,75,.07)}
    .missing-rule strong{display:block;color:var(--amber);font:900 31px var(--display);text-transform:uppercase}
    .prediction-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}
    .prediction{padding:12px;border:1px solid var(--line);text-align:center;color:var(--mist);font-size:12px}
    .prediction b{display:block;color:var(--signal);font:900 20px var(--display);text-transform:uppercase}

    /* Page 10 */
    .label-board{display:grid;gap:9px}
    .label-row{display:grid;grid-template-columns:1fr 560px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--paper-line)}
    .label-row:last-child{border-bottom:0}
    .label-options{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    .label-btn{border:1px solid var(--paper-line);background:rgba(255,255,255,.48);color:#4b5149;padding:9px 5px;font:600 8.5px var(--mono);text-transform:uppercase;cursor:pointer}
    .label-btn[aria-pressed="true"]{border-color:#956111;color:#71470a;background:rgba(183,127,36,.12)}
    .label-btn.correct{border-color:#3f8050;color:#2b6c3e;background:rgba(67,142,84,.12)}
    .label-btn.wrong{border-color:#ad4545;color:#8e2e2e}
    .thresholds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .threshold{padding:15px;border:1px solid var(--paper-line);background:rgba(255,255,255,.42)}
    .threshold b{display:block;color:#8c5d12;font:700 9px var(--mono);letter-spacing:.06em;text-transform:uppercase}
    .threshold span{display:block;margin-top:7px;font-size:13px}
    .argument-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .argument-grid .wide{grid-column:1/-1}
    .checklist{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
    .check-item{padding:9px;border:1px solid var(--paper-line);color:#756d5b;font:600 9px var(--mono);text-transform:uppercase}
    .check-item.ok{border-color:#4b865a;color:#316c41;background:rgba(76,142,91,.1)}
    .check-item::before{content:"○";margin-right:7px}.check-item.ok::before{content:"●"}

    /* Final */
    .final-banner{
      margin:-44px -50px 32px;padding:45px 50px 38px;
      background:
        radial-gradient(circle at 82% 20%,rgba(146,242,158,.16),transparent 22rem),
        #071211;border-bottom:1px solid rgba(146,242,158,.24);
    }
    .final-banner h2{color:var(--white)}
    .ready-line{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--mist);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
    .ready-dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 12px rgba(255,102,102,.4)}
    .ready-dot.yes{background:var(--signal);box-shadow:0 0 14px rgba(146,242,158,.55)}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .summary-box{padding:18px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
    .summary-box.wide{grid-column:1/-1}
    .summary-box b{display:block;color:var(--signal);font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
    .summary-box p{color:var(--mist)}
    .shift-meter{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
    .shift-card{padding:15px;border:1px solid var(--line)}
    .shift-card strong{display:block;font-family:var(--display);font-size:24px;text-transform:uppercase}
    .shift-card span{color:var(--dim);font:10px var(--mono)}
    .shift-arrow{color:var(--amber);font:900 30px var(--display)}
    details.sources{margin-top:22px;border:1px solid var(--line)}
    details.sources summary{padding:13px 16px;cursor:pointer;color:var(--signal);font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    details.sources .sources-body{padding:0 18px 16px;color:var(--dim);font-size:12px}
    details.sources li{margin:7px 0}
    details.sources a{color:var(--mist)}

    @keyframes sweep{to{transform:rotate(360deg)}}
    @keyframes sweepRadar{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blip{0%,65%,100%{opacity:.18}70%,82%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes tune{from{opacity:.25;filter:blur(2px);transform:scale(.98)}to{opacity:1;filter:none;transform:none}}
    @keyframes scan{0%{top:0}50%{top:99%}100%{top:0}}
    @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    @media(max-width:980px){
      .top-inner{grid-template-columns:220px 1fr 160px}.top-status-copy{display:none}
      .lesson-grid,.lesson-grid.equal,.cover-grid,.timeline-wrap,.balloon-lab,.records-grid{grid-template-columns:1fr}
      .cover .sheet-body{padding:42px 35px}.hero-visual{height:460px}.map-panel{position:relative;top:auto}
      .signal-chain{grid-template-columns:repeat(3,1fr)}.chain-node:nth-child(3)::after{display:none}
      .reversal{grid-template-columns:1fr}.clock-flip{padding:7px}.fact-strip{grid-template-columns:1fr 1fr}
      .hypotheses{grid-template-columns:repeat(3,1fr)}.mission-steps{grid-template-columns:1fr 1fr}
      .label-row{grid-template-columns:1fr}.label-options{grid-template-columns:repeat(5,1fr)}
    }
    @media(max-width:720px){
      body{font-size:16px}
      #topbar{min-height:66px}.top-inner{min-height:66px;grid-template-columns:1fr auto}.brand small,#meter{display:none}
      #stage{width:calc(100% - 18px);padding-top:84px}.sheet{min-height:0}.sheet-body{padding:30px 20px 36px}
      .docket{padding:0 18px;grid-template-columns:1fr auto}.docket span:nth-child(2){display:none}
      h1{font-size:58px}h2{font-size:45px}.lead{font-size:18px}.case-head{grid-template-columns:1fr}
      .cover .sheet-body{padding:35px 20px}.cover-deck{font-size:19px}.hero-visual{height:410px;margin-top:10px}
      .radar{width:310px;height:310px;right:-20px}.hero-card.news{width:285px;height:200px;right:16px}.hero-card.mogul{width:165px;height:190px}
      .field-grid,.initial-pick,.source-grid,.argument-grid,.summary-grid{grid-template-columns:1fr}
      .argument-grid .wide,.summary-box.wide{grid-column:auto}
      .options.inline{grid-template-columns:1fr}
      .phrase-track{grid-template-columns:1fr}.phrase-arrow{transform:rotate(90deg)}.phrase-card{min-height:92px}
      .timeline-wrap{grid-template-columns:1fr}
      .signal-chain{grid-template-columns:1fr 1fr}.chain-node:nth-child(2n)::after{display:none}.chain-node:nth-child(3)::after{display:block}
      .reversal{grid-template-columns:1fr}.classify-row{grid-template-columns:1fr}.pill-options{grid-template-columns:repeat(3,1fr)}
      .hypotheses,.verdict-trio,.people-strip,.evidence-ladder,.prediction-grid,.thresholds,.checklist{grid-template-columns:1fr 1fr}
      .mission-steps{grid-template-columns:1fr}.cover-story{grid-template-columns:1fr}.cover-arrow{transform:rotate(90deg);text-align:center}
      .match-lab{grid-template-columns:1fr}.match-beam{min-height:25px;transform:rotate(90deg)}
      .label-options{grid-template-columns:1fr 1fr}.shift-meter{grid-template-columns:1fr}.shift-arrow{transform:rotate(90deg);text-align:center}
      #bottomNav{min-height:68px}.nav-inner{min-height:68px;grid-template-columns:auto 1fr auto;gap:8px}
      #navHint{display:none}.nav-inner .btn{min-width:0;padding:9px 12px;font-size:9px}#nextBtn{min-width:0}
      .declass-banner,.final-banner{margin:-30px -20px 28px;padding:32px 20px}.declass-banner::after{font-size:15px;right:17px;top:20px}
    }
    @media(max-width:440px){
      .fact-strip,.hypotheses,.verdict-trio,.people-strip,.evidence-ladder,.prediction-grid,.thresholds,.checklist{grid-template-columns:1fr}
      .signal-chain{grid-template-columns:1fr}.chain-node::after{display:none!important}
      .source-card{min-height:390px}.scan-result{grid-template-columns:1fr}
      .hero-card.mogul{display:none}.hero-card.news{right:-2px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}
    }
    @media print{
      @page{margin:.55in}
      body{background:#fff;color:#000;font-size:10.5pt}
      body::before,body::after,#topbar,#bottomNav,#toast,.screen-only{display:none!important}
      #stage{width:100%;margin:0;padding:0}.sheet{box-shadow:none;border:0;background:#fff;color:#000;min-height:0}
      .sheet::before{display:none}.sheet-body{padding:0}.final-banner{margin:0 0 20px;padding:18px;background:#eee!important;color:#000!important}
      .final-banner h2{color:#000}.summary-grid{display:block}.summary-box{break-inside:avoid;margin:0 0 10px;border:1px solid #888;background:#fff}
      .summary-box p,.ready-line{color:#000}.summary-box b{color:#000}details.sources{display:block}details.sources .sources-body{display:block;color:#000}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#stage">Skip to investigation</a>
  <header id="topbar">
    <div class="top-inner">
      <div class="brand">
        <span class="scope" aria-hidden="true"><i></i></span>
        <div><strong>ROSWELL SIGNAL ROOM</strong><small>HIDDEN HISTORY · FILE 07-47</small></div>
      </div>
      <div id="meter" aria-label="Investigation progress"></div>
      <div class="top-status">

    }catch(e){}
  }

      "<li><a href='https://www.af.mil/The-Roswell-Report/' target='_blank' rel='noopener'>U.S. Air Force, The Roswell Report</a> — official investigation context.</li>"+
      "<li><a href='https://commons.wikimedia.org/wiki/File:Mogul_balloon_train_USAF_1995.png' target='_blank' rel='noopener'>USAF Mogul balloon train image</a>, <a href='https://commons.wikimedia.org/wiki/File:Mogul_corner_reflectors_USAF_1995.png' target='_blank' rel='noopener'>corner-reflector image</a>, and <a href='https://commons.wikimedia.org/wiki/File:Ramey-dubose-debris.jpg' target='_blank' rel='noopener'>Ramey–DuBose debris photograph</a> — public-domain reproductions via Wikimedia Commons.</li>"+
      "</ol><p>Course content follows the supplied Hidden History L003 and L004 classroom-ready decks and their presenter notes. Visuals are embedded so the assignment remains usable if image sites are blocked.</p></div></details>";
  }

  function finalPage(){
    const done=completedSections(),ready=done===10&&S.student.name.trim()&&S.student.hour.trim();
    const pre=HYPOTHESES[S.intake.hypothesis]||"(not selected)",post=HYPOTHESES[S.p10.postHypothesis]||"(not selected)";
    return "<section class='sheet'><div class='sheet-body'><div class='final-banner'><div class='eyebrow'>Signal room · filed record</div><h2>THE CASE UNDER THE LEGEND</h2>"+
      "<p class='lead' id='finalIdentity'>"+esc(S.student.name||"Unnamed investigator")+" · "+esc(S.student.hour||"No class entered")+"</p>"+
      "<div class='ready-line'><span class='ready-dot "+(ready?"yes":"")+"'></span><span>"+(ready?"CASE FILE COMPLETE":"DRAFT · "+done+" OF 10 TRANSMISSIONS CLEARED")+"</span></div></div>"+
      "<div class='shift-meter'><div class='shift-card'><span>Before the evidence · "+S.intake.confidence+"% confidence</span><strong>"+esc(pre)+"</strong></div><div class='shift-arrow'>→</div>"+
      "<div class='shift-card'><span>After the evidence · "+S.p10.postConfidence+"% confidence</span><strong>"+esc(post)+"</strong></div></div>"+
      "<div class='summary-grid' style='margin-top:16px'><div class='summary-box wide'><b>Bounded verdict</b><p>"+esc(S.p10.claim||"No final claim filed.")+"</p></div>"+
      "<div class='summary-box'><b>Evidence 1 · "+esc(evidenceName(S.p10.evidence1))+"</b><p>"+esc(S.p10.reason1||"No explanation filed.")+"</p></div>"+
      "<div class='summary-box'><b>Evidence 2 · "+esc(evidenceName(S.p10.evidence2))+"</b><p>"+esc(S.p10.reason2||"No explanation filed.")+"</p></div>"+
      "<div class='summary-box'><b>Fairest limitation</b><p>"+esc(S.p10.limit||"No limitation filed.")+"</p></div>"+
      "<div class='summary-box'><b>Why the reversal matters</b><p>"+esc(S.p10.reversal||"No analysis filed.")+"</p></div></div>"+
      "<div class='rule'><b>Historian’s discipline</b><br>Confirmed: the program and the first-week messaging. Best-supported: Mogul as the debris explanation. Inferred: the exact flight match. Misleading: the incomplete weather-balloon story. Unproven: extraterrestrial recovery.</div>"+
      "<div class='button-row screen-only'><button class='btn primary' id='copyReport' type='button'>Copy full report</button><button class='btn amber' id='downloadReport' type='button'>Download .txt</button>"+
      "<button class='btn ghost' id='printReport' type='button'>Print / save PDF</button><button class='btn danger' id='resetAll' type='button'>Start a new case</button></div>"+
      "<p class='micro screen-only' style='margin-top:12px'>Attach the downloaded text file in Google Classroom, or use Print / save PDF if your teacher requests a PDF.</p>"+sourcesBlock()+"</div></section>";
  }

  const PAGES=[coverPage,page1,page2,page3,page4,page5,page6,page7,page8,page9,page10,finalPage];

  function sectionDone(n){
    if(n===1)return S.p1.tuned&&S.p1.checked&&S.p1.answer==="category";
    if(n===2)return S.p2.revealed>=TIMELINE.length&&S.p2.checked&&S.p2.answer==="category";
    if(n===3)return S.p3.opened.length>=CHAIN.length&&S.p3.checked&&S.p3.answer==="none";
    if(n===4)return S.p4.checked&&REVERSAL.every(function(r){return S.p4.answers[r.id]===r.answer;});
    if(n===5)return S.p5.scanned.length>=SOURCE_CARDS.length&&S.p5.checked&&S.p5.answer==="reporting";
    if(n===6)return S.p6.checked&&S.p6.answer==="evaluate";
    if(n===7)return S.p7.steps.length>=MISSION_STEPS.length&&S.p7.components.length>=COMPONENTS.length&&S.p7.checked&&S.p7.answer==="cover";
    if(n===8)return S.p8.matches.length>=MATERIAL_PAIRS.length&&S.p8.checked&&S.p8.answer==="converge";
    if(n===9)return S.p9.checked&&S.p9.answer==="gap";
    if(n===10){const c=argumentChecks();return S.p10.checked&&Object.keys(c).every(function(k){return c[k];});}
    return false;
  }
  function completedSections(){let n=0;for(let i=1;i<=10;i++)if(sectionDone(i))n++;return n;}
  function missingForPage(n){
    if(n===1)return !S.p1.tuned?"Tune the three-part phrase transmission first.":"Check and revise the signal question.";
    if(n===2)return S.p2.revealed<TIMELINE.length?"Reveal the complete dated chronology first.":"Check and revise the chronology question.";
    if(n===3)return S.p3.opened.length<CHAIN.length?"Open all six access files first.":"Complete the access audit.";
    if(n===4)return "Classify all four July 8 claims correctly.";
    if(n===5)return S.p5.scanned.length<SOURCE_CARDS.length?"X-ray all four sources first.":"Complete the source-weight question.";
    if(n===6)return "Complete the false-dilemma signal check.";
    if(n===7)return S.p7.steps.length<MISSION_STEPS.length?"Unlock all four mission layers.":S.p7.components.length<COMPONENTS.length?"Install all four balloon-train components.":"Complete the cover-story check.";
    if(n===8)return S.p8.matches.length<MATERIAL_PAIRS.length?"Match all four debris descriptions.":"Complete the convergence check.";
    if(n===9)return "Complete the missing-records check.";
    if(n===10)return "Use the final checklist to complete every part of the field report.";
    return "Complete this transmission.";
  }

  function updateChrome(){
    const meter=byId("meter");meter.innerHTML="";
    for(let i=1;i<=10;i++){
      const s=document.createElement("span");s.className="meter-seg";
      if(sectionDone(i))s.classList.add("done");
      if(S.page===i&&!sectionDone(i))s.classList.add("current");
      s.title="Transmission "+i+(sectionDone(i)?" complete":"");
      meter.appendChild(s);
    }
    byId("stepLabel").textContent=PAGE_LABELS[S.page]||"Filed report";
    const back=byId("backBtn"),next=byId("nextBtn");
    back.disabled=S.page===0;
    next.style.display=S.page===PAGES.length-1?"none":"inline-block";
    next.textContent=NEXT_LABELS[S.page]||"Next";
    const sound=byId("soundBtn");sound.setAttribute("aria-pressed",String(S.sound));sound.textContent=S.sound?"SOUND ON":"SOUND OFF";
  }

  function bindPick(group,setter){
    document.querySelectorAll("[data-pick='"+group+"']").forEach(function(btn){
      btn.addEventListener("click",function(){setter(btn.dataset.value);tone("tap");saveState();render(true);});
    });
  }
  function bindText(id,key,countId,min){
    const el=byId(id);if(!el)return;
    const update=function(){
      S.p10[key]=el.value;
      if(countId){const n=words(el.value),c=byId(countId);c.textContent=n+" / "+min+"+ words";c.classList.toggle("good",n>=min);}
      saveState();refreshChecklist();updateChrome();
    };
    el.addEventListener("input",update);update();
  }
  function refreshChecklist(){const e=byId("argumentChecklist");if(e)e.innerHTML=checklistHtml();}

  function bindCover(){
    const name=byId("studentName"),hour=byId("studentHour"),range=byId("preConfidence");
    name.value=S.student.name;hour.value=S.student.hour;
    name.addEventListener("input",function(){S.student.name=name.value;saveState();});
    hour.addEventListener("input",function(){S.student.hour=hour.value;saveState();});
    document.querySelectorAll("[data-intake]").forEach(function(btn){btn.addEventListener("click",function(){S.intake.hypothesis=btn.dataset.intake;tone("tap");saveState();render(true);});});
    range.addEventListener("input",function(){S.intake.confidence=Number(range.value);byId("preConfidenceValue").textContent=range.value+"%";saveState();});
  }
  function bindP1(){
    byId("tunePhrase").addEventListener("click",function(){S.p1.tuned=true;tone("good");saveState();render(true);});
    bindPick("p1",function(v){S.p1.answer=v;S.p1.checked=false;});
    byId("checkP1").addEventListener("click",function(){S.p1.checked=true;tone(S.p1.answer==="category"?"good":"wrong");saveState();render(true);});
  }
  function bindP2(){
    byId("revealTimeline").addEventListener("click",function(){if(S.p2.revealed<TIMELINE.length)S.p2.revealed++;tone("tap");saveState();render(true);});
    bindPick("p2",function(v){S.p2.answer=v;S.p2.checked=false;});
    byId("checkP2").addEventListener("click",function(){S.p2.checked=true;tone(S.p2.answer==="category"?"good":"wrong");saveState();render(true);});
  }
  function bindP3(){
    document.querySelectorAll("[data-node]").forEach(function(btn){btn.addEventListener("click",function(){
      const id=btn.dataset.node;if(S.p3.opened.indexOf(id)<0)S.p3.opened.push(id);S.p3.active=id;tone("tap");saveState();render(true);
    });});
    bindPick("p3",function(v){S.p3.answer=v;S.p3.checked=false;});
    byId("checkP3").addEventListener("click",function(){S.p3.checked=true;tone(S.p3.answer==="none"?"good":"wrong");saveState();render(true);});
  }
  function bindP4(){
    document.querySelectorAll("[data-classify]").forEach(function(btn){btn.addEventListener("click",function(){S.p4.answers[btn.dataset.classify]=btn.dataset.value;S.p4.checked=false;tone("tap");saveState();render(true);});});
    byId("checkP4").addEventListener("click",function(){S.p4.checked=true;const ok=REVERSAL.every(function(r){return S.p4.answers[r.id]===r.answer;});tone(ok?"good":"wrong");saveState();render(true);});
  }
  function bindP5(){
    document.querySelectorAll("[data-scan]").forEach(function(btn){btn.addEventListener("click",function(){
      const id=btn.dataset.scan;if(S.p5.scanned.indexOf(id)>-1)return;
      const card=btn.closest(".source-card");card.classList.add("scanning");tone("tap");
      setTimeout(function(){S.p5.scanned.push(id);saveState();render(true);},520);
    });});
    bindPick("p5",function(v){S.p5.answer=v;S.p5.checked=false;});
    byId("checkP5").addEventListener("click",function(){S.p5.checked=true;tone(S.p5.answer==="reporting"?"good":"wrong");saveState();render(true);});
  }
  function bindP6(){
    bindPick("p6",function(v){S.p6.answer=v;S.p6.checked=false;});
    byId("checkP6").addEventListener("click",function(){S.p6.checked=true;tone(S.p6.answer==="evaluate"?"good":"wrong");saveState();render(true);});
  }
  function bindP7(){
    document.querySelectorAll("[data-mission]").forEach(function(btn){btn.addEventListener("click",function(){const id=btn.dataset.mission;if(S.p7.steps.indexOf(id)<0)S.p7.steps.push(id);tone("tap");saveState();render(true);});});
    document.querySelectorAll("[data-component]").forEach(function(btn){btn.addEventListener("click",function(){const id=btn.dataset.component;if(S.p7.components.indexOf(id)<0)S.p7.components.push(id);tone("tap");saveState();render(true);});});
    bindPick("p7",function(v){S.p7.answer=v;S.p7.checked=false;});
    byId("checkP7").addEventListener("click",function(){S.p7.checked=true;tone(S.p7.answer==="cover"?"good":"wrong");saveState();render(true);});
  }
  function bindP8(){
    document.querySelectorAll("[data-left]").forEach(function(btn){btn.addEventListener("click",function(){S.p8.selected=btn.dataset.left;tone("tap");saveState();render(true);});});
    document.querySelectorAll("[data-right]").forEach(function(btn){btn.addEventListener("click",function(){
      if(!S.p8.selected){toast("Select a 1947 description on the left first.");tone("wrong");return;}
      const p=MATERIAL_PAIRS.find(function(x){return x.left===S.p8.selected;});
      if(p&&p.right===btn.dataset.right){S.p8.matches.push(p.left);S.p8.selected="";tone("good");saveState();render(true);}
      else{btn.classList.add("wrong");tone("wrong");toast("That material pair does not fit. Try another component.");setTimeout(function(){btn.classList.remove("wrong");},350);}
    });});
    bindPick("p8",function(v){S.p8.answer=v;S.p8.checked=false;});
    byId("checkP8").addEventListener("click",function(){S.p8.checked=true;tone(S.p8.answer==="converge"?"good":"wrong");saveState();render(true);});
  }
  function bindP9(){
    bindPick("p9",function(v){S.p9.answer=v;S.p9.checked=false;});
    byId("checkP9").addEventListener("click",function(){S.p9.checked=true;tone(S.p9.answer==="gap"?"good":"wrong");saveState();render(true);});
  }
  function bindP10(){
    document.querySelectorAll("[data-final-label]").forEach(function(btn){btn.addEventListener("click",function(){S.p10.labels[btn.dataset.finalLabel]=btn.dataset.value;S.p10.checked=false;tone("tap");saveState();render(true);});});
    byId("checkLabels").addEventListener("click",function(){S.p10.checked=true;const ok=FINAL_CLAIMS.every(function(c){return S.p10.labels[c.id]===c.answer;});tone(ok?"good":"wrong");saveState();render(true);});
    document.querySelectorAll("[data-change]").forEach(function(btn){btn.addEventListener("click",function(){const id=btn.dataset.change,i=S.p10.change.indexOf(id);if(i>-1)S.p10.change.splice(i,1);else S.p10.change.push(id);S.p10.checked=false;tone("tap");saveState();render(true);});});
    document.querySelectorAll("[data-post-hyp]").forEach(function(btn){btn.addEventListener("click",function(){S.p10.postHypothesis=btn.dataset.postHyp;S.p10.checked=false;tone("tap");saveState();render(true);});});
    const range=byId("postConfidence");range.addEventListener("input",function(){S.p10.postConfidence=Number(range.value);byId("postConfidenceValue").textContent=range.value+"%";S.p10.checked=false;saveState();});
    const e1=byId("evidence1"),e2=byId("evidence2");
    e1.addEventListener("change",function(){S.p10.evidence1=e1.value;S.p10.checked=false;saveState();refreshChecklist();});
    e2.addEventListener("change",function(){S.p10.evidence2=e2.value;S.p10.checked=false;saveState();refreshChecklist();});
    bindText("finalClaim","claim","countClaim",25);bindText("reason1","reason1","countReason1",12);bindText("reason2","reason2","countReason2",12);
    bindText("finalLimit","limit","countLimit",12);bindText("reversalAnswer","reversal","countReversal",15);
    byId("checkArgument").addEventListener("click",function(){
      S.p10.checked=true;const c=argumentChecks(),ok=Object.keys(c).every(function(k){return c[k];});tone(ok?"good":"wrong");saveState();render(true);toast(ok?"Field report cleared.":"Use the checklist to finish the report.");
    });
  }
  function bindFinal(){
    byId("copyReport").addEventListener("click",function(){copyText(buildReport());});
    byId("downloadReport").addEventListener("click",function(){downloadText(buildReport());});
    byId("printReport").addEventListener("click",function(){window.print();});
    byId("resetAll").addEventListener("click",function(){
      if(confirm("Clear every answer on this device and open a new Roswell case?")){localStorage.removeItem(STORAGE_KEY);S=clone(DEFAULT_STATE);render(false);toast("New case opened.");}
    });
  }
  function bindPage(){
    if(S.page===0)bindCover();
    else if(S.page===1)bindP1();
    else if(S.page===2)bindP2();
    else if(S.page===3)bindP3();
    else if(S.page===4)bindP4();
    else if(S.page===5)bindP5();
    else if(S.page===6)bindP6();
    else if(S.page===7)bindP7();
    else if(S.page===8)bindP8();
    else if(S.page===9)bindP9();
    else if(S.page===10)bindP10();
    else if(S.page===11)bindFinal();
  }

  function render(preserveScroll){
    const y=window.scrollY;
    byId("stage").innerHTML=PAGES[S.page]();
    bindPage();updateChrome();
    if(preserveScroll)window.scrollTo(0,y);else{window.scrollTo(0,0);byId("stage").focus({preventScroll:true});}
  }

  function buildReport(){
    const c=argumentChecks(),L=[];
    L.push("THE ROSWELL SIGNAL — HIDDEN HISTORY FIELD REPORT");
    L.push("Investigator: "+(S.student.name||"(blank)"));
    L.push("Class / hour: "+(S.student.hour||"(blank)"));
    L.push("Transmissions cleared: "+completedSections()+" of 10");
    L.push("");
    L.push("EVIDENCE SHIFT");
    L.push("Before: "+(HYPOTHESES[S.intake.hypothesis]||"(blank)")+" · "+S.intake.confidence+"% confidence");
    L.push("After: "+(HYPOTHESES[S.p10.postHypothesis]||"(blank)")+" · "+S.p10.postConfidence+"% confidence");
    L.push("");
    L.push("BOUNDED VERDICT");
    L.push(S.p10.claim||"(blank)");
    L.push("");
    L.push("EVIDENCE 1 — "+evidenceName(S.p10.evidence1));
    L.push(S.p10.reason1||"(blank)");
    L.push("");
    L.push("EVIDENCE 2 — "+evidenceName(S.p10.evidence2));
    L.push(S.p10.reason2||"(blank)");
    L.push("");
    L.push("FAIREST LIMITATION");
    L.push(S.p10.limit||"(blank)");
    L.push("");
    L.push("WHY THE SAME-DAY REVERSAL MATTERS");
    L.push(S.p10.reversal||"(blank)");
    L.push("");
    L.push("CLAIM CALIBRATION");
    FINAL_CLAIMS.forEach(function(x){L.push("- "+x.text+" — "+(FINAL_LABELS[S.p10.labels[x.id]]||"(blank)"));});
    L.push("");
    L.push("WHAT COULD CHANGE THE VERDICT");
    const changeNames={material:"Chain-of-custody material unlike Mogul hardware",records:"Dated records placing a different craft at the site",occupants:"Independent contemporary evidence of occupants or technology"};
    if(S.p10.change.length)S.p10.change.forEach(function(x){L.push("- "+changeNames[x]);});else L.push("(blank)");
    L.push("");
    L.push("FINAL CHECK: "+(Object.keys(c).every(function(k){return c[k];})?"CLEARED":"DRAFT"));
    L.push("Generated in The Roswell Signal interactive Hidden History hub.");
    return L.join("\n");
  }
  function copyText(txt){
    const done=function(){toast("Full field report copied.");tone("good");};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done).catch(function(){legacyCopy(txt,done);});
    else legacyCopy(txt,done);
  }
  function legacyCopy(txt,done){
    const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(e){toast("Use Download instead.");}document.body.removeChild(ta);
  }
  function downloadText(txt){
    try{
      const blob=new Blob([txt],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download="Roswell Signal Report - "+((S.student.name||"student").replace(/[^a-z0-9 _-]/gi,"").trim()||"student")+".txt";
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);toast("Field report downloaded.");tone("good");
    }catch(e){toast("Use Copy full report instead.");}
  }

  byId("soundBtn").addEventListener("click",function(){S.sound=!S.sound;saveState();updateChrome();tone("good");});
  byId("backBtn").addEventListener("click",function(){if(S.page>0){S.page--;saveState();render(false);}});
  byId("nextBtn").addEventListener("click",function(){
    if(S.page===0){
      if(!S.student.name.trim()||!S.student.hour.trim()||!S.intake.hypothesis){toast("Add your name, class, and opening hypothesis before entering.");tone("wrong");return;}
    }else if(S.page>=1&&S.page<=10&&!sectionDone(S.page)){toast(missingForPage(S.page));tone("wrong");return;}
    if(S.page<PAGES.length-1){S.page++;saveState();tone("good");render(false);}
  });
  render(false);
  </script>
</body>
</html>
