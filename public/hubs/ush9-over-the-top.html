<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Over the Top · The American Fight, 1918</title>
<style>
:root{--olive:#1d2016;--olive2:#2a2e20;--khaki:#c9b98c;--paper:#ece2c6;--ink:#1c1a12;--rust:#b5562b;--dim:#9a9274}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;color:var(--paper)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
#brand{position:fixed;right:18px;top:14px;z-index:5;text-align:right;pointer-events:none;text-shadow:0 2px 10px #000}
#brand .a{font:700 12px 'Courier New',Courier,monospace;letter-spacing:.3em;color:var(--khaki)}
#brand .b{font-size:24px;color:#f4ead0;margin-top:4px}
#panel{position:fixed;left:0;top:0;bottom:0;width:440px;max-width:100%;z-index:6;background:linear-gradient(180deg,rgba(29,32,22,.97),rgba(22,24,17,.97));border-right:1px solid #4a4a32;display:flex;flex-direction:column}
body.scoping #panel{transform:translateX(-100%)}
#panel{transition:transform .4s}
#card{overflow-y:auto;padding:26px 28px 110px;flex:1;scrollbar-color:#4a4a32 transparent}
.when{font:700 12px 'Courier New',Courier,monospace;letter-spacing:.18em;color:#e0a46a;text-transform:uppercase}
h1,h2.ttl{font-size:38px;line-height:1.05;margin:8px 0 10px;color:#f4ead0;font-weight:600}
.lead{font-size:19px;font-style:italic;color:#e6dab8;line-height:1.45}
p{font-size:17px;line-height:1.62;margin:0 0 14px}
blockquote{margin:16px 0;padding:14px 16px;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.5;font-style:italic;border-left:4px solid var(--rust);box-shadow:0 4px 14px rgba(0,0,0,.4)}
blockquote cite{display:block;margin-top:8px;font:12px 'Courier New',Courier,monospace;font-style:normal;color:#5a503a}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:16px 0;border-top:1px solid #45452f}
.stats dt,.stats dd{margin:0;padding:8px 0;border-bottom:1px solid #45452f;font-size:14.5px}
.stats dt{font:12px 'Courier New',Courier,monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;padding-right:10px}
.stats dd{color:#f0c88f}
.look{font-size:15px;color:var(--khaki);font-style:italic}
.read{background:none;border:1px solid #4a4a32;color:var(--dim);font:12px 'Courier New',Courier,monospace;padding:6px 10px;border-radius:3px;cursor:pointer;margin:0 0 12px}
.act{display:block;width:100%;margin:14px 0;padding:13px;border:0;border-radius:4px;background:var(--khaki);color:var(--ink);font:700 14px 'Courier New',Courier,monospace;letter-spacing:.06em;cursor:pointer}
.act.hot{background:var(--rust);color:#fff}
.q{background:var(--paper);color:var(--ink);padding:16px 18px;margin-top:20px;font-size:16.5px;line-height:1.5;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.45);transform:rotate(-.4deg)}
.ql{font:700 12px 'Courier New',Courier,monospace;letter-spacing:.2em;color:var(--rust);text-transform:uppercase;margin-bottom:6px}
.q ol{margin:0;padding-left:20px}.q li{margin-bottom:10px}
.video{position:relative;margin:16px 0;border-radius:4px;overflow:hidden;cursor:pointer;background:#000;aspect-ratio:16/9}.video img{width:100%;height:100%;object-fit:cover;opacity:.75;display:block}.video button{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:66px;height:46px;border-radius:10px;border:0;background:rgba(181,86,43,.95);color:#fff;font-size:22px;cursor:pointer}.vcap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,#000);font-size:13px}.video iframe{width:100%;height:100%;border:0;display:block}
#nav{position:fixed;left:440px;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;align-items:center;z-index:5}
body.scoping #nav{left:0}
#nav>button{width:46px;height:46px;border-radius:50%;border:1px solid #6a6446;background:rgba(20,22,15,.9);color:var(--khaki);font-size:20px;cursor:pointer}
#nav>button:disabled{opacity:.3}
#stops{display:flex;gap:4px;background:rgba(20,22,15,.85);padding:6px;border-radius:30px;border:1px solid #4a4a32}
#stops button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--dim);font:700 13px 'Courier New',Courier,monospace;cursor:pointer}
#stops button.on{background:var(--khaki);color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.plabel{position:absolute;left:0;top:0;display:none;transform-origin:0 0;margin:-12px 0 0 -6px}
.plabel b{display:inline-block;background:var(--rust);color:#fff;font:700 13px 'Courier New',Courier,monospace;padding:4px 8px;border-radius:2px}
.plabel span{display:block;max-width:190px;background:rgba(236,226,198,.95);color:var(--ink);font-size:12.5px;line-height:1.35;padding:5px 8px;margin-top:2px}
#scope{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 30vmin,rgba(0,0,0,.92) 31vmin,#000 60vmin);box-shadow:inset 0 0 0 9999px rgba(40,60,40,.08)}
#scope.on{opacity:1}
#scope:after{content:"PERISCOPE · DRAG TO SCAN · ESC TO LOWER";position:absolute;bottom:90px;left:0;right:0;text-align:center;font:700 12px 'Courier New',Courier,monospace;letter-spacing:.25em;color:#c9b98c}
#scopeexit{position:fixed;top:16px;left:16px;z-index:7;display:none}
body.scoping #scopeexit{display:block}
#fade{position:fixed;inset:0;z-index:8;background:#0a0a08;opacity:0;pointer-events:none;transition:opacity 1.6s 4.4s}
#fade.on{opacity:1}
#final{position:fixed;inset:0;z-index:9;display:none;overflow-y:auto;background:#0a0a08}
#final.on{display:block}
.finner{max-width:760px;margin:0 auto;padding:60px 24px 80px}
.finner h1,.finner h2.ttl{font-size:48px}
.video.big{margin:24px 0}
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 60%,#3a2c1c,#0b0b09 72%);transition:opacity .9s}
#intro.gone{opacity:0;pointer-events:none}
#intro .iy{font:700 13px 'Courier New',Courier,monospace;letter-spacing:.4em;color:#e0a46a;animation:rise 1s .2s both}
#intro .it{font-weight:400;font:700 clamp(54px,10vw,124px) 'Courier New',Courier,monospace;letter-spacing:.08em;color:#f4ead0;margin:14px 0 10px;animation:rise 1.2s .4s both}
#intro .is{max-width:560px;margin:0 auto;font-size:20px;line-height:1.5;color:#e6dab8;font-style:italic;animation:rise 1.2s .8s both}
#intro button{margin-top:34px;background:var(--rust);border:0;color:#fff;font:700 15px 'Courier New',Courier,monospace;letter-spacing:.2em;text-transform:uppercase;padding:16px 34px;cursor:pointer;animation:rise 1s 1.3s both}
#intro .ih{margin-top:22px;font:12px 'Courier New',Courier,monospace;color:var(--dim);animation:rise 1s 1.6s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#111;color:var(--khaki);font:14px 'Courier New',Courier,monospace;letter-spacing:.3em;z-index:50}
@media (max-width:860px){#panel{top:auto;height:50%;width:100%;border-right:0;border-top:1px solid #4a4a32}#nav{left:0;bottom:calc(50% + 8px)}h2.ttl{font-size:30px}}
</style>

he French Army. The French gave them French helmets and rifles and sent them to the front. The regiment served about 191 days in combat.","On the night of May 15, 1918, Private Henry Johnson and Private Needham Roberts were on sentry duty when a German raiding party of about twenty men attacked. Both Americans were badly wounded. Johnson kept fighting with grenades, the butt of his rifle and finally a bolo knife until the Germans fled. He took 21 wounds. France awarded him the Croix de Guerre. The United States did not award him the Medal of Honor until 2015, 86 years after his death."],voice:{text:"There wasn\u2019t anything so fine about it. Just fought for my life. A rabbit would have done that.",who:"Henry Johnson, 369th Infantry, after returning home"},stats:[["Days in combat","about 191"],["Fought under","French command"],["Medal of Honor for Henry Johnson","awarded June 2, 2015"]],video:{id:"eEuoAl1elLU",title:"The Harlem Hellfighters, from HISTORY"},question:"The Hellfighters were sent to fight under the French because of segregation in the U.S. Army. What does their story tell you about what fighting for America meant for Black soldiers in 1918?"},{id:"periscope",when:"No man\u2019s land",title:"Do Not Look Up",lead:"A soldier who raised his head over the parapet in daylight could be dead before he knew a sniper had seen him.",body:["The ground between the two front lines was called no man\u2019s land. In some places the enemy trench was less than a hundred yards away. In others it was half a mile. It was a stretch of overlapping shell holes and broken wire, with bodies lying where no one could safely reach them.","To watch it safely, men used trench periscopes, two mirrors in a wooden box that let a soldier see over the top while his head stayed below it. At night, patrols crawled out to repair wire, listen at enemy lines or raid a trench to grab prisoners. Flares drifted down on small parachutes and lit the ground bright white. Anyone caught standing in the open held perfectly still until the flare burned out, because movement drew fire."],stats:[["Distance between lines","under 100 yards to about half a mile"],["Safest way to look","a trench periscope"],["Night work","patrols, wiring parties and raids"]],action:"periscope",question:"Use the periscope. Describe what you see in no man\u2019s land and explain why crossing it in daylight was so deadly."},{id:"lost",when:"October 2 to 8, 1918",title:"The Lost Battalion",lead:"Cut off in a ravine in the Argonne Forest, about 550 Americans held out for six days with almost no food and very little water.",body:["Major Charles Whittlesey\u2019s men pushed forward as ordered on October 2, but the units on their flanks did not. German troops closed in behind them. For days the trapped Americans fought off attacks from every side and drank from a stream the Germans had covered with machine guns.","Then American artillery, aiming at the Germans, began landing shells on the trapped battalion itself. Whittlesey sent his last carrier pigeon, Cher Ami. The bird was shot through the breast, lost most of a leg and was blinded in one eye, and still reached the American lines about 25 miles away. The shelling stopped. When the battalion was finally relieved, only about 194 men walked out."],voice:{text:"We are along the road parallel 276.4. Our own artillery is dropping a barrage directly on us. For heaven\u2019s sake stop it.",who:"Message carried by Cher Ami, October 4, 1918"},stats:[["Men cut off","about 550"],["Walked out","about 194"],["Cher Ami today","preserved at the Smithsonian"]],question:"Why do you think the story of the Lost Battalion became so famous in the United States, even though it was a small part of a huge battle?"},{id:"york",when:"October 8, 1918",title:"Sergeant York",lead:"A Tennessee farmer who first asked not to fight became the most famous American soldier of the war.",body:["Alvin York grew up in the mountains of Tennessee and belonged to a church that taught against violence. When he was drafted he asked to be excused as a conscientious objector. He was turned down. After long talks with his battalion commander, he decided he could fight with a clear conscience.","On October 8, 1918, in the Argonne, York was one of 17 soldiers sent behind German lines to silence machine guns. After nine of them were killed or wounded, York, a crack shot from years of hunting, took on the machine gunners. By the end of the fight he and the seven survivors marched 132 German prisoners back to the American lines. He received the Medal of Honor, and in 1941 Hollywood made a movie of his life."],stats:[["Prisoners taken","132"],["Americans in the patrol","17"],["Award","Medal of Honor"]],question:"York first asked not to fight because of his faith. How does his story complicate the idea of what a war hero is?"},{id:"over",when:"September 26 to November 11, 1918",title:"Over the Top",lead:"This ladder is the last thing between you and no man\u2019s land.",body:["The Meuse-Argonne offensive put more than a million American soldiers into one battle, the largest in American history. For 47 days they attacked through forests and ridges the Germans had spent four years fortifying. It cost 26,277 American lives.","War was not the only killer. In 1918 a deadly influenza swept the world, and crowded troop ships and camps spread it fast. Of the 116,516 Americans who died in military service during the war, 53,402 were killed in battle. More than 63,000 died of other causes, most of them from disease, led by influenza and pneumonia."],stats:[["Americans in the offensive","more than 1 million"],["Americans killed","26,277 in 47 days"],["All U.S. military deaths","116,516, more than half not from combat"]],action:"over",question:"More than half of American military deaths in World War I did not come from combat. Why would living conditions at the front and on troop ships make that possible?"}],Ph=[["Parapet","Sandbagged wall facing the enemy","front",2.5],["Fire step","Ledge soldiers stood on to fire over the parapet","front",.75],["Duckboards","Wooden slats over the mud and water","floor",.15],["Parados","Rear wall, protects against shells bursting behind","back",2.4],["Traverse","Sharp turn in the trench that stops blasts and bullets from traveling far","traverse",1.6],["Revetment","Planks and wire holding the dirt walls up","back",1.2]],li={title:"11 a.m., November 11, 1918",body:["German officials signed the armistice in a railroad car in the forest of Compi\xE8gne at about 5 a.m. It would take effect six hours later, at the eleventh hour of the eleventh day of the eleventh month.","Fighting went on right up to the last minute. Private Henry Gunther of Baltimore charged a German machine gun at 10:59 a.m. and is usually counted as the last American soldier killed in the war. Then the guns stopped.","The film below recreates a strip of film from American sound ranging equipment, which recorded the sound of enemy guns so they could be located. It shows the moment the war ended. Watch the lines go flat."],video:{id:"1pjY9W-S3cI",title:"The moment the guns fell silent, recreated from a 1918 sound ranging record"},questions:["You walked a trench with seven stops today. Choose the one story that stuck with you most. Explain what happened and why it matters, in about 150 words.","Connect all three days. Pick one weapon from the Arsenal and one battle from the Line, and explain how the American soldiers in today\u2019s trench would have faced both."]};function Lh(i,t=!1){let e=i[0].index!==null,n=new Set(Object.keys(i[0].attributes)),s=new Set(Object.keys(i[0].morphAttributes)),r={},o={},a=i[0].morphTargetsRelative,c=new pe,l=0;for(let h=0;h<i.length;++h){let u=i[h],d=0;if(e!==(u.index!==null))return console.error("THREE.BufferGeometryUtils: .mergeGeometries() failed with geometry at index "+h+". All geometries must have compatible attributes; make sure index attribute exists among all geometries, or in none of them.
