<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manifest Expanse: 1848 · Grant Desk</title>
<meta name="description" content="Manifest Expanse: 1848 — the expanded Oregon Trail deck-building edition. A separate version of Manifest: 1848 with its own expedition saves.">
<style>
:root{
  --ink:#2b1d10; --paper:#efe1c2; --paper2:#e3cfa3; --brass:#c9a25a; --brass2:#8a6a2c; --blood:#8e2a1e;
  --green:#3c5a32; --navy:#1f2c45; --cw:clamp(118px,10.6vw,196px); --ch:calc(var(--cw)*1.62);
  --serif:Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif;
  --slab:Rockwell,'Rockwell Extra Bold','Clarendon','Roboto Slab','Courier New',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#120c07;color:var(--paper);font-family:var(--serif);user-select:none;-webkit-user-select:none}
button{font-family:var(--slab);cursor:pointer}
img{-webkit-user-drag:none}
#root{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;background-size:cover;background-position:center}
.screen.on{display:block}
.vignette::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.7em 1.5em;font-size:clamp(14px,1.25vw,22px);letter-spacing:.06em;text-transform:uppercase;color:#2b1a08;
  background:linear-gradient(#f3d98f,#c99b42 55%,#9c7027);border:2px solid #4a3212;border-radius:6px;box-shadow:0 3px 0 #3a260c,0 6px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);text-shadow:0 1px 0 rgba(255,255,255,.4);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a260c}
.btn.dark{background:linear-gradient(#5b4a36,#3b2c1d);color:var(--paper);text-shadow:none;border-color:#1c130a}
.btn.red{background:linear-gradient(#c45a3f,#8e2a1e);color:#fff3dc;text-shadow:0 1px 0 #000}
.btn[disabled]{filter:grayscale(.8) brightness(.7);pointer-events:none}
.iconbtn{background:rgba(20,12,6,.7);border:1px solid #6b5030;color:var(--paper);border-radius:6px;padding:.35em .6em;font-size:clamp(12px,1vw,17px)}
.iconbtn:hover{background:rgba(60,40,20,.9)}

/* panels */
.paper{background:url(/hubs/manifest-1848/art/paper.webp) center/cover, var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 3px #5a3f1c,0 0 0 6px #c9a25a}
.h1{font-family:var(--slab);font-weight:900;letter-spacing:.04em}

/* ---------- TITLE ---------- */
#title{background-image:url(/hubs/manifest-1848/art/bg_title.webp)}
#title .menu{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:flex;gap:1.2em;flex-wrap:wrap;justify-content:center}
#title .credit{position:absolute;right:1.2em;bottom:.8em;font-size:12px;opacity:.6}

/* ---------- WAGON SELECT ---------- */
#select{background-image:url(/hubs/manifest-1848/art/bg_independence.webp)}
#select .wrap{position:absolute;inset:4% 4% 4% 4%;display:flex;flex-direction:column;gap:1.2vh}
#select h2{font-family:var(--slab);font-size:clamp(24px,2.6vw,46px);text-align:center;color:#fff3d6;text-shadow:0 3px 10px #000}
#select .sub{text-align:center;font-size:clamp(13px,1.1vw,19px);color:#f6e6c3;text-shadow:0 2px 6px #000}
.wagons{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw;min-height:0}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;padding:1.2vh 1vw;cursor:pointer;transition:transform .15s,box-shadow .15s;overflow:hidden}
.wcard:hover{transform:translateY(-6px)}
.wcard.sel{box-shadow:0 0 0 4px #fff2c4,0 0 30px 8px rgba(255,210,120,.8),0 10px 40px rgba(0,0,0,.6)}
.wcard img{width:92%;height:22vh;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.wcard .wn{font-family:var(--slab);font-size:clamp(15px,1.35vw,24px);font-weight:900;text-align:center}
.wcard .wt{font-size:clamp(11px,.85vw,15px);text-transform:uppercase;letter-spacing:.2em;color:var(--blood);font-weight:bold}
.wcard .stats{display:flex;gap:.8em;margin:.6vh 0;font-size:clamp(12px,1vw,17px);font-weight:bold}
.wcard .stats span{display:flex;align-items:center;gap:.25em}
.wcard .stats img{width:1.6em;height:1.6em}
.wcard .pas{font-size:clamp(12px,.95vw,16px);text-align:center;line-height:1.3}
.wcard .pas b{display:block;font-family:var(--slab);color:var(--navy)}
.wcard .blurb{font-style:italic;font-size:clamp(11px,.85vw,15px);text-align:center;margin-top:.6vh;opacity:.85}
#select .bottom{display:flex;justify-content:center;align-items:center;gap:2vw}
.seg{display:flex;border:2px solid #4a3212;border-radius:6px;overflow:hidden}
.seg button{padding:.6em 1em;background:#3b2c1d;color:var(--paper);border:0;font-size:clamp(12px,1vw,17px)}
.seg button.on{background:linear-gradient(#f3d98f,#c99b42);color:#2b1a08}
.crewpick{display:flex;gap:1vw;justify-content:center}
.crewopt{width:clamp(150px,13vw,240px);padding:.8vh .6vw;text-align:center;cursor:pointer;transition:transform .15s}
.crewopt:hover{transform:translateY(-4px)}
.crewopt img{width:70%;border:3px solid #3a2a16;border-radius:4px}
.crewopt b{display:block;font-family:var(--slab);font-size:clamp(13px,1.1vw,19px)}
.crewopt span{font-size:clamp(11px,.85vw,15px);line-height:1.25;display:block}

/* Phase 5 expedition seed entry. */
.seed-label{display:flex;align-items:center;gap:.4em;background:#1e140cd9;padding:.45em .6em;border:1px solid #c9a25a;color:#fff0cc;font-weight:800;font-size:clamp(11px,.9vw,17px);border-radius:6px}
.seed-label input{background:#f8ecd5;color:#2b1d10;border:2px solid #9f7c42;border-radius:4px;width:clamp(85px,9vw,140px);font-family:monospace;font-size:1em;padding:.4em;user-select:text;-webkit-user-select:text}
@media(max-width:900px){#select .bottom{flex-wrap:wrap;gap:.5vw}.seed-label{font-size:12px}}
/* ---------- TOP HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;height:clamp(44px,5.4vh,64px);display:flex;align-items:center;gap:1.2vw;padding:0 1vw;background:linear-gradient(#2a1c10,#1a110a);border-bottom:2px solid #8a6a2c;box-shadow:0 4px 14px rgba(0,0,0,.6);z-index:30;font-size:clamp(13px,1.1vw,19px)}
.hud .it{display:flex;align-items:center;gap:.35em;white-space:nowrap}
.hud .it img{height:1.9em;width:1.9em}
.hud .loc{font-family:var(--slab);color:#f3d98f;letter-spacing:.05em}
.hud .grow{flex:1}
.hpbar{position:relative;width:clamp(110px,11vw,220px);height:1.25em;background:#3a120c;border:2px solid #000;border-radius:10px;overflow:hidden}
.hpbar i{position:absolute;inset:0;background:linear-gradient(#e0533b,#9a2316);transition:width .35s}
.hpbar span{position:absolute;inset:0;text-align:center;font-weight:bold;font-size:.85em;line-height:1.3em;text-shadow:0 1px 2px #000}
.load.over{color:#ff7a5c;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.relics{display:flex;gap:.2em}
.relics img{height:1.9em;width:1.9em;object-fit:contain;filter:drop-shadow(0 2px 2px #000);cursor:help}

/* crew strip */
.crewstrip{position:absolute;left:1vw;top:calc(clamp(44px,5.4vh,64px) + 1vh);display:flex;gap:.6vw;z-index:20}
.crewp{position:relative;width:clamp(56px,5.2vw,96px);aspect-ratio:1;border:3px solid #c9a25a;border-radius:6px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.6);background:#000;cursor:help}
.crewp img{width:100%;height:100%;object-fit:cover;transition:filter .3s}
.crewp.sick img{filter:sepia(.4) hue-rotate(40deg) saturate(.7) brightness(.85)}
.crewp.alarm{animation:shake .4s 2}
.crewp.used{opacity:.55}
.crewp .act{position:absolute;bottom:0;left:0;right:0;font-size:10px;background:rgba(0,0,0,.75);color:#f3d98f;text-align:center;padding:1px}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* tooltip */
#tip{position:fixed;z-index:200;max-width:300px;padding:.6em .8em;background:#1b120a;border:1px solid #c9a25a;color:var(--paper);font-size:14px;line-height:1.35;border-radius:6px;pointer-events:none;display:none;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#tip b{color:#f3d98f;font-family:var(--slab)}

/* ---------- MAP ---------- */
#map{background:#2a1c10}
#map .board{position:absolute;inset:clamp(44px,5.4vh,64px) 0 0 0;background:url(/hubs/manifest-1848/art/bg_map.webp) center/cover}
#map .board::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,240,200,.15),rgba(60,35,10,.45))}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map .node{position:absolute;width:clamp(48px,4.6vw,84px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:default;transition:transform .15s,filter .2s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5)) grayscale(.55) brightness(.8)}
#map .node img{width:100%;height:100%}
#map .node.done{filter:grayscale(1) brightness(.55) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#map .node.cur{filter:drop-shadow(0 0 10px #fff2a8)}
#map .node.avail{filter:drop-shadow(0 0 12px #ffd76a) drop-shadow(0 4px 4px rgba(0,0,0,.5));cursor:pointer;animation:bob 1.2s ease-in-out infinite}
#map .node.avail:hover{transform:translate(-50%,-50%) scale(1.18);animation:none}
#map .node.elite img{filter:hue-rotate(-30deg) saturate(1.6)}
#map .node.boss{width:clamp(80px,8vw,150px)}
#map .node .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--slab);font-size:clamp(10px,.8vw,14px);color:#2b1d10;background:rgba(239,225,194,.9);padding:0 .4em;border-radius:3px;margin-top:2px}
@keyframes bob{50%{transform:translate(-50%,-56%)}}
#map .banner{position:absolute;top:calc(clamp(44px,5.4vh,64px) + 1.2vh);left:50%;transform:translateX(-50%);text-align:center;padding:.5em 2em;z-index:5}
#map .banner .h1{font-size:clamp(20px,2vw,36px)}
#map .banner .route{font-size:clamp(12px,1vw,17px);font-style:italic}
#map .legend{position:absolute;right:1vw;bottom:1.5vh;padding:.4em .8em;font-size:clamp(11px,.85vw,15px);display:flex;flex-wrap:wrap;gap:.3em 1em;align-items:center;max-width:60vw;z-index:5}
#map .legend .li{display:flex;align-items:center;gap:.3em;white-space:nowrap}
#map .legend img{width:1.8em}
#map .legend small{opacity:.7}
#map .trailbar{position:absolute;left:1vw;bottom:1.5vh;width:clamp(220px,26vw,460px);padding:.6em .9em;z-index:5;font-size:clamp(11px,.9vw,15px)}
#map .trailbar .bar{height:10px;background:#bfa774;border:1px solid #5a3f1c;border-radius:6px;margin:.3em 0;overflow:hidden}
#map .trailbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#7a5a24,#c9a25a)}

/* ---------- COMBAT ---------- */
#combat .stage{position:absolute;inset:0;background-size:cover;background-position:center 60%}
#combat .stage::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.85));pointer-events:none}
.wx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.75;background-size:60% auto;z-index:3}
.wx.rain{background-image:url(/hubs/manifest-1848/art/wx_rain.webp);animation:rain .6s linear infinite}
.wx.snow{background-image:url(/hubs/manifest-1848/art/wx_snow.webp);animation:snow 6s linear infinite}
@keyframes rain{to{background-position:-80px 400px}}
@keyframes snow{to{background-position:200px 700px}}
.track{position:absolute;left:3%;right:34%;bottom:calc(var(--ch)*.7 + 2vh);height:27vh;z-index:4}
.rig{position:absolute;bottom:0;left:0;height:100%;display:flex;align-items:flex-end;transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.rig .wag{height:78%;filter:drop-shadow(0 10px 6px rgba(0,0,0,.5))}
.rig .wag.flip{transform:scaleX(-1)}
.rig .ox{height:46%;margin-left:-4%;filter:drop-shadow(0 8px 5px rgba(0,0,0,.5));animation:oxstep .5s steps(1) infinite}
.rig.idle .ox{animation-play-state:paused}
.rig .dust{position:absolute;left:-10%;bottom:0;height:30%;opacity:0;transition:opacity .3s}
.rig.moving .dust{opacity:.9}
.shieldb{position:absolute;left:4%;top:-8%;width:clamp(56px,5vw,90px);aspect-ratio:1;display:none;z-index:6}
.shieldb.on{display:block;animation:pop .25s}
.shieldb img{width:100%}
.shieldb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--slab);font-weight:900;font-size:clamp(18px,1.8vw,32px);color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000}
@keyframes pop{from{transform:scale(.4)}}
.foe{position:absolute;right:3%;bottom:calc(var(--ch)*.76 + 3vh);width:clamp(190px,19vw,360px);z-index:6;text-align:center}
.foe .art{position:relative;width:100%;aspect-ratio:1;border:4px solid #2b1d10;outline:3px solid #c9a25a;border-radius:4px;background-size:cover;background-position:center;box-shadow:0 12px 30px rgba(0,0,0,.7)}
.foe.elite .art{outline-color:#d66b4b}
.foe.boss .art{outline:4px solid #ff9a5a;box-shadow:0 0 40px rgba(255,120,60,.5),0 12px 30px rgba(0,0,0,.7)}
.foe .name{font-family:var(--slab);font-weight:900;font-size:clamp(15px,1.4vw,26px);margin-top:.5vh;text-shadow:0 2px 6px #000}
.pbar{position:relative;height:clamp(20px,2.4vh,30px);background:#20160c;border:2px solid #000;border-radius:12px;overflow:hidden;margin-top:.5vh}
.pbar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#f3d98f,#b5862e);transition:width .45s}
.pbar b{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#9fd3ff 0 6px,#6aa8e0 6px 12px);opacity:.85;transition:all .45s}
.pbar span{position:absolute;inset:0;font-weight:bold;font-size:clamp(12px,1vw,17px);line-height:clamp(16px,2vh,26px);text-shadow:0 1px 2px #000}
.intent{position:absolute;top:-2%;left:50%;transform:translate(-50%,-100%);display:flex;align-items:center;gap:.4em;padding:.3em .8em .3em .3em;background:rgba(20,10,4,.88);border:2px solid #c9a25a;border-radius:40px;white-space:nowrap;z-index:7;cursor:help;animation:bob2 1.6s ease-in-out infinite}
.intent img{width:clamp(36px,3.2vw,58px)}
.intent .dmg{font-family:var(--slab);font-weight:900;font-size:clamp(18px,1.8vw,32px);color:#ff8a6a;text-shadow:0 2px 2px #000}
.intent .nm{font-size:clamp(11px,.9vw,16px);text-align:left;line-height:1.15}
.intent .nm small{display:block;opacity:.8;font-style:italic}
@keyframes bob2{50%{transform:translate(-50%,-106%)}}
.foe .tags{font-size:clamp(10px,.8vw,14px);opacity:.8;letter-spacing:.15em;text-transform:uppercase}
.foe .barrier{position:absolute;right:-6%;top:-6%;width:28%;display:none}
.foe .barrier.on{display:block}
.foe .barrier img{width:100%}
.foe .barrier span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--slab);font-weight:900;font-size:clamp(16px,1.6vw,28px);color:#fff;text-shadow:0 2px 3px #000}
.foe.hit .art{animation:shake .3s}

.dock{position:absolute;left:0;right:0;bottom:0;height:calc(var(--ch)*.72);z-index:10}
.hand{position:absolute;left:50%;bottom:-7%;transform:translateX(-50%);display:flex;justify-content:center;align-items:flex-end}
.stam{position:absolute;left:1.5vw;bottom:2vh;width:clamp(80px,7.5vw,140px);aspect-ratio:1;z-index:12}
.stam img{width:100%}
.stam span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--slab);font-weight:900;font-size:clamp(22px,2.4vw,44px);color:#fff;text-shadow:0 2px 4px #000,0 0 8px #000;padding-top:18%}
.stam small{position:absolute;bottom:-1.2em;left:0;right:0;text-align:center;font-size:clamp(10px,.8vw,14px);letter-spacing:.15em;text-transform:uppercase}
.piles{position:absolute;left:clamp(90px,9vw,165px);bottom:2vh;display:flex;flex-direction:column;gap:.6vh;z-index:12}
.piles button{display:flex;align-items:center;gap:.4em}
.endturn{position:absolute;right:1.5vw;bottom:3vh;z-index:12;font-size:clamp(15px,1.4vw,24px)!important;padding:.9em 1.6em!important}
.turnlbl{position:absolute;right:1.5vw;bottom:calc(3vh + 4.2em);z-index:12;font-size:clamp(11px,.9vw,15px);opacity:.8;text-align:right}
.cancelpick{position:absolute;right:1.5vw;bottom:calc(3vh + 7em);z-index:15;font-size:clamp(13px,1vw,17px);padding:.6em 1em;}
.cancelpick[hidden]{display:none!important;}

/* cards */
.card{position:relative;width:var(--cw);height:var(--ch);flex:none;border-radius:calc(var(--cw)*.06);background-size:100% 100%;color:var(--ink);cursor:pointer;transition:transform .18s,margin .18s,box-shadow .18s,filter .2s;box-shadow:0 6px 14px rgba(0,0,0,.55);font-size:calc(var(--cw)*.075)}
.card.action{background-image:url(/hubs/manifest-1848/art/frame_action.webp)}
.card.supply{background-image:url(/hubs/manifest-1848/art/frame_supply.webp);color:#f4ead2}
.card.power{background-image:url(/hubs/manifest-1848/art/frame_power.webp);color:#f4ead2}
.card.curse{background-image:url(/hubs/manifest-1848/art/frame_curse.webp);color:#f8e7dc}
.card .cn{position:absolute;top:5%;left:21%;right:8%;height:14%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--slab);font-weight:900;font-size:1.12em;line-height:1.02;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.card.supply .cn,.card.power .cn,.card.curse .cn{text-shadow:0 1px 2px #000}
.card.up .cn{color:#2c7a2c}
.card.supply.up .cn,.card.power.up .cn,.card.curse.up .cn{color:#9df08a}
.card .ca{position:absolute;left:20%;right:20%;top:24%;height:37%;background-size:cover;background-position:center;border:2px solid rgba(40,25,10,.8);border-radius:3px;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}
.card .ca.icon{background-size:78%;background-repeat:no-repeat;background-color:rgba(239,225,194,.92)}
.card .ct{position:absolute;left:9%;right:9%;top:64%;bottom:7%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.18;font-size:.98em;padding:.25em .3em;background:rgba(244,232,205,.88);color:#2b1d10;border-radius:4px;border:1px solid rgba(60,40,15,.45)}
.card.curse .ct{background:rgba(40,12,8,.78);color:#ffe8da;border-color:rgba(0,0,0,.6)}
.card .ct b{color:#7a1d10}
.card.curse .ct b{color:#ffb39e}
.card .cc{position:absolute;left:-7%;top:-5%;width:30%;aspect-ratio:1;background:url(/hubs/manifest-1848/art/badge_cost.webp) center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--slab);font-weight:900;font-size:1.7em;color:#fff;text-shadow:0 2px 2px #000,0 0 5px #000;padding-top:8%}
.card .cc.cheap{color:#9df08a}.card .cc.dear{color:#ff8a6a}
.card .ty{position:absolute;bottom:1.4%;left:0;right:0;text-align:center;font-size:.62em;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.hand .card{margin:0 calc(var(--cw)*-.09)}
.hand .card:hover,.hand .card.focus{transform:translateY(-28%) scale(1.22);z-index:50;margin:0 calc(var(--cw)*.07)}
.hand .card.noplay{filter:brightness(.62) saturate(.7)}
.hand .card.pick{box-shadow:0 0 0 3px #ffe9a0,0 0 18px 6px rgba(255,220,120,.8)}
.card.flyout{transition:transform .32s ease-in,opacity .32s;transform:translateY(-120%) scale(1.1)!important;opacity:0}
.card.small{--cw:clamp(108px,8.4vw,160px)}
.cardgrid{display:flex;flex-wrap:wrap;gap:1.4vw 1vw;justify-content:center;padding:2vh 1vw}
.cardgrid .card:hover{transform:translateY(-6px) scale(1.05);z-index:5}
.cardgrid .card.chosen{box-shadow:0 0 0 4px #ffe9a0,0 0 24px 8px rgba(255,220,120,.9)}

/* floaters & vfx */
.float{position:absolute;z-index:80;pointer-events:none;font-family:var(--slab);font-weight:900;font-size:clamp(22px,2.2vw,40px);text-shadow:0 2px 0 #000,0 0 8px #000;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
.vfx{position:absolute;z-index:70;pointer-events:none;mix-blend-mode:screen;animation:vfx .6s ease-out forwards}
@keyframes vfx{from{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{opacity:1}to{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.shake{animation:shake .35s}
.flashred::before{content:'';position:absolute;inset:0;background:rgba(200,20,10,.35);z-index:60;pointer-events:none;animation:fade .4s forwards}
@keyframes fade{to{opacity:0}}
.banner2{position:absolute;left:0;right:0;top:36%;text-align:center;z-index:90;pointer-events:none;font-family:var(--slab);font-weight:900;font-size:clamp(34px,4.6vw,86px);color:#ffe6a6;text-shadow:0 4px 0 #3a1d08,0 0 30px rgba(0,0,0,.9);animation:bannerin 1.5s forwards}
.banner2 small{display:block;font-size:.38em;color:#fff;letter-spacing:.15em}
@keyframes bannerin{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:100;background:rgba(10,6,3,.82);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:3vh 2vw}
.overlay h2{font-family:var(--slab);font-size:clamp(22px,2.4vw,42px);color:#f3d98f;text-shadow:0 3px 8px #000;text-align:center}
.overlay .sub{text-align:center;font-size:clamp(13px,1.05vw,18px);opacity:.9;margin:.4vh 0 1vh}
.overlay .row{display:flex;gap:1.2vw;justify-content:center;flex-wrap:wrap;align-items:center;margin:1.5vh 0}
.rewardgold{display:flex;align-items:center;gap:.5em;font-family:var(--slab);font-size:clamp(18px,1.8vw,32px);color:#ffe08a}
.rewardgold img{width:2em}
.relicopt{width:clamp(160px,14vw,260px);padding:1vh .8vw;text-align:center;cursor:pointer;transition:transform .15s}
.relicopt:hover{transform:translateY(-4px)}
.relicopt img{width:55%}
.relicopt b{display:block;font-family:var(--slab);font-size:clamp(14px,1.15vw,20px)}
.relicopt span{font-size:clamp(12px,.9vw,16px)}

/* ---------- narrator ---------- */
#narr{position:fixed;z-index:150;left:1.2vw;bottom:2vh;display:none;align-items:flex-end;gap:0;max-width:min(760px,62vw);cursor:pointer}
#narr.on{display:flex;animation:narrin .35s}
#narr.top{bottom:auto;top:calc(clamp(44px,5.4vh,64px) + 13vh)}
@keyframes narrin{from{transform:translateY(20px);opacity:0}}
#narr .por{flex:none;width:clamp(96px,9vw,170px);aspect-ratio:.8;border-radius:50% / 45%;overflow:hidden;border:4px solid #c9a25a;box-shadow:0 0 0 3px #3a2410,0 8px 24px rgba(0,0,0,.7);background:#000;position:relative;z-index:2}
#narr .por img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
#narr.talk .por img{animation:talk .35s infinite alternate}
@keyframes talk{to{transform:scale(1.02) translateY(-1px)}}
#narr .bub{position:relative;margin-left:-2.2vw;margin-bottom:2vh;padding:.9em 1.4em 1.1em 3.4vw;font-size:clamp(14px,1.15vw,20px);line-height:1.38;min-height:4.5em}
#narr .bub .who{font-family:var(--slab);font-size:.75em;letter-spacing:.18em;text-transform:uppercase;color:var(--blood);margin-bottom:.2em}
#narr .bub .more{position:absolute;right:.7em;bottom:.3em;font-size:.7em;opacity:.6}
#narr.big .por{width:clamp(150px,14vw,260px)}

/* ---------- fort / camp / event ---------- */
#fort{background-image:url(/hubs/manifest-1848/art/bg_fort.webp)}
#camp{background-image:url(/hubs/manifest-1848/art/bg_campfire.webp)}
#event,#ferryscreen{background-size:cover;background-position:center}
.shop{position:absolute;inset:calc(clamp(44px,5.4vh,64px) + 2vh) 2vw 2vh 2vw;display:grid;grid-template-columns:minmax(180px,18vw) 1fr;gap:1.5vw}
.trader{display:flex;flex-direction:column;align-items:center;gap:1vh;padding:1.5vh 1vw;align-self:start}
.trader img{width:100%;border:3px solid #3a2a16;border-radius:4px}
.trader .h1{font-size:clamp(18px,1.7vw,30px);text-align:center}
.trader p{font-style:italic;font-size:clamp(12px,1vw,17px);text-align:center}
.shelf{display:flex;flex-direction:column;gap:1.4vh;overflow-y:auto;padding:1vh}
.shelf .cardgrid{padding:0;gap:1.2vw;justify-content:flex-start}
.ware{display:flex;flex-direction:column;align-items:center;gap:.4vh}
.price{display:flex;align-items:center;gap:.25em;font-family:var(--slab);font-weight:900;font-size:clamp(14px,1.2vw,21px);color:#ffe08a;text-shadow:0 2px 3px #000;background:rgba(20,10,4,.8);padding:.1em .6em;border-radius:20px;border:1px solid #c9a25a}
.price img{width:1.3em}
.price.no{color:#ff8a6a}
.ware.sold{opacity:.25;pointer-events:none}
.services{display:flex;gap:1vw;flex-wrap:wrap}
.svc{display:flex;align-items:center;gap:.8em;padding:1vh 1vw;cursor:pointer;min-width:clamp(200px,18vw,320px);transition:transform .15s}
.svc:hover{transform:translateY(-3px)}
.svc img{width:clamp(44px,4vw,70px)}
.svc b{font-family:var(--slab);display:block;font-size:clamp(14px,1.15vw,20px)}
.svc span{font-size:clamp(12px,.9vw,16px)}
.svc.off{opacity:.45;pointer-events:none}
.campbox{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);display:flex;gap:3vw}
.campopt{width:clamp(220px,20vw,360px);padding:2.5vh 1.5vw;text-align:center;cursor:pointer;transition:transform .15s}
.campopt:hover{transform:translateY(-6px)}
.campopt img{width:40%}
.campopt b{display:block;font-family:var(--slab);font-size:clamp(20px,2vw,34px)}
.campopt span{font-size:clamp(13px,1.05vw,18px)}
.evbox{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(1150px,86vw);display:grid;grid-template-columns:minmax(220px,36%) 1fr;gap:2vw;padding:3vh 2vw}
.evbox .pic{width:100%;aspect-ratio:1;background-size:cover;background-position:center;border:4px solid #2b1d10;border-radius:3px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.evbox .pic.contain{background-size:70%;background-repeat:no-repeat;background-color:#e8d6ae}
.evbox h2{font-family:var(--slab);font-size:clamp(22px,2.2vw,40px);margin-bottom:1vh}
.evbox p{font-size:clamp(14px,1.2vw,21px);line-height:1.45;margin-bottom:2vh}
.evbox .choices{display:flex;flex-direction:column;gap:1vh}
.choice{text-align:left;padding:.8em 1em;background:linear-gradient(#f7e9c8,#e6cf9d);border:2px solid #6a4a20;border-radius:6px;color:#2b1d10;font-family:var(--serif);font-size:clamp(14px,1.1vw,19px);cursor:pointer;transition:transform .1s,background .15s}
.choice:hover{background:linear-gradient(#fff5da,#f0dcae);transform:translateX(4px)}
.choice b{font-family:var(--slab);display:block}
.choice span{font-size:.88em;color:#6a2a14}
.choice[disabled]{opacity:.45;pointer-events:none}
.result{font-style:italic;font-size:clamp(15px,1.25vw,22px);margin-bottom:2vh;padding:1em;background:rgba(255,255,255,.35);border-left:4px solid #8e2a1e}

/* ---------- newspaper end ---------- */
#end{background-size:cover;background-position:center}
.news{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);width:min(1100px,90vw);max-height:94vh;overflow:auto;padding:2.5vh 2.5vw;font-family:var(--serif);color:#1d140a;background:#ece0c4;box-shadow:0 20px 60px rgba(0,0,0,.8);background-image:url(/hubs/manifest-1848/art/paper.webp);background-size:cover}
.news .mast{text-align:center;border-bottom:4px double #1d140a;padding-bottom:.6vh}
.news .mast .t{font-family:'Old English Text MT','UnifrakturMaguntia',var(--slab);font-size:clamp(30px,3.6vw,64px);font-weight:900}
.news .mast .d{display:flex;justify-content:space-between;font-size:clamp(11px,.85vw,14px);border-top:1px solid #1d140a;margin-top:.4vh;padding-top:.3vh;text-transform:uppercase;letter-spacing:.1em}
.news .head{font-family:var(--slab);font-weight:900;text-align:center;font-size:clamp(26px,3vw,54px);line-height:1;margin:1.2vh 0 .4vh;text-transform:uppercase}
.news .deck2{text-align:center;font-style:italic;font-size:clamp(14px,1.2vw,20px);margin-bottom:1.2vh}
.news .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:2vw}
.news img.eng{width:100%;filter:sepia(.6) contrast(1.1);border:1px solid #1d140a}
.news .stats{columns:2;font-size:clamp(13px,1vw,17px);line-height:1.5}
.news .stats b{font-family:var(--slab)}
.news .meds{display:flex;gap:.8vw;flex-wrap:wrap;margin-top:1vh}
.news .med{width:clamp(70px,6vw,110px);text-align:center;font-size:clamp(10px,.75vw,13px);line-height:1.15}
.news .med img{width:100%;border-radius:8px}
.news .med.off img{filter:grayscale(1) brightness(.5);opacity:.4}
.news .quote{margin-top:1.2vh;font-style:italic;border-left:3px solid #1d140a;padding-left:1em;font-size:clamp(13px,1.05vw,18px)}

/* act intro */
.actcard{position:absolute;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.55);animation:fadein .6s}
.actcard .k{font-family:var(--slab);letter-spacing:.4em;color:#f3d98f;font-size:clamp(14px,1.4vw,24px)}
.actcard .n{font-family:var(--slab);font-weight:900;font-size:clamp(40px,5.5vw,100px);color:#fff1cf;text-shadow:0 6px 20px #000}
.actcard .r{font-style:italic;font-size:clamp(15px,1.4vw,24px);color:#f3e5c4}
@keyframes fadein{from{opacity:0}}
.hidden{display:none!important}

/* South Pass: clear, touch-sized tactics that leave the normal card hand intact. */
.avalanche-panel{position:absolute;z-index:16;left:1.5vw;top:calc(clamp(44px,5.4vh,64px) + clamp(64px,6.6vw,115px) + 2vh);width:min(490px,45vw);padding:10px 13px;background:rgba(20,13,8,.9);border:2px solid #c9a25a;border-radius:7px;box-shadow:0 8px 20px rgba(0,0,0,.65);font-size:clamp(12px,.95vw,17px)}
.avalanche-heading{display:flex;justify-content:space-between;align-items:center;font:900 clamp(12px,.95vw,16px) var(--slab);letter-spacing:.05em;color:#fff0cd}
.avalanche-reading{color:#ffd375}.avalanche-gauge{height:13px;background:#2d1b11;border:1px solid #8d6e44;margin:5px 0 7px;border-radius:8px;overflow:hidden}
.avalanche-gauge i{display:block;height:100%;width:14%;background:linear-gradient(90deg,#c9a25a,#e0a34c);transition:width .25s}
.avalanche-gauge.critical i{background:linear-gradient(90deg,#c97932,#e74632)}
.avalanche-warning{font-weight:800;color:#ffe4b6;font-size:clamp(11px,.85vw,14px);margin:4px 0 8px;min-height:1.2em}
.avalanche-danger .avalanche-warning{color:#ffa28d;animation:pulse 1s ease infinite}
.avalanche-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.hazard-btn{min-height:43px;padding:7px 6px;background:#4b3a23;color:#f7e5b9;border:1px solid #a88b53;border-radius:4px;font-weight:800;font-size:clamp(11px,.85vw,15px);cursor:pointer;touch-action:manipulation}
.hazard-btn:hover:not(:disabled),.hazard-btn:focus-visible{background:#826035;outline:2px solid #f1ce81}
.hazard-btn:disabled{opacity:.4;cursor:not-allowed}
.hazard-sacrifice{background:#743a2f;border-color:#d48e78}
.avalanche-panel small{display:block;font-size:clamp(10px,.72vw,13px);color:#e7d3af;margin-top:7px;line-height:1.2}
.avalanche-reward{border:1px solid #c9a25a;background:rgba(81,56,25,.7);padding:10px;border-radius:5px;max-width:700px;margin:8px auto;text-align:center;color:#ffebbb;font-weight:600}
.avalanche-rising .wx{opacity:1}
.river-panel{position:absolute;z-index:16;left:1.5vw;top:calc(clamp(44px,5.4vh,64px) + clamp(64px,6.6vw,115px) + 2vh);width:min(515px,47vw);padding:10px 13px;background:rgba(12,30,36,.94);border:2px solid #8eb8c4;border-radius:7px;box-shadow:0 8px 20px rgba(0,0,0,.65);font-size:clamp(12px,.92vw,16px)}
.river-readings{color:#cdefff}.river-gauge{height:13px;background:#142b34;border:1px solid #8eb8c4;margin:6px 0;border-radius:8px;overflow:hidden}
.river-gauge i{display:block;height:100%;width:78%;background:linear-gradient(90deg,#3384a8,#9ed6e6);transition:width .25s}
.river-gauge.critical i{background:linear-gradient(90deg,#cda56c,#e84d39)}
.river-warning{font-weight:800;color:#e6f3f7;font-size:clamp(11px,.82vw,14px);margin:6px 0;min-height:1.2em}
.river-danger .river-warning{color:#ffcb9e}.river-panel small{display:block;font-size:clamp(10px,.73vw,13px);color:#dcecf0;margin-top:7px}
@media(max-width:900px){.river-panel{width:min(400px,52vw);padding:7px;top:calc(clamp(44px,5.4vh,64px) + clamp(60px,6.6vw,105px) + 1vh)}}
@media (max-width:900px){.avalanche-panel{width:min(390px,53vw);padding:7px;top:calc(clamp(44px,5.4vh,64px) + clamp(60px,6.6vw,105px) + 1vh)}.hazard-btn{min-height:40px}}

.avalanche-rockfall{position:absolute;inset:0;overflow:hidden;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s}
.avalanche-danger .avalanche-rockfall{opacity:.65}
.avalanche-crash .avalanche-rockfall{opacity:1}
.avalanche-rockfall i{position:absolute;top:-8%;width:clamp(10px,1.2vw,25px);height:clamp(9px,.9vw,18px);border:2px solid #4b4c48;border-radius:40% 35% 50% 27%;background:linear-gradient(130deg,#ddd0bc,#8f8a7f 62%,#464541);box-shadow:2px 4px 3px #2226;animation:avalancheRock 1.6s linear infinite;animation-play-state:paused}
.avalanche-danger .avalanche-rockfall i,.avalanche-crash .avalanche-rockfall i{animation-play-state:running}
.avalanche-rockfall i:nth-child(1){left:12%;animation-delay:-.6s}.avalanche-rockfall i:nth-child(2){left:23%;animation-delay:-1.1s}
.avalanche-rockfall i:nth-child(3){left:36%;animation-delay:-.2s}.avalanche-rockfall i:nth-child(4){left:47%;animation-delay:-1.4s}
.avalanche-rockfall i:nth-child(5){left:61%;animation-delay:-.85s}.avalanche-rockfall i:nth-child(6){left:75%;animation-delay:-1.7s}
.avalanche-rockfall i:nth-child(7){left:85%;animation-delay:-.45s}.avalanche-rockfall i:nth-child(8){left:96%;animation-delay:-1.2s}
@keyframes avalancheRock{to{transform:translate(-14vw,105vh) rotate(480deg)}}
.avalanche-crash .stage{animation:shake .3s 2}
@media (prefers-reduced-motion:reduce){.avalanche-rockfall i,.avalanche-crash .stage{animation:none!important}.avalanche-rockfall{opacity:0!important}}
/* Phase 17 — non-scoring encounter review, readable on short screens. */
.encounter-debrief{border:1px solid #cbb48b;background:rgba(31,28,24,.87);border-radius:7px;margin:8px auto 12px;padding:9px 12px;max-width:710px;color:#fff0d4;line-height:1.35}
.encounter-debrief summary{font-weight:800;cursor:pointer;min-height:36px;display:list-item;padding:6px 0;font-size:clamp(13px,1.05vw,18px)}
.encounter-debrief .debrief-stats{display:flex;flex-wrap:wrap;gap:9px;margin:6px auto}
.encounter-debrief .debrief-stats span{flex:1;min-width:120px;text-align:center;background:rgba(255,248,210,.1);border-radius:4px;padding:8px 5px}
.encounter-debrief p{font-size:clamp(12px,.85vw,15px);margin:6px 0;overflow-wrap:anywhere}
.encounter-debrief small{font-size:12px;color:#d8c9ad}
@media(max-height:550px){.encounter-debrief{padding:5px 8px}.encounter-debrief summary{font-size:13px}.encounter-debrief .debrief-stats span{min-width:100px;padding:5px}}
/* Phase 5 — ecology panels, using existing touch target language. */
.ecology-panel{position:absolute;z-index:16;left:1.5vw;top:calc(clamp(44px,5.4vh,64px) + clamp(64px,6.6vw,115px) + 2vh);width:min(505px,47vw);padding:10px 13px;background:rgba(28,29,21,.95);border:2px solid #cbb28a;border-radius:7px;box-shadow:0 8px 20px #0009;font-size:clamp(12px,.92vw,16px)}
.ecology-reading{color:#ffdfae}.ecology-gauge{height:13px;background:#24251e;border:1px solid #c9b183;margin:6px 0;border-radius:8px;overflow:hidden}
.ecology-gauge i{display:block;width:0;height:100%;background:linear-gradient(90deg,#719e69,#e2bf61);transition:width .2s}
.ecology-gauge.critical i{background:linear-gradient(90deg,#efb35e,#bd4f3a)}
.ecology-warning{min-height:1.1em;margin:6px 0;color:#faf2dd;font-weight:800;font-size:clamp(11px,.82vw,14px)}
.ecology-danger .ecology-warning{color:#ffc09f}.ecology-panel small{display:block;font-size:clamp(10px,.73vw,13px);color:#ebdfc7;margin-top:7px}
@media(max-width:900px){.ecology-panel{width:min(390px,53vw);padding:7px;top:calc(clamp(44px,5.4vh,64px) + clamp(60px,6.6vw,105px) + 1vh)}}
@media(prefers-reduced-motion:reduce){.ecology-gauge i{transition:none}}

/* Phase 6: local expedition records and daily dispatch */
.wcard.locked:not(.sel){opacity:.65;cursor:not-allowed}
.ledger{width:min(900px,96%);background:#efe2c4;color:#231609;border:3px double #5a3c18;padding:clamp(14px,2.5vw,34px);font-family:var(--serif);line-height:1.42}
.ledger h3{font-family:var(--slab);font-size:clamp(19px,2vw,32px);margin:0 0 10px}
.ledger .numbers{display:flex;gap:1em;flex-wrap:wrap;margin:12px 0;font-weight:700}
.ledger .records{width:100%;border-collapse:collapse;font-size:clamp(12px,1vw,16px)}
.ledger .records th,.ledger .records td{border-bottom:1px solid #baa680;padding:9px 8px;text-align:left}
.ledger .records th{font-family:var(--slab)}
.ledger .records tbody tr:nth-child(even){background:#e1d2ae}
.ledger .ledger-table{max-height:40vh;overflow:auto}
.ledger .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.ledger .actions .btn{font-size:clamp(12px,1vw,17px)}
.ledger .footnote{font-size:clamp(12px,.85vw,15px);margin-top:10px;color:#59472d}
.ledger .daily-note{padding:12px;border-left:4px solid #986c32;background:#e2d0a5}
@media(max-width:700px){.ledger .records th:nth-child(4),.ledger .records td:nth-child(4){display:none}}

/* Phase 8 — discrete tactical elite panel. Reuses accessible action-grid language. */
.elite-panel{position:absolute;z-index:16;left:1.5vw;top:calc(clamp(44px,5.4vh,64px) + clamp(64px,6.6vw,115px) + 2vh);width:min(510px,47vw);padding:10px 13px;background:rgba(31,24,18,.96);border:2px solid #d2a276;border-radius:7px;box-shadow:0 8px 20px #000a;font-size:clamp(12px,.92vw,16px)}
.elite-reading{color:#ffd4a7}.elite-gauge{height:13px;background:#2e211c;border:1px solid #a37a56;margin:6px 0;border-radius:8px;overflow:hidden}
.elite-gauge i{display:block;width:0;height:100%;background:linear-gradient(90deg,#c29b65,#edbc74);transition:width .2s}
.elite-gauge.critical i{background:linear-gradient(90deg,#bd753b,#e45442)}
.elite-warning{font-weight:800;color:#fceaca;margin:6px 0;min-height:1.1em;font-size:clamp(11px,.82vw,14px)}
.elite-danger .elite-warning{color:#ffc3aa}.elite-panel small{display:block;font-size:clamp(10px,.73vw,13px);color:#e7d4b9;margin-top:7px;line-height:1.2}
@media(max-width:900px){.elite-panel{width:min(390px,53vw);padding:7px;top:calc(clamp(44px,5.4vh,64px) + clamp(60px,6.6vw,105px) + 1vh)}}
@media(prefers-reduced-motion:reduce){.elite-gauge i{transition:none}}

/* Phase 9 connected, accessible Columbia Gorge encounter. */
.finale-panel{position:absolute;z-index:16;left:1.5vw;top:calc(clamp(44px,5.4vh,64px) + clamp(64px,6.6vw,115px) + 2vh);width:min(515px,47vw);padding:10px 13px;background:rgba(18,31,38,.96);border:2px solid #9eb9c9;border-radius:7px;box-shadow:0 8px 20px #0009;font-size:clamp(12px,.92vw,16px)}
.finale-reading{color:#c9e6f6}.finale-gauge{height:13px;background:#21343e;border:1px solid #9eb9c9;margin:6px 0;border-radius:8px;overflow:hidden}
.finale-gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6194b3,#bddfeb);transition:width .25s}
.finale-gauge.critical i{background:linear-gradient(90deg,#d6a35c,#e85d48)}
.finale-warning{font-weight:800;color:#f2f5f8;font-size:clamp(11px,.82vw,14px);margin:6px 0;min-height:1.2em}
.finale-danger .finale-warning{color:#ffca9a}.finale-panel small{display:block;font-size:clamp(10px,.73vw,13px);color:#d8e6ee;margin-top:7px;line-height:1.25}
/* Phase 15: an actual brake failure briefly shakes the wagon, not the full UI.
   No motion is shown to users who request reduced motion. */
.barlow-brake-impact .rig .wag,.barlow-brake-impact .rig .ox{animation:barlowImpact .54s ease-out both}
.barlow-brake-impact .barlow-panel{border-color:#f2a16c;box-shadow:0 0 0 3px #df5d3766}
@keyframes barlowImpact{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-8px,-3px) rotate(-3deg)}45%{transform:translate(6px,4px) rotate(3deg)}70%{transform:translate(-3px,2px) rotate(-1deg)}}
@media(prefers-reduced-motion:reduce){.barlow-brake-impact .rig .wag,.barlow-brake-impact .rig .ox{animation:none!important}}
/* Phase 14: retain comfortable tactical reading and reliable touch targets. */
.barlow-panel small{font-size:clamp(12px,.85vw,14px);line-height:1.35}
.barlow-panel .hazard-btn{min-height:44px;font-size:clamp(12px,.90vw,15px)}
.barlow-panel .barlow-rules summary{display:none}
@media (max-height:550px) and (max-width:1100px){
  .barlow-panel{top:calc(clamp(40px,5.4vh,64px) + 2px);max-height:calc(100vh - 104px);overflow-y:auto}
  .barlow-panel .barlow-rules summary{display:list-item;cursor:pointer;color:#e2cca6;font-size:12px;font-weight:800;margin-top:6px}
  .barlow-panel .barlow-rules small{font-size:12px;margin-top:4px}
}

@media(max-width:900px){.finale-panel{width:min(390px,53vw);padding:7px;top:calc(clamp(44px,5.4vh,64px) + clamp(60px,6.6vw,105px) + 1vh)}}
/* Phase 16: Columbia tactical options stay clear of the dock in short touch viewports. */
.finale-panel .finale-rules summary{display:none}
.finale-panel .channel-risk{border-color:#efbf7c;background:#583b2c;min-height:44px}
.finale-panel .channel-risk:focus-visible{outline:3px solid #fff2a8;outline-offset:1px}
@media (max-height:550px) and (max-width:1100px){
  .finale-panel{top:calc(clamp(40px,5.4vh,64px) + 2px);padding:7px;max-height:calc(100vh - 235px);overflow-y:auto}
  .finale-panel .finale-rules summary{display:list-item;cursor:pointer;color:#d8e6ee;font-size:12px;font-weight:800;margin-top:5px}
  .finale-panel .hazard-btn{min-height:44px;padding:4px 5px;font-size:12px}
  .finale-panel .finale-rules small{font-size:12px;line-height:1.3}
}
@media(prefers-reduced-motion:reduce){.finale-gauge i{transition:none}}
/* Phase 10: a focused, touch-first historical route decision rather than a full-screen collage. */
.route-dialog{width:min(1050px,93vw);margin:auto;padding:clamp(22px,3vw,42px);
 color:#332215;background:linear-gradient(160deg,#f5e7c7,#dfc392);border:5px double #69502b;
 box-shadow:0 16px 45px #000c, inset 0 0 0 2px #e6d09e;border-radius:8px;text-align:center}
.route-dialog h2{color:#4d2b10;text-shadow:none;line-height:1.12;font-size:clamp(25px,2.4vw,40px)}
.route-dialog>p{font-size:clamp(14px,1.1vw,19px);line-height:1.4;margin:1.1vh 0 2.3vh}
.route-dialog .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.5vw,22px);margin:0 0 1.5vh}
.route-dialog .choice{min-height:138px;padding:clamp(12px,1.5vw,22px);text-align:left;border-width:3px}
.route-dialog .choice b{font-size:clamp(17px,1.2vw,22px);margin-bottom:8px}
.route-dialog .choice span{font-size:clamp(13px,.93vw,17px);line-height:1.37;display:block}
.route-dialog .sub{color:#5a4935;opacity:1;margin:1vh 0 2vh}
.route-dialog [data-cancel-route]{min-height:48px}
@media(max-width:700px){.route-dialog .choices{grid-template-columns:1fr}.route-dialog{margin:2vh auto}.route-dialog .choice{min-height:96px}}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
#map .node.avail:focus-visible{outline:4px solid #ffe39a;outline-offset:5px;filter:drop-shadow(0 0 14px #ffd76a);animation:none;z-index:4}
.wcard[role="radio"]:focus-visible,.crewopt[role="button"]:focus-visible{outline:4px solid #ffe39a;outline-offset:5px;z-index:5}
.hand .card[role="button"]:focus-visible{outline:4px solid #ffe39a;outline-offset:5px;box-shadow:0 0 0 7px #1b1108,0 0 0 11px #ffe39a;z-index:6}
/* Phase 12: accessibility — do not make motion a prerequisite for using tactical controls. */
.route-dialog .choice:focus-visible{outline:3px solid #f3cf87;outline-offset:3px;box-shadow:0 0 0 5px #45301f}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<script>
/* Manifest Deck: 1848 — game data */
'use strict';
const A = n => '/hubs/manifest-1848/art/' + n + '.webp';

/* ---------------- CARDS ---------------- */
// play(c,u) runs inside combat. c = combat api. u = upgraded?
const CARDS = {
  /* starter */
  steady_pace:{name:'Steady Pace',type:'action',arch:'starter',rarity:'starter',cost:1,art:'art_steady_pace',
    desc:u=>`Gain <b>${u?8:5}</b> Progress.`, play:async(c,u)=>c.prog(u?8:5)},
  brace_wagon:{name:'Brace the Wagon',type:'action',arch:'starter',rarity:'starter',cost:1,art:'art_brace_wagon',
    desc:u=>`Gain <b>${u?8:5}</b> Stability.`, play:async(c,u)=>c.stab(u?8:5)},
  frontier_rifle:{name:'Frontier Rifle',type:'supply',arch:'starter',rarity:'starter',cost:1,art:'ic_rifle',icon:true,
    desc:u=>`Gain <b>${u?9:6}</b> Progress. <b>+${u?6:4}</b> more against Wildlife or Bandits.`,
    play:async(c,u)=>{c.prog(u?9:6); if(c.hasTag('wildlife')||c.hasTag('bandits')) c.prog(u?6:4);}},
  hardtack_rations:{name:'Hardtack Rations',type:'supply',arch:'starter',rarity:'starter',cost:0,art:'ic_hardtack',icon:true,exhaust:true,
    desc:u=>`Heal <b>${u?5:3}</b> HP. Draw 1 card. <i>Exhaust.</i>`, play:async(c,u)=>{c.heal(u?5:3); await c.draw(1);}},

  /* speed */
  whip_the_oxen:{name:'Whip the Oxen',type:'action',arch:'speed',rarity:'common',cost:1,art:'art_whip_the_oxen',
    desc:u=>`Gain <b>${u?11:8}</b> Progress. Lose 2 HP.`, play:async(c,u)=>{c.prog(u?11:8); c.selfHurt(2);}},
  lighten_the_load:{name:'Lighten the Load',type:'action',arch:'speed',rarity:'common',cost:0,art:'art_lighten_the_load',
    desc:u=>`Discard 1 card. Gain <b>${u?7:4}</b> Progress and <b>+1</b> Stamina.`,
    play:async(c,u)=>{const discarded=await c.chooseFromHand('Discard a card',x=>true,x=>c.discardCard(x)); if(!discarded) return; c.prog(u?7:4); c.gainStam(1);}},
  night_travel:{name:'Night Travel',type:'action',arch:'speed',rarity:'uncommon',cost:2,art:'art_night_travel',
    desc:u=>`Gain <b>${u?18:13}</b> Progress. Shuffle an <b>Exhaustion</b> into your discard.`,
    play:async(c,u)=>{c.prog(u?18:13); c.addTemp('exhaustion','discard');}},
  double_yoke:{name:'Double Yoke',type:'action',arch:'speed',rarity:'uncommon',cost:1,art:'ic_yoke',icon:true,
    desc:u=>`Gain <b>${u?4:3}</b> Progress for each card played this turn, this one included.`,
    play:async(c,u)=>c.prog((u?4:3)*c.playedThisTurn)},
  double_time_hitch:{name:'Double-Time Hitch',type:'power',arch:'speed',rarity:'rare',cost:1,costUp:0,art:'art_double_time_hitch',
    desc:u=>`Every 3rd card you play each turn grants <b>+5</b> Progress.`, play:async(c,u)=>c.power('hitch',5)},

  /* Phase 9 — speed archetype: meaningful pace versus safety tradeoffs. */
  cut_the_switchback:{name:'Cut the Switchback',type:'action',arch:'speed',rarity:'common',cost:1,art:'ic_compass',icon:true,
    desc:u=>`Gain <b>${u?10:7}</b> Progress. Gain 4 more on the first two turns.`,
    play:async(c,u)=>c.prog((u?10:7)+(c.turn<=2?4:0))},
  relay_the_team:{name:'Relay the Team',type:'action',arch:'speed',rarity:'common',cost:1,art:'ic_yoke',icon:true,
    desc:u=>`Gain <b>${u?8:5}</b> Progress and 1 additional Stamina next turn.`,
    play:async(c,u)=>{c.prog(u?8:5);c.nextStam=Math.min(3,c.nextStam+1);}},
  trim_the_manifest:{name:'Trim the Manifest',type:'action',arch:'speed',rarity:'uncommon',cost:1,art:'ic_satchel',icon:true,
    desc:u=>`Gain <b>${u?12:9}</b> Progress, plus 4 if your wagon is overloaded. Otherwise gain 5 Stability.`,
    play:async(c,u)=>{c.prog((u?12:9)+(G.over>0?4:0));if(G.over===0)c.stab(5);}},
  breakneck_descent:{name:'Breakneck Descent',type:'action',arch:'speed',rarity:'uncommon',cost:2,art:'art_night_travel',
    desc:u=>`Gain <b>${u?23:18}</b> Progress. Lose 3 HP and add Exhaustion to discard. <i>Exhaust.</i>`,exhaust:true,
    play:async(c,u)=>{c.prog(u?23:18);c.selfHurt(3);c.addTemp('exhaustion','discard');}},

  /* trader */
  haggle:{name:'Haggle',type:'action',arch:'trader',rarity:'common',cost:1,art:'art_haggle',
    desc:u=>`Gain <b>${u?6:4}</b> Stability and <b>${u?11:8}</b> Gold.`, play:async(c,u)=>{c.stab(u?6:4); c.gold(u?11:8);}},
  trade_goods:{name:'Trade Goods',type:'supply',arch:'trader',rarity:'common',cost:0,art:'ic_coins',icon:true,exhaust:true,
    desc:u=>`Gain <b>${u?8:5}</b> Gold. Draw 1 card. <i>Exhaust.</i>`, play:async(c,u)=>{c.gold(u?8:5); await c.draw(1);}},
  bribe_the_ferryman:{name:'Bribe the Ferryman',type:'action',arch:'trader',rarity:'uncommon',cost:1,art:'art_bribe_the_ferryman',
    desc:u=>`Spend 15 Gold to gain <b>${u?19:14}</b> Progress. Short on gold? Gain 4.`,
    play:async(c,u)=>{ if(G.gold>=15){c.spend(15); c.prog(u?19:14);} else c.prog(4);}},
  cast_iron_cargo:{name:'Cast-Iron Cargo',type:'supply',arch:'trader',rarity:'uncommon',cost:2,art:'art_cast_iron_cargo',
    desc:u=>`Gain <b>${u?13:10}</b> Stability, plus <b>${u?3:2}</b> for every 25 Gold you hold.`,
    play:async(c,u)=>c.stab((u?13:10)+(u?3:2)*Math.floor(G.gold/25))},
  manifest_monopoly:{name:'Manifest Monopoly',type:'power',arch:'trader',rarity:'rare',cost:1,art:'art_manifest_monopoly',
    desc:u=>`Whenever you gain Gold this encounter, gain <b>${u?5:3}</b> Progress.`, play:async(c,u)=>c.power('monopoly',u?5:3)},

  /* survival */
  boil_river_water:{name:'Boil River Water',type:'action',arch:'survival',rarity:'common',cost:1,art:'art_boil_river_water',
    desc:u=>`Gain <b>${u?8:5}</b> Stability. <b>Purge</b> an Illness curse from your hand.`,
    play:async(c,u)=>{c.stab(u?8:5); const k=c.hand.find(x=>CARDS[x.id].tags&&CARDS[x.id].tags.includes('illness')); if(k) c.purge(k);}},
  spare_wheel:{name:'Spare Wheel',type:'supply',arch:'survival',rarity:'common',cost:1,art:'ic_wheel',icon:true,exhaust:true,
    desc:u=>`Gain <b>${u?11:8}</b> Stability. <b>Purge</b> a Broken Axle in hand. <i>Exhaust.</i>`,
    play:async(c,u)=>{c.stab(u?11:8); const k=c.hand.find(x=>x.id==='broken_axle'); if(k) c.purge(k);}},
  gather_firewood:{name:'Gather Firewood',type:'supply',arch:'survival',rarity:'common',cost:0,art:'ic_firewood',icon:true,exhaust:true,
    desc:u=>`Gain <b>${u?5:3}</b> Stability. Draw 1 card. <i>Exhaust.</i>`, play:async(c,u)=>{c.stab(u?5:3); await c.draw(1);}},
  smoked_jerky:{name:'Smoked Jerky',type:'supply',arch:'survival',rarity:'uncommon',cost:0,art:'ic_jerky',icon:true,exhaust:true,
    desc:u=>`Heal <b>${u?6:4}</b> HP, gain <b>+1</b> Stamina, draw 1. <i>Exhaust.</i>`,
    play:async(c,u)=>{c.heal(u?6:4); c.gainStam(1); await c.draw(1);}},
  lash_it_down:{name:'Lash It Down',type:'supply',arch:'survival',rarity:'uncommon',cost:2,art:'ic_rope',icon:true,
    desc:u=>`Gain <b>${u?16:12}</b> Stability. Your Stability carries over to next turn.`,
    play:async(c,u)=>{c.stab(u?16:12); c.retainStab=true;}},
  campfire_prep:{name:'Campfire Prep',type:'power',arch:'survival',rarity:'rare',cost:1,art:'art_campfire_prep',
    desc:u=>`Whenever a card Exhausts this encounter, gain <b>${u?6:4}</b> Progress and <b>${u?6:4}</b> Stability.`,
    play:async(c,u)=>c.power('campfire',u?6:4)},

  /* apothecary */
  bitter_tonic:{name:'Bitter Tonic',type:'action',arch:'apothecary',rarity:'common',cost:1,art:'art_bitter_tonic',
    desc:u=>`Draw <b>${u?3:2}</b> cards. If any is a Curse, gain <b>7</b> Stability.`,
    play:async(c,u)=>{const d=await c.draw(u?3:2); if(d.some(x=>CARDS[x.id].type==='curse')) c.stab(7);}},
  patent_medicine:{name:'Patent Medicine',type:'supply',arch:'apothecary',rarity:'common',cost:0,art:'ic_bottle',icon:true,exhaust:true,
    desc:u=>`<b>Exhaust</b> a Curse in hand. Heal <b>${u?5:3}</b> HP. <i>Exhaust.</i>`,
    play:async(c,u)=>{const k=c.hand.find(x=>CARDS[x.id].type==='curse'); if(k) c.exhaustCard(k); c.heal(u?5:3);}},
  fever_dream:{name:'Fever Dream',type:'action',arch:'apothecary',rarity:'uncommon',cost:1,art:'art_fever_dream',
    desc:u=>`Gain <b>${u?7:5}</b> Progress, plus <b>${u?6:5}</b> for every Curse in your hand.`,
    play:async(c,u)=>c.prog((u?7:5)+(u?6:5)*c.hand.filter(x=>CARDS[x.id].type==='curse').length)},
  snake_oil:{name:'Snake Oil',type:'action',arch:'apothecary',rarity:'uncommon',cost:1,art:'art_snake_oil',
    desc:u=>`Exhaust every Curse in your hand. Gain 10 Gold and <b>${u?6:4}</b> Progress for each.`,
    play:async(c,u)=>{const cs=c.hand.filter(x=>CARDS[x.id].type==='curse'); for(const k of cs){c.exhaustCard(k); c.gold(10); c.prog(u?6:4);} }},
  plague_doctors_grit:{name:"Plague Doctor's Grit",type:'power',arch:'apothecary',rarity:'rare',cost:2,costUp:1,art:'art_plague_doctors_grit',
    desc:u=>`Curses no longer punish you at end of turn. Drawing a Curse gives <b>4</b> Progress and <b>4</b> Stability.`,
    play:async(c,u)=>c.power('grit',4)},

  /* Phase 9 — apothecary: curse-management costs, healing, and delayed payoffs. */
  field_surgery:{name:'Field Surgery',type:'supply',arch:'apothecary',rarity:'common',cost:1,art:'ic_bottle',icon:true,exhaust:true,
    desc:u=>`Heal <b>${u?4:2}</b> HP, plus 2 for each Curse in hand (maximum +4). <i>Exhaust.</i>`,
    play:async(c,u)=>c.heal((u?4:2)+Math.min(2,c.hand.filter(x=>CARDS[x.id].type==='curse').length)*2)},
  clinical_notes:{name:'Clinical Notes',type:'action',arch:'apothecary',rarity:'common',cost:1,art:'ic_scroll',icon:true,
    desc:u=>`Gain <b>${u?7:5}</b> Stability. Draw ${u?2:1} card${u?'s':''}. If you hold a Curse, gain 4 more Stability.`,
    play:async(c,u)=>{const sick=c.hand.some(x=>CARDS[x.id].type==='curse');c.stab((u?7:5)+(sick?4:0));await c.draw(u?2:1);}},
  convalescent_camp:{name:'Convalescent Camp',type:'supply',arch:'apothecary',rarity:'uncommon',cost:2,art:'ic_firewood',icon:true,exhaust:true,
    desc:u=>`Heal <b>${u?11:8}</b> HP and gain <b>${u?10:7}</b> Stability. Add an Exhaustion to discard. <i>Exhaust.</i>`,
    play:async(c,u)=>{c.heal(u?11:8);c.stab(u?10:7);c.addTemp('exhaustion','discard');}},
  inoculation:{name:'Inoculation',type:'action',arch:'apothecary',rarity:'uncommon',cost:1,art:'art_boil_river_water',
    desc:u=>`Purge one Illness Curse in hand for <b>${u?11:8}</b> Progress. Otherwise gain <b>${u?11:8}</b> Stability.`,
    play:async(c,u)=>{const sick=c.hand.find(x=>(CARDS[x.id].tags||[]).includes('illness'));if(sick){c.purge(sick);c.prog(u?11:8);}else c.stab(u?11:8);}},

  /* neutral */
  lantern_light:{name:'Lantern Light',type:'supply',arch:'neutral',rarity:'common',cost:1,art:'ic_lantern',icon:true,
    desc:u=>`Gain <b>${u?5:3}</b> Progress. Draw 2 cards.`, play:async(c,u)=>{c.prog(u?5:3); await c.draw(2);}},
  take_bearings:{name:'Take Bearings',type:'action',arch:'neutral',rarity:'common',cost:1,art:'ic_compass',icon:true,
    desc:u=>`Gain <b>${u?8:5}</b> Stability. Draw 2 extra cards next turn.`, play:async(c,u)=>{c.stab(u?8:5); c.nextDraw+=2;}},
  read_the_map:{name:'Read the Map',type:'action',arch:'neutral',rarity:'uncommon',cost:1,costUp:0,art:'ic_scroll',icon:true,exhaust:true,
    desc:u=>`Draw 3 cards. <i>Exhaust.</i>`, play:async(c,u)=>{await c.draw(3);}},
  leave_it_on_the_trail:{name:'Leave It on the Trail',type:'action',arch:'neutral',rarity:'uncommon',cost:0,art:'ic_satchel',icon:true,exhaust:true,

<script>
/* Manifest Deck: 1848 — Phase 2 tactical hazards (no randomness) */
'use strict';

const AVALANCHE_STEPS = Object.freeze([
  Object.freeze({id:'fracture',name:'Cracking Cornice',icon:'scatter',damage:5,pressure:18,
    tell:'Loose rock is falling. Pressure rises 18 after this attack; a larger collapse is two turns away.'}),
  Object.freeze({id:'slide',name:'Slipping Shelf',icon:'curse',damage:7,pressure:22,
    tell:'The snow shelf slips. Pressure rises 22; the main avalanche strikes next turn.'}),
  Object.freeze({id:'impact',name:'The Mountain Breaks',icon:'attack',damage:9,pressure:0,
    tell:'THE BREAK: incoming damage scales with pressure. Brace, scout, or escape before ending the turn.'}),
]);

function newAvalancheState(){return {
  pressure:14,peak:14,damageTaken:0,hits:0,blocked:0,collapseCount:0,
  bracedThisTurn:false,surgedThisTurn:false,surveyUsed:false,shedUsed:false,
  shedCard:null,scoutUsed:false,actions:[],intentHistory:[],outcomeApplied:false,
};}

function avalancheStep(index){return AVALANCHE_STEPS[index%AVALANCHE_STEPS.length];}
function avalancheIntent(state,index){
  const step=avalancheStep(index);
  const damage=step.id==='impact'?step.damage+Math.floor(state.pressure/16)*3:step.damage;
  return {n:step.name,i:step.icon,d:damage,t:step.tell,step:step.id};
}
function avalanchePressure(state,delta){
  state.pressure=Math.max(0,Math.min(100,state.pressure+delta));
  state.peak=Math.max(state.peak,state.pressure);
  return state.pressure;
}
function avalancheResolve(state,index,damageTaken,blocked){
  const step=avalancheStep(index);
  state.intentHistory.push(step.id);
  state.damageTaken+=Math.max(0,damageTaken);
  state.blocked+=Math.max(0,blocked);
  if(damageTaken>0) state.hits++;
  if(step.id==='impact'){
    state.collapseCount++;
    // A new slope begins gathering after the collapse; the sequence stays predictable.
    state.pressure=14;
  } else avalanchePressure(state,step.pressure);
  return step.id;
}
function avalancheOutcome(state){
  const grade=state.damageTaken===0&&!state.shedUsed?'clean':state.damageTaken<=10?'narrow':'costly';
  // Sacrificed cargo is already a permanent cost; do not also charge recovery days for a zero-damage escape.
  const days=state.damageTaken===0?0:grade==='narrow'?1:2;
  const title=grade==='clean'?'Flawless Escape':grade==='narrow'?'Narrow Escape':'Costly Escape';
  return {grade,days,title,damage:state.damageTaken,peak:state.peak,
    cargoLost:state.shedCard,scoutUsed:state.scoutUsed,collapses:state.collapseCount};
}

]);
function newRiverState(act){return {depth:18+act*8,current:20,integrity:78,damageTaken:0,
  peakCurrent:20,turns:0,reinforcedThisTurn:false,fordedThisTurn:false,
  sounded:false,waited:false,secured:false,unloaded:false,unloadedCard:null,
  restDays:0,breachUsed:false,actions:[],intentHistory:[],outcomeApplied:false};}
function riverStep(index){return RIVER_STEPS[index%RIVER_STEPS.length];}
function riverIntent(state,index){const step=riverStep(index);
  const damage=step.damage+Math.floor(state.current/22)+Math.floor(state.depth/28)+
    (state.integrity<30?4:0);
  return {n:step.name,i:step.icon,d:damage,t:step.tell,step:step.id};}
function riverCurrent(state,delta){state.current=Math.max(0,Math.min(100,state.current+delta));
  state.peakCurrent=Math.max(state.peakCurrent,state.current);return state.current;}
function riverIntegrity(state,delta){state.integrity=Math.max(0,Math.min(100,state.integrity+delta));return state.integrity;}
function riverResolve(state,index,actualDamage){const step=riverStep(index);
  state.turns++;state.damageTaken+=Math.max(0,actualDamage);
  state.intentHistory.push(step.id);riverCurrent(state,step.change);
  // The current also stresses the lashings; reinforcement restores them.
  riverIntegrity(state,step.id==='surge'?-12:step.id==='snag'?-7:-3);

}
function riverOutcome(state){const grade=state.damageTaken===0&&!state.unloaded?'clean':
  state.damageTaken<=11?'narrow':'costly';
  const recoveryDays=state.damageTaken>11?2:state.damageTaken>0?1:0;

<script>
/* Phase 9 — Columbia Gorge's connected blizzard and rapids finale.
 * Pure deterministic mechanics, JSON-safe state, no global randomness or DOM.
 */
'use strict';
const FINALE_PATTERNS=Object.freeze({
 blizzard:Object.freeze([
  Object.freeze({id:'flurries',n:'Ice on the Canvas',i:'attack',d:5,delta:13,t:'Wind chills the company. A whiteout is two turns away.'}),
  Object.freeze({id:'crosswind',n:'Crosswind',i:'freeze',d:6,delta:17,t:'Ice fog closes in. The whiteout will strike next turn.'}),
  Object.freeze({id:'whiteout',n:'Whiteout',i:'attack',d:9,delta:0,t:'WHITEOUT: damage increases with Blizzard Pressure. A new storm forms after impact.'})
 ]),
 rapids:Object.freeze([
  Object.freeze({id:'eddies',n:'Shifting Eddies',i:'attack',d:5,delta:12,t:'Water pulls toward hidden rocks. A crest is two turns away.'}),
  Object.freeze({id:'snag',n:'Timber Snag',i:'scatter',d:6,delta:15,t:'The raft meets floating timber. The main rapid is next.'}),
  Object.freeze({id:'crest',n:'Columbia Rapids',i:'attack',d:10,delta:0,t:'RAPID CREST: damage scales with current and raft damage.'})
 ])
});
const cap=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
function newFinaleState(stage,previous=null){
 if(!FINALE_PATTERNS[stage])throw Error('Invalid finale phase');
 const carry=previous&&stage==='rapids'?{
   damage:previous.damage,blocked:previous.blocked,extraDays:previous.extraDays,
   phase1Pressure:previous.peak,phase1Damage:previous.damage,actions:[...previous.actions],
   phase1Completed:true
 }:{};
 const integrity=stage==='rapids'?cap(85-Math.floor((carry.phase1Pressure||20)/6),45,85):null;
 return {stage,pressure:stage==='blizzard'?22:18,peak:stage==='blizzard'?22:18,
  integrity,damage:0,blocked:0,extraDays:0,phase1Pressure:0,phase1Damage:0,
  phase1Completed:false,turnProtect:false,turnPush:false,chartUsed:false,waitUsed:false,
  soundUsed:false,repairUsed:false,breachUsed:false,whiteoutUsed:false,threadUsed:0,
  cycles:0,actions:[],outcomeApplied:false,...carry};
}
function finaleStep(state,index){return FINALE_PATTERNS[state.stage][index%3];}
function finaleIntent(state,index){
 const s=finaleStep(state,index),big=s.id==='whiteout'||s.id==='crest';
 return {n:s.n,i:s.i,d:s.d+(big?Math.floor(state.pressure/20)*2:0)+
   (s.id==='crest'?Math.max(0,Math.floor((70-state.integrity)/20)*2):0),t:s.t,step:s.id};
}
function finalePressure(state,delta){state.pressure=cap(state.pressure+delta);state.peak=Math.max(state.peak,state.pressure);return state.pressure;}
function finaleIntegrity(state,delta){if(state.stage!=='rapids')return null;state.integrity=cap(state.integrity+delta);return state.integrity;}
function finaleResolve(state,index,damage,blocked){
 const step=finaleStep(state,index);
 state.damage+=Math.max(0,damage);state.blocked+=Math.max(0,blocked);
 if(state.stage==='rapids')finaleIntegrity(state,step.id==='crest'?-16:step.id==='snag'?-9:-3);
 if(step.id==='whiteout'||step.id==='crest'){
  state.cycles++;state.pressure=state.stage==='blizzard'?22:18;
 }else finalePressure(state,step.delta);
 return step.id;
}
/** Stagecoach-only optional shortcut in rapids: substantial progress at real raft/current risk.
 * The combat engine enforces Stamina, wagon identity, once/turn and 2/encounter.
 * No source of free Gold/HP, no game randomness; legacy snapshots default to zero uses.
 */
function finaleThreadEffect(state){
 if(state.stage!=='rapids'||(state.threadUsed||0)>=2)return null;
 state.threadUsed=(state.threadUsed||0)+1;
 finaleIntegrity(state,-17);
 finalePressure(state,19);
 return {progress:24,integrity:-17,pressure:19,hp:-2,uses:state.threadUsed};
}
function finaleOutcome(state){
 const grade=state.damage===0&&!state.breachUsed?'clean':state.damage<=14?'narrow':'costly';
 return {grade,title:grade==='clean'?'The Gorge Conquered':grade==='narrow'?'Against the Current':'The Price of Passage',
  damage:state.damage,blocked:state.blocked,phase1Damage:state.phase1Damage,
  phase1Pressure:state.phase1Pressure,integrity:state.integrity,peak:state.peak,
  days:state.damage>18?2:state.damage>0?1:0,extraDays:state.extraDays,
  breached:state.breachUsed,cycles:state.cycles,actions:[...state.actions]};
}
if(typeof module!=='undefined'&&module.exports)module.exports={FINALE_PATTERNS,newFinaleState,finaleStep,finaleIntent,finalePressure,finaleIntegrity,finaleResolve,finaleOutcome,finaleThreadEffect};

</script>

/* Phase 17 — local, approximate foreground-time tracking for voluntary Daily tests.

'use strict';
const SessionTime=(()=>{
  const MAX_MS=12*60*60*1000;
  function start(now=Date.now()){
    return {accumulatedMs:0,activeSince:now,foreground:true};
  }
  function tick(clock,now=Date.now(),foreground=true){
    if(!clock||typeof clock!=='object')return;
    const safeNow=Number.isFinite(now)?now:Date.now();
    if(clock.foreground===true&&Number.isFinite(clock.activeSince)){
      const delta=safeNow-clock.activeSince;
      if(delta>=0&&delta<=MAX_MS)clock.accumulatedMs=Math.min(MAX_MS,Math.max(0,Number(clock.accumulatedMs)||0)+delta);
    }
    clock.foreground=!!foreground;
    clock.activeSince=foreground?safeNow:null;
  }
  function resume(clock,now=Date.now(),foreground=true){
    if(!clock||typeof clock!=='object')return;
    clock.accumulatedMs=Math.min(MAX_MS,Math.max(0,Number(clock.accumulatedMs)||0));
    clock.foreground=!!foreground;clock.activeSince=foreground?now:null;
  }
  function seconds(clock){return clock?Math.round(Math.max(0,Math.min(MAX_MS,Number(clock.accumulatedMs)||0))/1000):null;}
  return {start,tick,resume,seconds};
})();

  function tone(f,d,type='sine',v=.15,slide=0,delay=0){const c=ac(); if(!c||!PREFS.sound) return; const t=c.currentTime+delay; const o=c.createOscillator(),g=c.createGain(); o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(c.destination); o.start(t); o.stop(t+d);}
  function noise(d,v=.2,hp=800,delay=0){const c=ac(); if(!c||!PREFS.sound) return; const t=c.currentTime+delay; const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length); const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=c.createGain(); g.gain.value=v; s.connect(f).connect(g).connect(c.destination); s.start(t);}
  return {
    card(){noise(.12,.18,2500);}, hit(){tone(110,.25,'square',.18,-60);noise(.2,.25,200);},
    block(){tone(520,.08,'triangle',.12);tone(780,.1,'triangle',.08,0,.05);}, prog(){tone(330,.09,'triangle',.1,120);},
    gold(){tone(1320,.08,'sine',.1);tone(1760,.12,'sine',.08,0,.06);}, heal(){tone(523,.15,'sine',.1);tone(659,.2,'sine',.08,0,.1);},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.12,0,i*.12));}, lose(){[392,330,262,196].forEach((f,i)=>tone(f,.45,'sawtooth',.06,0,i*.22));},
    curse(){tone(200,.4,'sawtooth',.07,-90);}, click(){tone(660,.05,'square',.05);}, turn(){tone(196,.15,'triangle',.1);tone(294,.2,'triangle',.08,0,.08);},
  };
})();

/* ====================== NARRATOR ====================== */
const Narr = (()=>{
  const el=$('#narr'), img=$('#narr img'), txt=$('#narr .txt');
  let q=[], busy=false, timer=null, typing=null, done=null;
  el.addEventListener('click',()=>next());
  function say(key,opt={}){
    if(!PREFS.narr) return Promise.resolve();
    let line = TR[key] ? TR[key][Math.floor(Math.random()*TR[key].length)] : key;
    return new Promise(res=>{ q.push({line,opt,res}); if(!busy) next(); });
  }
  function once(key,opt){ if(!G||!G.seen) return say(key,opt); if(G.seen[key]) return Promise.resolve(); G.seen[key]=1; return say(key,opt); }
  function next(){
    clearTimeout(timer); clearInterval(typing);
    if(done){ const d=done; done=null; d(); }
    const it=q.shift();
    if(!it){ el.classList.remove('on','talk'); busy=false; return; }
    busy=true; done=it.res;
    img.src='/hubs/manifest-1848/art/narrator.webp';
    el.classList.toggle('top',!!it.opt.top); el.classList.toggle('big',!!it.opt.big);
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on','talk');
    let i=0; txt.textContent='';
    typing=setInterval(()=>{ i+=2; txt.textContent=it.line.slice(0,i); if(i>=it.line.length){clearInterval(typing); el.classList.remove('talk');} },22);
    timer=setTimeout(next, 2600+it.line.length*48);
  }
  function clear(){ q.forEach(x=>x.res()); q=[]; next(); }
  return {say,once,clear};
})();

let G=null;
class Run{
  constructor(wagonId,diff,seedCode=null){
    const w=WAGONS.find(x=>x.id===wagonId);
    this.wagon=wagonId; this.diff=diff; this.maxHp=w.hp+(diff==='easy'?10:0); this.hp=this.maxHp; this.gold=w.gold;
    let ids=[...STARTER]; w.remove.forEach(r=>{const i=ids.indexOf(r); if(i>=0) ids.splice(i,1);}); ids.push(...w.add);
    this.deck=ids.map(id=>({id,up:false,uid:UID++}));
    this.crew=[]; this.relics=[]; this.act=1; this.map=null; this.pos=null; this.day=START_DAY; this.flags={}; this.seen={};
    this.stats={fights:0,elites:0,purged:0,cursesPurged:0,cardsAdded:0,maxDeck:this.deck.length};
    this.removeCost=40; this.eventsSeen=[]; this.uidNext=UID; this.seedCode=normalizeSeed(seedCode)||newSeedCode();this.rngState=seedFromCode(this.seedCode);
    this.runId='R'+Date.now().toString(36).toUpperCase()+'-'+newSeedCode();this.mode='full';this.playClock=SessionTime.start();
  }
  get W(){return WAGONS.find(x=>x.id===this.wagon);}
  get cap(){return Math.max(8,this.W.cap-(this.mode==='daily'?2:0));}
  get over(){return Math.max(0,this.deck.length-this.cap);}
  addCard(id,up=false){ this.deck.push({id,up,uid:UID++}); this.stats.cardsAdded++; this.stats.maxDeck=Math.max(this.stats.maxDeck,this.deck.length); if(CARDS[id].type==='curse'){SFX.curse(); Narr.once('curse');} hud(); return id; }
  addGold(n){ this.gold=Math.max(0,this.gold+n); if(n>0) SFX.gold(); hud(); }
  hurt(n){ this.hp=Math.max(0,this.hp-n); hud(); if(n>0) moodFlash(n); }
  healHp(n){ this.hp=Math.min(this.maxHp,this.hp+n); hud(); }
  addDays(n){ this.day+=n*864e5; hud(); }
  hasCrew(id){ return this.crew.some(c=>c.id===id); }
  hasRelic(id){ return this.relics.includes(id); }
  addRelic(id){ if(!this.relics.includes(id)) this.relics.push(id); hud(); }
  randCard(rarity,arch){ let pool=REWARD_POOL.filter(id=>CARDS[id].rarity===rarity&&(!arch||CARDS[id].arch===arch)); if(!pool.length) pool=REWARD_POOL.filter(id=>CARDS[id].rarity===rarity); return pick(pool); }
  recruitRandom(){ if(this.crew.length>=4) return this.giveRandomRelic(); const opts=Object.keys(CREW).filter(k=>!this.hasCrew(k)); const id=pick(opts); this.crew.push({id,alt:gameRandom()<.4}); Narr.once('crew'); hud(); return `${CREW[id].name} joins your company! ${CREW[id].desc}`; }
  giveRandomRelic(){ const o=Object.keys(RELICS).filter(k=>!this.hasRelic(k)); if(!o.length){this.addGold(40);return 'You find 40 Gold.';} const id=pick(o); this.addRelic(id); Narr.once('relic'); return `You gain the ${RELICS[id].name}: ${RELICS[id].desc}`; }
  loseRandomCrew(){ const i=rnd(this.crew.length); const c=this.crew.splice(i,1)[0]; hud(); return CREW[c.id].name; }
  removeCard(uid){ const i=this.deck.findIndex(c=>c.uid===uid); if(i<0) return; const c=this.deck.splice(i,1)[0]; this.stats.purged++; if(CARDS[c.id].type==='curse'){ this.stats.cursesPurged++; if(this.hasCrew('preacher')){ this.maxHp+=3; this.healHp(3);} } hud(); return c; }
  purgeAllCurses(){ const cs=this.deck.filter(c=>CARDS[c.id].type==='curse'); cs.forEach(c=>this.removeCard(c.uid)); return cs.length; }
  upgradeRandom(n){ const o=shuffle(this.deck.filter(c=>!c.up&&CARDS[c.id].type!=='curse')); o.slice(0,n).forEach(c=>c.up=true); }
  async pickPurge(filter,prompt,optional=false){ const list=this.deck.filter(filter); if(!list.length) return null; const c=await pickCard(list,prompt,optional); if(c){ this.removeCard(c.uid); Narr.once('purge'); } return c; }
  async pickUpgrade(){ const list=this.deck.filter(c=>!c.up&&CARDS[c.id].type!=='curse'); if(!list.length) return null; const c=await pickCard(list,'Upgrade which card?',false,true); if(c) c.up=true; return c; }
}
// One atomic record contains the run AND any unfinished combat/reward transaction.
// A v1 map-only save is read once for migration; phase-3 writes exclusively to v2.
let R=null;
let V=null; // Active transactional fort, campfire or event visit.
let saveWarningShown=false;
const SAVE_SCHEMA=3;
function safeRunRecord(d){return !!(d && WAGONS.some(w=>w.id===d.wagon) &&
  Array.isArray(d.deck) && d.deck.every(c=>CARDS[c.id]&&Number.isFinite(c.uid)) &&
  d.map && d.map.nodes && Number.isFinite(d.hp) && Number.isFinite(d.day));}
function currentSaveMode(){return R?'reward':C?'combat':V?V.mode:'map';}
function saveCheckpoint(mode=currentSaveMode()){
  if(!G||G.finished||!G.map) return false;
  if(G.playClock)SessionTime.tick(G.playClock,Date.now(),!document.hidden);
  G.uidNext=UID;
  const record={schema:SAVE_SCHEMA,screen:mode,uidNext:UID,run:G,
    combat:mode==='combat'&&C?C.snapshot():null,
    reward:mode==='reward'?R:null,
    visit:['fort','camp','event','ferry'].includes(mode)?V:null};
  const ok=store.set(SAVE_KEY_V2,record);
  if(!ok&&!saveWarningShown){
    saveWarningShown=true;
    banner('Progress not saved','Browser storage is unavailable. Do not close this tab until the problem is resolved.');
  }
  return ok;
}
function save(){return saveCheckpoint('map');}
function safeVisitRecord(v){
  if(!v||!['fort','camp','event','ferry'].includes(v.mode))return false;
  if(v.mode==='fort')return typeof v.name==='string'&&Array.isArray(v.wares)&&v.wares.length<=8&&
    v.wares.every(w=>CARDS[w.id]&&Number.isFinite(w.price)&&w.price>=0&&typeof w.sold==='boolean');
  if(v.mode==='camp')return typeof v.finished==='boolean';
  if(v.mode==='event')return EVENTS.some(e=>e.id===v.evId)&&['choices','select','result'].includes(v.stage);
  return true;
}
function readSavedSession(){
  const d=store.get(SAVE_KEY_V2);
  if(d && [2,SAVE_SCHEMA].includes(d.schema) && safeRunRecord(d.run) &&
    (d.screen==='map' ||
     (d.screen==='combat' && d.combat && ENC[d.combat.encId]) ||
     (d.screen==='reward' && d.reward && ['normal','elite','boss'].includes(d.reward.kind)) ||
     (d.schema===SAVE_SCHEMA && ['fort','camp','event','ferry'].includes(d.screen) && safeVisitRecord(d.visit) && d.visit.mode===d.screen))) return d;
  const legacy=store.get(SAVE_KEY);
  if(safeRunRecord(legacy)) return {schema:1,screen:'map',run:legacy,uidNext:legacy.uidNext||1000};
  return null;
}
function load(){
  const d=readSavedSession(); if(!d)return null;
  const r=Object.assign(Object.create(Run.prototype),d.run);
  if(!r.runId)r.runId='LEGACY-'+normalizeSeed(r.seedCode||'UNK')+'-'+r.day+'-'+r.wagon;
  if(!r.mode)r.mode='full';
  if(r.playClock)SessionTime.resume(r.playClock,Date.now(),!document.hidden);
  UID=Math.max(UID,d.uidNext||1000,...r.deck.map(x=>x.uid+1));
  return {...d,run:r};
}
function resumeExpedition(){
  const session=load();if(!session)return titleScreen();
  G=session.run; Narr.clear();
  if(session.screen==='combat'){
    try {C=Combat.restore(session.combat);R=null;C.resume();return;}
    catch(err){console.error('Combat checkpoint invalid; preserving save rather than resetting game',err);titleScreen();return;}
  }
  if(session.screen==='reward'){C=null;R=session.reward;V=null;return rewardScreen(R.kind,true);}
  C=null;R=null;V=session.visit||null;
  if(session.screen==='fort')return fortScreen(V.name,V.hub,true);
  if(session.screen==='camp')return V.finished?afterNode():campScreen(true);
  if(session.screen==='event')return eventScreen(V.evId,true);
  if(session.screen==='ferry')return ferryScreen(true);
  mapScreen();
}

document.addEventListener('visibilitychange',()=>{
  if(!G||!G.playClock)return;
  if(document.hidden){SessionTime.tick(G.playClock,Date.now(),false);saveCheckpoint();}
  else SessionTime.resume(G.playClock,Date.now(),true);
});

const COLS=7, LANES=5;
function genMap(act){
  const nodes={}; const key=(c,l)=>c+'_'+l;
  const add=(c,l)=>{ const k=key(c,l); if(!nodes[k]) nodes[k]={c,l,next:[],type:null,jy:(gameRandom()-.5)*5,jx:(gameRandom()-.5)*2.5}; return nodes[k]; };
  const starts=shuffle([0,1,2,3,4]).slice(0,2); starts.push(rnd(5),rnd(5));
  for(const s of starts){
    let l=s; add(0,l);
    for(let c=0;c<COLS-1;c++){
      let n=clamp(l+rnd(3)-1,0,LANES-1);
      for(const nd of Object.values(nodes)) if(nd.c===c) for(const t of nd.next){ if((nd.l<l&&t>n)||(nd.l>l&&t<n)) n=l; }
      const a=add(c,l); add(c+1,n); if(!a.next.includes(n)) a.next.push(n); l=n;
    }
  }
  const W={trail:45,mystery:28,river:18,fort:5,camp:4,elite:0};
  const W2={trail:32,mystery:22,river:14,elite:18,camp:8,fort:6};
  const wpick=w=>{ let t=Object.values(w).reduce((a,b)=>a+b,0),r=gameRandom()*t; for(const[k,v]of Object.entries(w)){ if((r-=v)<0) return k; } return 'trail'; };
  const evPool=shuffle(EVENTS.filter(e=>e.acts.includes(act)).map(e=>e.id));
  let ei=0;
  for(const n of Object.values(nodes)){
    if(n.c===0) n.type='trail';
    else if(n.c===COLS-1) n.type='camp';
    else if(n.c===3) n.type=pick(['fort','fort','mystery','elite']);
    else n.type=wpick(n.c<=2?W:W2);
    if(n.type==='mystery') n.ev=evPool[ei++%evPool.length];
  }
  // at most 2 forts, never fort straight after fort
  const forts=shuffle(Object.values(nodes).filter(n=>n.type==='fort'));
  forts.slice(2).forEach(n=>{ n.type='mystery'; n.ev=evPool[ei++%evPool.length]; });
  for(const n of Object.values(nodes)) if(n.type==='fort') for(const l of n.next){ const t=nodes[(n.c+1)+'_'+l]; if(t&&t.type==='fort') t.type='trail'; }
  // guarantee at least one fort reachable
  if(!Object.values(nodes).some(n=>n.type==='fort')){ const m=Object.values(nodes).filter(n=>n.c===3); if(m.length) m[0].type='fort'; }
  return {nodes,done:[],bossDone:false};
}
// Phase 6 tentative calendar tuning: preserve Act I's Independence Rock challenge,
// but shorten the final stretch so winter risk comes from choices and consequences,
// rather than being almost unavoidable in the untouched base route.
function travelDaysFor(type,act,hasWatch=false){
  const baseline=NODE_DAYS[type];
  if(!Number.isFinite(baseline))throw Error('Unknown trail stop type');
  const finalPush=act===3?(type==='trail'?1:type==='boss'?2:0):0;
  return Math.max(1,baseline-finalPush-(hasWatch?1:0));
}

const NODE_NAME={trail:'The Trail',river:'River Crossing',fort:'Trading Fort',camp:'Campfire',mystery:'Unknown',elite:'Dangerous Obstacle',boss:'Act Boss'};

    <div class="legend paper">${['trail','river','mystery','fort','camp','elite'].map(t=>`<span class="li"><img src="${A(NODE_ICON[t])}" style="${t==='elite'?'filter:hue-rotate(-30deg) saturate(1.6)':''}">${NODE_NAME[t]} <small>${daysTip(t)}</small></span>`).join('')}</div></div><div class="crewstrip"></div>`;
  hud();
  s.onkeydown=e=>{
    const node=e.target.closest('.node.avail[role="button"]');
