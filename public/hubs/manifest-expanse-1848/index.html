class Combat{
  constructor(encId){
    this.encId=encId; this.e=ENC[encId]; this.scale=ACT_SCALE[G.act];
    this.need=Math.round(this.e.need*(this.e.boss||this.e.elite?1:this.scale.need)*(this.e.boss||this.e.elite?1:1));
    this.p=0; this.bar=0; this.st=0; this.stam=3; this.turn=0; this.enr=0; this.escN=0;
    this.startHp=G.hp;this.cardsPlayed=0;this.previousTurns=0;
    this.draw_=shuffle(G.deck.map(c=>({...c,master:true}))); this.hand=[]; this.disc=[]; this.exh=[];
    this.powers={}; this.nextDraw=0; this.nextStam=0; this.retainStab=false; this.playedThisTurn=0; this.actionsPlayed=0;
    this.smithUsed=false; this.gamblerUsed=false; this.supplyPlayed=false; this.provisionHeals=0; this.shoeUsed=false; this.expressMomentumUsed=false; this.combatGoldEarned=0; this.inspectMode=false; this.phase='start';
    this.tacticalAvalanche=encId==='avalanche' && PREFS.hazardV2!==false;
    this.avalanche=this.tacticalAvalanche?newAvalancheState():null;
    this.tacticalRiver=encId==='river'&&PREFS.riverV2!==false;
    this.river=this.tacticalRiver?newRiverState(G.act):null;
    this.tacticalEcology=(['buffalo','wolves'].includes(encId)&&PREFS.wildlifeV2!==false)||(['dust','supercell','bluemtn'].includes(encId)&&PREFS.weatherV2!==false);
    this.ecology=this.tacticalEcology?newEcologyState(encId,G.act):null;
    this.tacticalElite=ELITE_PATTERNS[encId]!==undefined && PREFS.eliteV2!==false;
    this.elite=this.tacticalElite?newEliteState(encId):null;
    this.tacticalFinale=['columbia1','columbia2'].includes(encId)&&PREFS.finaleV2!==false;
    this.finale=this.tacticalFinale?newFinaleState(encId==='columbia1'?'blizzard':'rapids'):null;
    this.tacticalBarlow=encId==='barlow';
    this.barlow=this.tacticalBarlow?newBarlowState():null;
    this.intentIdx=this.tacticalEcology||this.e.boss||this.e.elite?0:rnd(this.e.intents.length); this.name=this.e.boss||this.e.elite?this.e.name:(PLACE_NAMES[G.act][encId]||this.e.name);
  }
  snapshot(){
    const keys=['encId','need','p','bar','st','stam','turn','enr','escN','draw_','hand','disc','exh','powers',
      'nextDraw','nextStam','retainStab','playedThisTurn','actionsPlayed','smithUsed','gamblerUsed',
      'supplyPlayed','provisionHeals','shoeUsed','combatGoldEarned','inspectMode','phase',
      'tacticalAvalanche','avalanche','tacticalRiver','river','tacticalEcology','ecology','tacticalElite','elite','tacticalFinale','finale','tacticalBarlow','barlow','intentIdx','name','tolerated','lowSaid','_hitThrough',
      'winning','completionApplied','turnState','expressMomentumUsed','startHp','cardsPlayed','previousTurns'];
    const out={};for(const key of keys)if(this[key]!==undefined)out[key]=this[key];
    return JSON.parse(JSON.stringify(out));
  }
  static restore(state){
    if(!state||!ENC[state.encId]||!Array.isArray(state.hand)||!Array.isArray(state.draw_)||
       !Array.isArray(state.disc)||!Array.isArray(state.exh)||
       !['start','player','enemy','over'].includes(state.phase))throw Error('Invalid combat checkpoint');
    const c=Object.create(Combat.prototype);
    Object.assign(c,state);c.e=ENC[c.encId];c.scale=ACT_SCALE[G.act];
    c.busy=false;c.picking=null;c.oxTimer=null;c.mvT=null;
    if(c.tacticalAvalanche&&!c.avalanche)throw Error('Missing avalanche state');
    if(c.tacticalRiver&&!c.river)throw Error('Missing river state');
    if(c.tacticalEcology&&(!c.ecology||c.ecology.id!==c.encId||!ECO_CYCLES[c.encId]))throw Error('Invalid wildlife/weather state');
    if(c.tacticalElite&&(!c.elite||c.elite.id!==c.encId||!ELITE_PATTERNS[c.encId]))throw Error('Invalid tactical elite state');
    if(c.tacticalFinale&&(!c.finale||c.finale.stage!==(c.encId==='columbia1'?'blizzard':'rapids')||!Number.isFinite(c.finale.pressure)))throw Error('Invalid tactical finale state');
    if(c.tacticalBarlow&&(!c.barlow||c.encId!=='barlow'||!Number.isFinite(c.barlow.brakes)||!Number.isFinite(c.barlow.pressure)))throw Error('Invalid Barlow checkpoint');
    return c;
  }
  async resume(){
    show('combat');this.build();
    if(this.phase==='start')return this.start();
    if(this.phase==='enemy')return this.resolveEnemyTurn();
    if(this.phase==='over'){
      if(this.winning){this.winning=false;return this.win();}
      return this.lose();
    }
    // Only saved fully resolved player decisions are resumed; card-selection callbacks
    // are intentionally restored to the preceding stable hand rather than half-replayed.
    this.render();
  }
  get intent(){return this.tacticalBarlow?barlowIntent(this.barlow,this.intentIdx):this.tacticalFinale?finaleIntent(this.finale,this.intentIdx):this.tacticalElite?eliteIntent(this.elite,this.intentIdx):this.tacticalAvalanche?avalancheIntent(this.avalanche,this.intentIdx):this.tacticalRiver?riverIntent(this.river,this.intentIdx):this.tacticalEcology?ecoIntent(this.ecology,this.intentIdx):this.e.intents[this.intentIdx%this.e.intents.length];}
  dmgOf(it){ if(!it.d) return 0; const diff=G.diff==='easy'?.8:1; let d=Math.round(it.d*this.scale.dmg*diff)+this.enr+(it.esc?it.esc*this.escN:0); if(this.encId==='columbia1'&&G.day>WINTER_DAY) d+=3; return d; }
  hasTag(t){ return (this.e.tags||[]).includes(t); }
  crew(id){ return G.hasCrew(id); }
  costOf(ci){ const d=CARDS[ci.id]; let c=(ci.up&&d.costUp!=null)?d.costUp:d.cost; if(c<0) return c; if(SPEED.has(ci.id)&&this.hand.some(x=>x.id==='mudlocked')) c+=1; if(d.type==='supply'&&this.crew('blacksmith')&&!this.smithUsed) c=0; return c; }
  playable(ci){ const d=CARDS[ci.id]; const needsAnother=ci.id==='lighten_the_load'||ci.id==='leave_it_on_the_trail'; return this.hand.includes(ci) && (!needsAnother||this.hand.length>=2) && !d.unplayable && this.costOf(ci)<=this.stam && this.phase==='player'; }
  /* effects */
  prog(n){ n=Math.max(0,Math.round(n)); if(!n) return; let left=n; if(this.bar>0){ const b=Math.min(this.bar,left); this.bar-=b; left-=b; floatAt('.foe .barrier','-'+b,'#9fd3ff'); }
    this.p+=left; if(this.p>=this.need&&!this.busy&&this.phase!=='over') setTimeout(()=>this.win(),0); floatAt('.foe .art','+'+n,'#ffe08a'); vfxAt('.foe .art','vfx_gold',.6); SFX.prog(); $('.foe')?.classList.add('hit'); setTimeout(()=>$('.foe')?.classList.remove('hit'),300); this.render(); }
  stab(n){ if(this.hand.some(x=>x.id==='frostbite')) n-=2*this.hand.filter(x=>x.id==='frostbite').length; n=Math.max(0,n); this.st+=n; if(n){ floatAt('.shieldb','+'+n,'#9fd3ff'); SFX.block(); } this.render(); }
  heal(n){ const b=G.hp; G.healHp(n); if(G.hp>b){ floatAt('.rig','+'+(G.hp-b)+' HP','#8ff08a'); SFX.heal(); } }
  selfHurt(n,src){ if(n<=0) return; G.hurt(n); floatAt('.rig','-'+n,'#ff7a5c'); SFX.hit(); flashRed(); }
  gold(n){ const m=Math.min(Math.max(0,n),Math.max(0,COMBAT_GOLD_CAP-this.combatGoldEarned)); if(!m) return 0; this.combatGoldEarned+=m; G.addGold(m); floatAt('.rig','+'+m+' gold','#ffe08a'); if(this.powers.monopoly) this.prog(this.powers.monopoly); return m; }
  spend(n){ G.addGold(-n); floatAt('.rig','-'+n+' gold','#ffe08a'); }
  gainStam(n){ this.stam+=n; this.render(); }
  power(id,v){ this.powers[id]=(this.powers[id]||0)+v; banner(CARDS[{hitch:'double_time_hitch',monopoly:'manifest_monopoly',campfire:'campfire_prep',grit:'plague_doctors_grit'}[id]].name,'Power active',$('#combat')); }
  barrier(n){ n=Math.round(n*(this.e.boss||this.e.elite?1:this.scale.need)); this.bar+=n; this.render(); }
  enrage(n){ this.enr+=Math.round(n*this.scale.dmg); }
  addTemp(id,dest){ const c={id,up:false,uid:UID++,temp:true}; if(dest==='hand'&&this.hand.length<10) this.hand.push(c); else if(dest==='draw'){ this.draw_.splice(rnd(this.draw_.length+1),0,c);} else this.disc.push(c); SFX.curse(); this.render(); }
  removeFromPiles(ci){ for(const p of [this.hand,this.draw_,this.disc]){ const i=p.indexOf(ci); if(i>=0){ p.splice(i,1); return true; } } return false; }
  exhaustCard(ci){ this.removeFromPiles(ci); this.exh.push(ci); this.onExhaust(); this.render(); }
  onExhaust(){ if(this.powers.campfire){ this.prog(this.powers.campfire); this.stab(this.powers.campfire);} if(G.wagon==='schooner'&&this.provisionHeals<3){ this.provisionHeals++; this.heal(1);} }
  purge(ci){ this.removeFromPiles(ci); if(ci.master) G.removeCard(ci.uid); floatAt('.rig','Purged '+CARDS[ci.id].name,'#f3d98f'); this.render(); }
  discardCard(ci){ const i=this.hand.indexOf(ci); if(i>=0){ this.hand.splice(i,1); this.disc.push(ci);} this.render(); }
  discardRandom(n){ for(let i=0;i<n&&this.hand.length;i++){ const c=this.hand.splice(rnd(this.hand.length),1)[0]; this.disc.push(c);} this.render(); }
  stealIfHit(n){ if(this._hitThrough){ const s=Math.min(G.gold,n); if(s){ G.addGold(-s); floatAt('.rig','-'+s+' gold stolen','#ffe08a'); } } }
  undertow(th){ if(this.st<th){ const s=this.hand.concat(this.draw_).find(x=>CARDS[x.id].type==='supply'); if(s){ this.removeFromPiles(s); this.exh.push(s); floatAt('.rig',CARDS[s.id].name+' washed away','#9fd3ff'); } } }
  async draw(n){
    const got=[];
    for(let i=0;i<n;i++){
      if(!this.draw_.length){ if(!this.disc.length) break; this.draw_=shuffle(this.disc); this.disc=[]; }
      const c=this.draw_.pop();
      if(this.hand.length>=10){ this.disc.push(c); continue; }
      this.hand.push(c); got.push(c);
      if(CARDS[c.id].type==='curse'){
        if(this.powers.grit){ this.prog(this.powers.grit); this.stab(this.powers.grit); }
        if(G.wagon==='apothecary'&&!this.tolerated){ this.tolerated=true; n++; this.prog(2); this.stab(3); }
      }
    }
    this.render(); return got;
  }
  chooseFromHand(prompt,filter,fn,optional=false){
    const opts=this.hand.filter(filter); if(!opts.length)return Promise.resolve(null);
    return new Promise(res=>{this.picking={prompt,opts,fn:(c)=>{fn(c);res(c);},
      cancel:optional?()=>res(null):null};this.render();});
  }
  cancelPick(){
    if(!this.picking||!this.picking.cancel)return false;
    const action=this.picking.cancel;this.picking=null;action();this.render();return true;
  }
  async gamblerRedraw(){ if(this.gamblerUsed||this.phase!=='player'||this.busy||this.picking) return; this.busy=true;this.gamblerUsed=true; SFX.card(); this.disc.push(...this.hand); this.hand=[]; await this.draw(5);this.busy=false; hud();saveCheckpoint('combat');this.render(); }
  inspectCard(ci){
    if(this.phase!=='player'||this.busy||this.picking||!this.hand.includes(ci)) return;
    const playable=this.playable(ci);
    const note=!playable&&(ci.id==='lighten_the_load'||ci.id==='leave_it_on_the_trail')&&this.hand.length<2
      ? 'You need another card in your hand to play this.' : (!playable?'Not playable right now.':'');
    const o=overlay(`<h2>${CARDS[ci.id].name}</h2><p class="sub">Inspect your card without playing it.</p>
      <div class="cardgrid">${cardHTML(ci)}</div>${note?`<p class="sub">${note}</p>`:''}
      <div class="row"><button class="btn" data-play ${playable?'':'disabled'}>Play This Card</button>
      <button class="btn dark" data-x>Back to Hand</button></div>`,$('#combat'));
    o.addEventListener('click',e=>{
      if(e.target.closest('[data-x]')){o.remove();return;}
      if(e.target.closest('[data-play]')&&C===this&&this.playable(ci)){
        o.remove();this.inspectMode=false;this.play(ci);
      }
    });
  }
  /* Avalanche vertical slice: deterministic telegraphs, finite choices, permanent consequences. */
  canHazardAction(action){
    if(!this.tacticalAvalanche||this.phase!=='player'||this.busy||this.picking) return false;
    if(action==='brace') return this.stam>=1&&!this.avalanche.bracedThisTurn;
    if(action==='surge') return this.stam>=1&&!this.avalanche.surgedThisTurn;
    if(action==='survey') return this.stam>=1&&!this.avalanche.surveyUsed;
    if(action==='shed') return !this.avalanche.shedUsed && this.hand.some(x=>this.canShed(x));
    return false;
  }
  canShed(ci){return ci.master && CARDS[ci.id].type!=='curse' && G.deck.some(x=>x.uid===ci.uid);}
  async hazardAction(action){
    if(!this.canHazardAction(action)) return false;
    const a=this.avalanche;
    if(action==='shed'){
      // Selection is deliberate: if there is no eligible cargo the action does nothing.
      this.busy=true;
      try {
        const chosen=await this.chooseFromHand('Abandon one permanent cargo card',x=>this.canShed(x),x=>{
          if(!this.canShed(x)) return;
          G.removeCard(x.uid); this.removeFromPiles(x);
          a.shedCard=CARDS[x.id].name;a.shedUsed=true;
          avalanchePressure(a,-14);this.prog(G.wagon==='schooner'?18:14);
          a.actions.push('shed');saveCheckpoint('combat');banner('Cargo Lost',a.shedCard,$('#combat'));
        },true);
        if(!chosen) return false;
      } finally { this.busy=false;this.render(); }
      if(this.p>=this.need&&!this.winning) await this.win();
      return true;
    }
    this.stam--;
    if(action==='brace'){
      a.bracedThisTurn=true;this.stab(G.wagon==='conestoga'?12:8);
      avalanchePressure(a,-8);a.actions.push('brace');
      floatAt('.rig','Braced','#9fd3ff');SFX.block();
    } else if(action==='surge'){
      a.surgedThisTurn=true;avalanchePressure(a,10);
      this.prog(G.wagon==='stagecoach'?12:9);a.actions.push('surge');
      floatAt('.rig','Drive Hard!','#ffe08a');
    } else if(action==='survey'){
      a.surveyUsed=true;a.scoutUsed=this.crew('scout');
      avalanchePressure(a,this.crew('scout')?-18:G.wagon==='apothecary'?-12:-10);
      this.prog(this.crew('scout')?8:4);
      if(G.wagon==='apothecary')this.stab(3);
      a.actions.push('survey');banner('Safer Line',this.crew('scout')?'Scout leads the way':'A careful survey',$('#combat'));
    }
    this.render();saveCheckpoint('combat');
    if(this.p>=this.need&&!this.winning) await this.win();
    return true;
  }
  applyAvalancheOutcome(){
    if(!this.tacticalAvalanche||this.avalanche.outcomeApplied)return null;
    const result=avalancheOutcome(this.avalanche);
    this.avalanche.outcomeApplied=true;
    G.flags.avalancheReport={...result,turns:this.turn};
    if(result.days) G.addDays(result.days);
    if(result.grade==='clean') G.addGold(10);
    return result;
  }
  /* River crossing: distinct, finite, inspectable choices with explicit costs. */
  canRiverAction(action){
    if(!this.tacticalRiver||this.phase!=='player'||this.busy||this.picking)return false;
    const r=this.river;
    if(action==='sound')return this.stam>=1&&!r.sounded;
    if(action==='reinforce')return this.stam>=1&&!r.reinforcedThisTurn;
    if(action==='ford')return this.stam>=1&&!r.fordedThisTurn;
    if(action==='wait')return !r.waited;
    if(action==='secure')return this.stam>=1&&!r.secured;
    if(action==='unload')return !r.unloaded&&this.hand.some(x=>this.canShed(x));
    return false;
  }
  async riverAction(action){
    if(!this.canRiverAction(action))return false;
    const r=this.river;
    if(action==='unload'){
      this.busy=true;
      try{
        const card=await this.chooseFromHand('Abandon cargo to lighten the raft',x=>this.canShed(x),x=>{
          if(!this.canShed(x))return;
          G.removeCard(x.uid);this.removeFromPiles(x);
          r.unloaded=true;r.unloadedCard=CARDS[x.id].name;
          riverCurrent(r,-15);riverIntegrity(r,18);this.prog(12);
          r.actions.push('unload');saveCheckpoint('combat');banner('Cargo Left Behind',r.unloadedCard,$('#combat'));
        },true);
        if(!card)return false;
      }finally{this.busy=false;this.render();}
      if(this.p>=this.need&&!this.winning)await this.win();return true;
    }
    if(action==='wait'){
      r.waited=true;r.restDays+=2;G.addDays(2);riverCurrent(r,-14);r.actions.push('wait');
      banner('Wait for Slower Water','Two extra trail days',$('#combat'));
    }else{
      this.stam--;
      if(action==='sound'){
        r.sounded=true;r.depth=Math.max(8,r.depth-(this.crew('scout')?12:8));riverCurrent(r,-7);
        this.prog(this.crew('scout')?7:3);r.actions.push('sound');
      }else if(action==='reinforce'){
        r.reinforcedThisTurn=true;riverIntegrity(r,G.wagon==='conestoga'?20:15);
        this.stab(5);r.actions.push('reinforce');
      }else if(action==='ford'){
        r.fordedThisTurn=true;riverCurrent(r,12);riverIntegrity(r,-8);
        this.prog(G.wagon==='stagecoach'?14:11);r.actions.push('ford');
      }else if(action==='secure'){
        r.secured=true;riverIntegrity(r,12);this.stab(9);
        G.addDays(1);r.restDays++;r.actions.push('secure');
      }
    }
    this.render();saveCheckpoint('combat');
    if(this.p>=this.need&&!this.winning)await this.win();return true;
  }
  applyRiverOutcome(){
    if(!this.tacticalRiver||this.river.outcomeApplied)return null;
    const result=riverOutcome(this.river);this.river.outcomeApplied=true;
    G.flags.riverReports=G.flags.riverReports||[];
    G.flags.riverReports.push({...result,act:G.act,turns:this.turn});
    G.flags.pendingRiverReport=result;
    if(result.recoveryDays)G.addDays(result.recoveryDays);
    if(result.grade==='clean')G.addGold(5);
    return result;
  }
  /* Phase 5: tactical wildlife and weather, with finite actions and irreversible costs. */
  canEcologyAction(action){
    if(!this.tacticalEcology||this.phase!=='player'||this.busy||this.picking)return false;
    const e=this.ecology;
    if(e.kind==='wildlife'){
      if(action==='hold')return this.stam>=1&&!e.holdUsed;
      if(action==='drive')return this.stam>=1&&!e.driveUsed;
      if(action==='observe')return this.stam>=1&&!e.observeUsed;
      if(action==='divert')return e.id==='buffalo'&&this.stam>=1&&!e.divertUsed;
      if(action==='signal')return e.id==='wolves'&&this.stam>=1&&!e.signalUsed;
    }else{
      if(action==='shield')return this.stam>=1&&!e.shieldUsed;
      if(action==='race')return this.stam>=1&&!e.raceUsed;
      if(action==='chart')return this.stam>=1&&!e.chartUsed;
      if(action==='tether')return this.stam>=1&&!e.tetherUsed;
      if(action==='wait')return !e.waitUsed;
    }
    return false;
  }
  async ecologyAction(action){
    if(!this.canEcologyAction(action))return false;
    const e=this.ecology;
    if(action==='wait'){
      e.waitUsed=true;e.extraDays+=2;G.addDays(2);ecoExposure(e,-20);ecoVisibility(e,18);
      banner('Weather Delay','Two trail days spent waiting',$('#combat'));
    }else{
      this.stam--;
      if(action==='hold'){
        e.holdUsed=true;ecoThreat(e,-9);this.stab(G.wagon==='conestoga'?12:8);
      }else if(action==='drive'){
        e.driveUsed=true;ecoThreat(e,12);this.prog(G.wagon==='stagecoach'?15:11);
      }else if(action==='observe'){
        e.observeUsed=true;ecoThreat(e,this.crew('scout')?-24:-14);
        this.prog(this.crew('scout')?8:4);
      }else if(action==='divert'){
        e.divertUsed=true;e.extraDays++;G.addDays(1);ecoThreat(e,-25);this.stab(6);
        banner('Long Way Round','One extra trail day',$('#combat'));
      }else if(action==='signal'){
        e.signalUsed=true;ecoThreat(e,-22);this.stab(8);
        banner('Campfires Lit','Wolves hesitate at the lights',$('#combat'));
      }else if(action==='shield'){
        e.shieldUsed=true;ecoExposure(e,-12);ecoVisibility(e,4);
        this.stab(G.wagon==='conestoga'?12:9);
      }else if(action==='race'){
        e.raceUsed=true;ecoExposure(e,12);ecoVisibility(e,-10);
        this.prog(G.wagon==='stagecoach'?15:11);
      }else if(action==='chart'){
        e.chartUsed=true;ecoVisibility(e,this.crew('scout')?27:18);
        ecoExposure(e,this.crew('scout')?-17:-10);this.prog(this.crew('scout')?8:4);
      }else if(action==='tether'){
        e.tetherUsed=true;e.extraDays++;G.addDays(1);ecoExposure(e,-15);this.stab(13);
        banner('Cargo Lashed','One extra trail day',$('#combat'));
      }
    }
    e.actions.push(action);this.render();saveCheckpoint('combat');
    if(this.p>=this.need&&!this.winning)await this.win();
    return true;
  }
  applyEcologyOutcome(){
    if(!this.tacticalEcology||this.ecology.outcomeApplied)return null;
    const result=ecoOutcome(this.ecology);this.ecology.outcomeApplied=true;
    G.flags.ecologyReports=G.flags.ecologyReports||[];
    G.flags.ecologyReports.push({...result,act:G.act});
    G.flags.pendingEcologyReport=result;
    if(result.recoveryDays)G.addDays(result.recoveryDays);
    if(result.grade==='clean')G.addGold(4);
    return result;
  }
  /* Phase 8: bounded tactical elite decisions with durable costs and results. */
  /* Phase 9 — each finale phase has limited, saved tactical options. */
  canFinaleAction(action){
    if(!this.tacticalFinale||this.phase!=='player'||this.busy||this.picking)return false;
    const f=this.finale;
    if(f.stage==='blizzard'){
      if(action==='shelter')return this.stam>=1&&!f.turnProtect;
      if(action==='press')return this.stam>=1&&!f.turnPush;
      if(action==='chart')return this.stam>=1&&!f.chartUsed;

function rollRarity(kind){ const r=gameRandom(); if(kind==='boss') return 'rare'; if(kind==='elite') return r<.12?'rare':r<.5?'uncommon':'common'; return r<.07?'rare':r<.38?'uncommon':'common'; }
function cardChoices(kind,n){
  const out=[]; let guard=0;
  while(out.length<n&&guard++<100){ const rar=rollRarity(kind); const arch=gameRandom()<.45?G.W.arch:null; const id=G.randCard(rar,arch); if(!out.includes(id)) out.push(id); }
  return out;
}

/* ====================== PHASE 4 TRANSACTIONAL VISITS ====================== */
// A visit is generated and awarded exactly once. Its inventory, selections, and outcomes
// are included in the same save as G; reloading never rerolls or regrants visit bonuses.
function checkpointVisit(){return saveCheckpoint(V.mode);}
function visitSelection(filter,prompt,optional=false,upgrade=false){
  if(!V)return;
  V.selector={filter,prompt,optional,upgrade};checkpointVisit();openVisitSelection();
}
function visitCandidates(){
  const filter=V?.selector?.filter;
  return G.deck.filter(c=>filter==='curse'?CARDS[c.id].type==='curse':
    filter==='supply'?CARDS[c.id].type==='supply':
    filter==='noncurse'?CARDS[c.id].type!=='curse':
    filter==='upgrade'?!c.up&&CARDS[c.id].type!=='curse':true);
}
function openVisitSelection(){
  if(!V||!V.selector)return;
  const {prompt,optional,upgrade}=V.selector;
  const list=visitCandidates();
  // A previously saved picker with no candidates must not strand the expedition.
  if(!list.length){completeVisitSelection(null);return;}
  $$('.overlay.visit-choice').forEach(o=>o.remove());
  const o=overlay(`<h2>${prompt}</h2><div class="sub">${upgrade?'Choose gear to improve. ':'Choosing changes your wagon permanently. '}Load: ${G.deck.length}/${G.cap}</div>
    <div class="cardgrid">${list.map(c=>cardHTML(upgrade?{...c,up:true}:c,{cls:'small',attr:`data-visit-card="${c.uid}"`})).join('')}</div>
    ${optional?'<button class="btn dark" data-visit-cancel>Keep Everything</button>':''}`);
  o.classList.add('visit-choice');
  o.addEventListener('click',e=>{
    if(e.target.closest('[data-visit-cancel]')){o.remove();completeVisitSelection(null);return;}
    const b=e.target.closest('[data-visit-card]');if(!b)return;
    const c=visitCandidates().find(x=>String(x.uid)===b.dataset.visitCard);
    if(!c)return; o.remove();completeVisitSelection(c.uid);
  });
}
function completeVisitSelection(uid){
  if(!V?.selector)return;
  const c=uid==null?null:visitCandidates().find(x=>x.uid===uid);
  const mode=V.mode,selector=V.selector;
  if(!c&&!selector.optional){openVisitSelection();return;}
  V.selector=null;
  if(mode==='fort'){
    if(c){G.removeCard(c.uid);G.addGold(-G.removeCost);G.removeCost+=20;}
    checkpointVisit();fortScreen(V.name,V.hub,true);return;
  }
  if(mode==='camp'){
    if(c){c.up=true;V.finished=true;checkpointVisit();afterNode();return;}
    checkpointVisit();campScreen(true);return;
  }
  if(mode==='event')return resolveEventSelection(c);
}

/* ====================== EVENTS ====================== */
const PICKER_EVENT_OPTIONS={chest:[2,'curse'],blacksmith:[0,'supply',1,'upgrade'],wildfire:[1,'all'],furniture:[0,'all'],traders:[0,'noncurse']};
function eventPickerRequirement(id,choice){
  const a=PICKER_EVENT_OPTIONS[id];if(!a)return null;
  for(let i=0;i<a.length;i+=2)if(a[i]===choice)return a[i+1];
  return null;
}
function finishEvent(result){V.result=String(result||'');V.stage='result';V.selector=null;checkpointVisit();eventScreen(V.evId,true);}
function canResolveEventChoice(ev,choice){
  const filter=eventPickerRequirement(ev.id,choice);
  if(!filter||filter==='curse'||ev.id==='furniture')return true;
  return G.deck.some(c=>filter==='upgrade'?!c.up&&CARDS[c.id].type!=='curse':
    filter==='supply'?CARDS[c.id].type==='supply':
    filter==='noncurse'?CARDS[c.id].type!=='curse':true);
}
function beginEventChoice(choice){
  if(!V||V.stage!=='choices')return;
  const ev=EVENTS.find(x=>x.id===V.evId),c=ev?.choices?.[choice];if(!c||c.ok&&!c.ok(G)||!canResolveEventChoice(ev,choice))return;
  const filter=eventPickerRequirement(V.evId,choice);
  if(V.evId==='furniture'&&choice===0&&!G.deck.length)return finishEvent('Your wagon is already empty. The oxen are as light as they can travel.');
  if(filter && (filter!=='curse'||G.deck.some(x=>CARDS[x.id].type==='curse'))){
    if(!G.deck.some(x=>filter==='upgrade'?!x.up&&CARDS[x.id].type!=='curse':filter==='supply'?CARDS[x.id].type==='supply':filter==='noncurse'?CARDS[x.id].type!=='curse':true))return;
    V.choice=choice;V.stage='select';V.selections=0;
    visitSelection(filter,filter==='upgrade'?'Upgrade which card?':filter==='supply'?'Trade a Supply card':filter==='curse'?'Purge which Curse?':'Select cargo to leave behind',V.evId==='furniture',filter==='upgrade');return;
  }
  // All remaining choices are synchronous. Commit their result and effect atomically.
  if(V.evId==='chest'&&choice===2){G.maxHp+=3;G.healHp(3);finishEvent('A clear conscience. +3 Max HP.');return;}
  const result=c.go(G);if(result&&typeof result.then==='function')throw Error('Unconfigured asynchronous story choice');
  finishEvent(result);
}
function resolveEventSelection(card){
  const id=V.evId,choice=V.choice;
  if(card){if(V.selector===null && (id==='blacksmith'&&choice===1)){card.up=true;}
    else G.removeCard(card.uid);}
  if(id==='furniture'&&choice===0){
    V.selections++;
    checkpointVisit();
    if(V.selections<2&&G.deck.length){visitSelection('all','Leave another card? (2 of 2)',true);return;}
    return finishEvent('Your oxen walk a little easier.');
  }
  if(id==='chest')return finishEvent('You feel better already.');
  if(id==='blacksmith'&&choice===0){G.upgradeRandom(2);return finishEvent('Fed and grateful, he hammers your gear into shape.');}
  if(id==='blacksmith'&&choice===1){G.addGold(-25);G.maxHp+=4;G.healHp(4);return finishEvent('Fine work, fairly paid.');}
  if(id==='wildfire')return finishEvent('The fire starves at your break and passes by.');
  if(id==='traders'){G.maxHp+=5;G.healHp(15);return finishEvent(G.act===3?'Dried salmon and camas root. The best meal in weeks.':'Buffalo meat and fresh moccasins. A fair trade.');}
}
function eventScreen(evId,resuming=false){
  let ev;
  if(!resuming){
    ev=EVENTS.find(e=>e.id===evId);
    const okEv=e=>e.acts.includes(G.act)&&(!e.minDate||G.day>=e.minDate);
    if(!ev||!okEv(ev)||G.eventsSeen.includes(ev.id)){
      const pool=EVENTS.filter(e=>okEv(e)&&!G.eventsSeen.includes(e.id));ev=pool.length?pick(pool):pick(EVENTS.filter(okEv));
    }
    G.eventsSeen.push(ev.id);V={mode:'event',evId:ev.id,stage:'choices',choice:null,result:null,selections:0,selector:null};checkpointVisit();
  }else ev=EVENTS.find(e=>e.id===V.evId);
  const s=$('#event');show('event');s.style.backgroundImage=`url(${A(ACTS[G.act].bg)})`;
  const msg=ev.id==='traders'?(G.act===3?'A party of Shoshone traders has set up beside the Snake River with dried salmon, roots and horses. Emigrant diaries are full of these trades, and of Native guides who led wagons across the worst fords.':'Lakota families camped near the trail offer buffalo meat, moccasins and robes in trade for cloth, tools and sugar. Trading like this was an everyday part of the road near Fort Laramie.'):ev.text;
  s.innerHTML=`<div class="hud"></div><div class="evbox paper"><div class="pic ${ev.contain?'contain':''}" style="background-image:url(${A(ev.img)})"></div><div>
    <h2>${ev.title}</h2><p>${msg}</p>
    ${V.stage==='result'?`<div class="result">${V.result}</div><button class="btn" data-x>Continue</button>`:
      V.stage==='select'?'<div class="result">Complete your saved cargo decision to proceed.</div>':
      `<div class="choices">${ev.choices.map((c,i)=>`<button class="choice" data-c="${i}" ${(c.ok&&!c.ok(G))||!canResolveEventChoice(ev,i)?'disabled':''}><b>${c.t}</b><span>${c.d}</span></button>`).join('')}</div>`}
  </div></div>`;hud();
  if(!resuming){if(ev.id==='goldfever')Narr.say('goldNews',{pose:'tr_three'});else if(ev.id==='territory')Narr.say('territory',{pose:'tr_three'});}
  s.onclick=e=>{
    const b=e.target.closest('[data-c]');if(b&&V.stage==='choices'){SFX.click();beginEventChoice(Number(b.dataset.c));return;}
    if(e.target.closest('[data-x]')&&V.stage==='result'){if(G.hp<=0)return endScreen(false);
      const ambush=!!G.flags.ambush;if(ambush)G.flags.ambush=false;V=null;if(ambush)return fight('bandit_ambush');afterNode();}
  };
  if(V.selector)openVisitSelection();
}
function ferryScreen(resuming=false){
  if(!resuming){V={mode:'ferry'};checkpointVisit();}
  const s=$('#event');show('event');s.style.backgroundImage=`url(${A(ACTS[G.act].bg)})`;
  s.innerHTML=`<div class="hud"></div><div class="evbox paper"><div class="pic" style="background-image:url(${A('ev_ferry')})"></div><div><h2>${PLACE_NAMES[G.act].river}</h2><p>Your guide meets you at the bank and takes the company across without losing so much as a skillet.</p><div class="result">A free, safe crossing.</div><button class="btn" data-x>Continue</button></div></div>`;
  hud();s.onclick=e=>{if(e.target.closest('[data-x]')){V=null;afterNode();}};
}

/* ====================== EXPEDITION JOURNAL ====================== */
function safeJournalText(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function showJournal(){
  const d=Journal.read(localStorage),best=Journal.bestByWagon(d);
  const names=Object.fromEntries(WAGONS.map(w=>[w.id,w.name]));
  const medNames={trailblazer:'Trailblazer',independence:'Independence Day',whole:'Whole Company',prosperous:'Prosperous',constitution:'Iron Constitution',light:'Traveling Light',barlow_descent:'Barlow Road Arrival',columbia_passage:'Columbia Passage',barlow_master:'Laurel Hill Master',columbia_master:'Rapids Master',harness_master:'Harness Master',river_pilot:'River Pilot',both_routes:'Both Roads to Oregon',first_oregon:'First Oregon Arrival',four_wagons:'Four Wagon Victories',daily_finish:'Daily Dispatch'};
  const dailyBest=Object.entries(d.dailyBest||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5).map(([day,b])=>`${safeJournalText(day)}: ${safeJournalText(b.grade)} (${b.score}/100)`).join(' · ')||'No scored daily results yet';
  const wins=Object.entries(best).map(([id,e])=>`${safeJournalText(names[id])}: ${e.days} days`).join(' · ')||'No Oregon arrivals recorded yet';
  const awards=Object.entries(medNames).filter(([id])=>d.achievements[id]).map(([,v])=>v).join(' · ')||'No medals earned yet';
  const o=overlay(`<div class="ledger"><h3>Expedition Journal</h3>
    <p>Local records, kept on this device only. No student names, accounts, network scores or streak penalties.</p>
    <div class="numbers"><span>${d.totals.fullRuns} full expeditions</span><span>${d.totals.victories} Oregon arrivals</span><span>${d.totals.dailyCompletions}/${d.totals.dailyAttempts} daily dispatches completed</span></div>
    <p><b>Fastest arrivals:</b> ${wins}</p><p><b>Routes mastered:</b> ${d.routeWins?.river?'Columbia River ':''}${d.routeWins?.barlow?'Barlow Road':''}${!d.routeWins?.river&&!d.routeWins?.barlow?'None recorded yet':''}</p><p><b>Earned achievements:</b> ${awards}</p>
    <p class="daily-note"><b>Daily personal bests:</b> ${dailyBest} · Compete only against your own records; no streak pressure.</p>
    <div class="ledger-table"><table class="records"><thead><tr><th>Recorded</th><th>Journey</th><th>Outcome</th><th>Time / HP</th><th>Seed</th><th>Replay</th></tr></thead><tbody>${d.history.map((r,i)=>`<tr><td>${safeJournalText(r.date)}</td><td>${safeJournalText(names[r.wagon]||r.wagon)} ${r.mode==='daily'?'· Daily '+safeJournalText(r.dailyDate):r.route?'· '+(r.route==='barlow'?'Barlow Road':'Columbia River'):''}</td><td>${r.won?(r.mode==='daily'?'Dispatch completed · '+safeJournalText(r.dailyGrade||'Unscored')+' ('+(r.dailyScore??0)+'/100)':'Reached Oregon'):'Lost in Act '+r.act}</td><td>${r.days} days · ${r.hp} HP${r.mode==='daily'&&Number.isFinite(r.activeSeconds)?' · ~'+Math.ceil(r.activeSeconds/60)+' min foreground':''}</td><td>${safeJournalText(r.seed)}</td><td><button class="btn dark journal-replay" data-replay="${i}" aria-label="Replay seed ${safeJournalText(r.seed)}">Replay</button></td></tr>`).join('')||'<tr><td colspan="6">Finish an expedition to begin your journal.</td></tr>'}</tbody></table></div>
    <div class="footnote">The most recent ${Journal.LIMIT} finished runs are shown; lifetime totals and one-time achievements remain. This is local progress tracking, not tamper-resistant competitive scoring. Exports contain records and seeds only, never your active run.</div>
    <div class="actions"><button class="btn" data-close>Return</button><button class="btn dark" data-export>Export JSON</button><button class="btn dark" data-import>Import JSON</button><input type="file" data-file accept=".json,application/json" style="display:none" aria-label="Import an Expedition Journal JSON file"><button class="btn red" data-arm>Clear Journal</button><span data-warning role="status" aria-live="polite"></span></div>
  </div>`);
  let replayArmed=null,importArmed=null;
  const status=o.querySelector('[data-warning]');
  const fileInput=o.querySelector('[data-file]');
  o.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')){o.remove();return;}
    const replayBtn=e.target.closest('[data-replay]');
    if(replayBtn){
      const i=Number(replayBtn.dataset.replay),r=d.history[i];if(!r)return;
      if(readSavedSession()&&replayArmed!==i){replayArmed=i;status.textContent='An expedition is in progress. Tap Replay again to open the setup. Starting a new journey later replaces its checkpoint.';return;}
      if(r.mode==='daily'){
        try{const daily=Journal.dailySetup(r.dailyDate);o.remove();selectScreen({daily});}
        catch(_){status.textContent='Cannot replay this Daily Dispatch: invalid date in saved Journal.';}
        return;
      }
      o.remove();selectScreen({replay:{seed:r.seed,wagon:r.wagon,diff:r.diff}});return;
    }
    if(e.target.closest('[data-export]')){
      const json=Journal.exportText(localStorage);
      const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='ManifestExpanse1848_ExpeditionJournal.json';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      status.textContent='Journal exported locally. No data was transmitted.';return;
    }
    if(e.target.closest('[data-import]')){
      if(importArmed!==true){importArmed=true;status.textContent='Import REPLACES this device’s Journal only. Your active expedition is kept. Tap Import JSON again to select a file.';return;}
      fileInput.click();return;
    }
    if(e.target.closest('[data-confirm]')){
      const ok=Journal.clear(localStorage);
      o.remove();showJournal();if(!ok)banner('Journal not cleared','Browser storage is unavailable.');
      return;
    }
    if(e.target.closest('[data-arm]')){e.target.closest('[data-arm]').setAttribute('data-confirm','');status.textContent='Tap Clear Journal again to permanently delete local records. Current saves are not affected.';return;}
  });
  fileInput.addEventListener('change',async()=>{
    const file=fileInput.files?.[0];if(!file)return;
    importArmed=false; // A new import requires a fresh confirmation, even after a rejected file.
    if(file.size>300000){status.textContent='Import rejected: file exceeds 300 KB.';fileInput.value='';return;}
    try{
      const result=Journal.importText(localStorage,await file.text());
      if(!result.ok){status.textContent='Import rejected: '+result.reason;fileInput.value='';return;}
      o.remove();showJournal();banner('Journal Imported',result.rows+' recent records restored');
    }catch(_){status.textContent='Unable to read the selected Journal file.';fileInput.value='';}
  });
}
/* ====================== END ====================== */
function endScreen(won){
  Narr.clear(); R=null;C=null;
  const s=$('#end'); show('end'); s.style.backgroundImage=`url(${A(won?(G.mode==='daily'?'bg_fort':'bg_oregon_city'):'bg_gameover')})`;
  const days=Math.round((G.day-START_DAY)/864e5);
  const act=ACTS[G.act];
  const modeDaily=G.mode==='daily';
  const meds=[
    {img:'med_wheel',n:'Trailblazer',ok:won&&!modeDaily&&G.day<=Date.UTC(1848,8,25),d:'Reach Oregon City by Sept 25'},
    {img:'med_star',n:'Independence Day',ok:!!G.flags.indep,d:'Reach Independence Rock by July 4'},
    {img:'med_heart',n:'Whole Company',ok:won&&!modeDaily&&G.hp>=G.maxHp*.6,d:'Finish with 60% HP'},
    {img:'med_chest',n:'Prosperous',ok:G.gold>=150,d:'Hold 150 Gold'},
    {img:'med_doctor',n:'Iron Constitution',ok:G.stats.cursesPurged>=3,d:'Purge 3 Curses'},
    {img:'med_rifle',n:'Traveling Light',ok:won&&!modeDaily&&G.deck.length<=G.cap,d:'Finish within your load limit'},
  ];
  const journalMedals=meds.map((m,i)=>({id:['trailblazer','independence','whole','prosperous','constitution','light'][i],ok:m.ok&&(!modeDaily||[1,3,4].includes(i))}));
  if(G.playClock)SessionTime.tick(G.playClock,Date.now(),!document.hidden);
  G.finished=true; // Finished journeys must never be resurrected by tab-visibility autosaves.
  const recorded=Journal.record(localStorage,G,won,journalMedals);
  if(recorded.ok){store.del(SAVE_KEY);store.del(SAVE_KEY_V2);}
  const place = won?(modeDaily?'Fort Laramie':'Oregon City'):(G.lastEnc?`at ${G.lastEnc.replace(/^The /,'the ')}`:`on the road to ${act.to}`);
  const routeMastery=won&&!modeDaily&&G.flags.finalRoute ? (G.flags.finalRoute==='barlow' ? (G.flags.barlowReport?.grade==='clean'?'Laurel Hill Master: a clean descent of the Barlow Road.':'Barlow Road Arrival: an overland passage around Mount Hood.') : (G.flags.finaleReport?.grade==='clean'?'Rapids Master: a clean Columbia River passage.':'Columbia Passage: survived the blizzard and river route.')) : '';
  s.innerHTML=`<div class="news"><div class="mast"><div class="t">${modeDaily?'The Trail Dispatch':'The Oregon Spectator'}</div><div class="d"><span>${modeDaily?'Fort Laramie, Oregon Trail':'Oregon City, Oregon Territory'}</span><span>${fmtDateY(G.day)}</span><span>Price 12½ cents</span></div></div>
    <div class="head">${won?(modeDaily?'Daily Dispatch Completed!':'Wagon Company Arrives Safe!'):'Company Lost on the Trail'}</div>
    <div class="deck2">${won?(modeDaily?`${G.W.name} reaches Fort Laramie in the daily one-act challenge after ${days} days`:`${G.W.name} rolls into Oregon City after ${days} days and 2,000 miles`):`${G.W.name} met its end ${place}, ${days} days out of Independence`}</div>
    ${!won&&G.flags.lastCombatDebrief?`<div class="last-encounter-review">${Debrief.html(G.flags.lastCombatDebrief)}</div>`:''}
    <div class="cols"><div><img class="eng" src="${A(won?'eng_victory':'eng_gameover')}"></div><div>
      ${routeMastery?`<div class="avalanche-reward"><strong>Route achievement earned</strong> · ${safeJournalText(routeMastery)}</div>`:''}
      ${modeDaily&&recorded.entry?`<div class="avalanche-reward"><strong>Daily Mastery: ${recorded.entry.dailyGrade||'Incomplete'}</strong> · ${recorded.entry.dailyScore||0}/100 · Score reflects completion, health, journey days and load. Optional; no streak penalties.</div>${Number.isFinite(recorded.entry.activeSeconds)?`<div class="avalanche-reward"><strong>Approximate foreground playtime:</strong> ${Math.ceil(recorded.entry.activeSeconds/60)} minute(s) · Includes idle time in an open tab; excludes time hidden or closed. Not a measured human playtest.</div>`:''}`:''}
      <div class="stats"><b>Days on the trail:</b> ${days}<br><b>Act reached:</b> ${G.act} of ${modeDaily?1:3}<br><b>Obstacles beaten:</b> ${G.stats.fights}<br><b>Elites beaten:</b> ${G.stats.elites}<br><b>Party HP:</b> ${G.hp} / ${G.maxHp}<br><b>Gold:</b> ${G.gold}<br><b>Wagon load:</b> ${G.deck.length} / ${G.cap}<br><b>Crew:</b> ${G.crew.length}<br><b>Cards purged:</b> ${G.stats.purged}<br><b>Keepsakes:</b> ${G.relics.length}${G.seedCode?`<br><b>Trail seed:</b> ${G.seedCode}`:''}${G.flags.finalRoute?`<br><b>Final route:</b> ${G.flags.finalRoute==='barlow'?'Barlow Road around Mount Hood':'Columbia River passage'}`:''}${G.flags.barlowReport?`<br><b>Laurel Hill:</b> ${G.flags.barlowReport.title} (${G.flags.barlowReport.damage} HP damage)` : ''}${G.flags.ecologyReports?.length?`<br><b>Wildlife/weather escapes:</b> ${G.flags.ecologyReports.length} (damage ${G.flags.ecologyReports.reduce((n,r)=>n+r.damage,0)} HP)` : ''}${G.flags.riverReports?.length?`<br><b>River crossings:</b> ${G.flags.riverReports.length} (damage ${G.flags.riverReports.reduce((n,r)=>n+r.damage,0)} HP)` : ''}${G.flags.eliteReports?.length?`<br><b>Tactical elite crossings:</b> ${G.flags.eliteReports.length} (damage ${G.flags.eliteReports.reduce((n,r)=>n+r.damage,0)} HP)` :''}${G.flags.avalancheReport?`<br><b>South Pass:</b> ${G.flags.avalancheReport.title} (${G.flags.avalancheReport.damage} HP lost, ${G.flags.avalancheReport.days} recovery days)` :''}</div>
      <div class="meds">${meds.map(m=>`<div class="med ${m.ok?'':'off'}" data-tip="<b>${m.n}</b><br>${m.d}"><img src="${A(m.img)}">${m.n}</div>`).join('')}</div>
      <div class="quote">${won?(modeDaily?pick(TR.winBoss):pick(TR.win)):pick(TR.death)}<br>— Eli Haskins, trail pilot</div>
      <div style="font-size:14px;margin-top:8px">${recorded.ok?'Filed in your local Expedition Journal.':'Journal could not be saved. Your checkpoint was preserved for retry.'}</div><div style="margin-top:1.5vh;display:flex;gap:1vw;flex-wrap:wrap"><button class="btn" data-again>Ride Again</button><button class="btn dark" data-journal>Journal</button><button class="btn dark" data-title>Title</button></div>
    </div></div></div>`;
  s.onclick=e=>{ if(e.target.closest('[data-again]')){ Narr.clear(); selectScreen(); } if(e.target.closest('[data-title]')){ Narr.clear(); titleScreen(); }if(e.target.closest('[data-journal]')){showJournal();} };
}

/* keyboard: E ends turn, 1-9 play cards */
document.addEventListener('keydown',e=>{
  if(!C||C.phase!=='player'||$('.overlay')||e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.target.closest('input,textarea,select,button,[contenteditable="true"]'))return;
  if(e.key==='e'||e.key==='E'){e.preventDefault();C.endTurn();return;}
  if(/^[1-9]$/.test(e.key)){const ci=C.hand[Number(e.key)-1];if(ci){e.preventDefault();C.play(ci);}}
});

titleScreen();

</script>
