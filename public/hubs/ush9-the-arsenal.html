<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Arsenal · Weapons of the Great War</title>
<style>
:root{--amber:#f2c06a;--amber2:#d59a2b;--ink:#e8dcc4;--dim:#9c8f78;--bg:#070708;--panel:#0e0d0c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style','Times New Roman',serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
#top{position:fixed;left:18px;top:14px;z-index:5;pointer-events:none}
#top .brand{font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.28em;color:var(--amber2)}
#top .where{font-size:26px;color:var(--amber);margin-top:6px;text-shadow:0 2px 12px #000}
#panel{position:fixed;right:0;top:0;bottom:0;width:430px;max-width:100%;background:linear-gradient(180deg,rgba(14,13,12,.97),rgba(10,9,8,.97));border-left:1px solid #3a2d18;z-index:6;display:flex;flex-direction:column;transition:transform .35s}
body.collapsed #panel{transform:translateX(100%)}
#toggle{position:absolute;left:-38px;top:16px;width:38px;height:44px;background:#14110d;border:1px solid #3a2d18;border-right:0;color:var(--amber);font-size:18px;cursor:pointer;border-radius:6px 0 0 6px}
#pbody{overflow-y:auto;padding:26px 28px 120px;flex:1;scrollbar-color:#3a2d18 transparent}
.eyebrow{font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--amber2);text-transform:uppercase}
h1,h2.ttl{font-size:40px;line-height:1.05;color:var(--amber);margin:8px 0 10px;font-weight:600}
.kicker{font-style:italic;font-size:19px;color:#d8c9a8;line-height:1.4;margin:0 0 16px}
p{font-size:17px;line-height:1.6;margin:0 0 14px}
.small{font-size:14px;color:var(--dim);line-height:1.45}
.stats{display:grid;grid-template-columns:1fr 1.15fr;gap:0;margin:14px 0 18px;border-top:1px solid #2c2418}
.stats dt,.stats dd{margin:0;padding:8px 0;border-bottom:1px solid #2c2418;font-size:14.5px}
.stats dt{color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding-right:10px}
.stats dd{color:var(--amber)}
.stats.tight dd{color:var(--ink)}
blockquote{margin:18px 0;padding:14px 18px;border-left:3px solid var(--amber2);background:#15110b;font-size:18px;line-height:1.5;font-style:italic;color:#f0e2c2}
blockquote cite{display:block;margin-top:10px;font-style:normal;font-size:12.5px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace}
.read{background:none;border:1px solid #3a2d18;color:var(--dim);font:12px ui-monospace,Menlo,Consolas,monospace;padding:6px 10px;border-radius:4px;cursor:pointer;margin-bottom:6px}
.read:hover{color:var(--amber);border-color:var(--amber2)}
.lab{border:1px solid #4a3818;background:#120f0a;border-radius:8px;padding:16px;margin:20px 0}
.labhead{font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.labbtn,.big{background:var(--amber2);color:#120d05;border:0;font:700 14px ui-monospace,Menlo,Consolas,monospace;padding:11px 16px;border-radius:5px;cursor:pointer;margin-top:10px;width:100%;letter-spacing:.04em}
.labbtn:disabled{opacity:.85;cursor:default;background:#5a4420;color:var(--amber)}
.big{font-size:16px;padding:14px;margin-top:18px}
.race>div{margin:10px 0}.rl{font-size:13px;color:var(--dim)}.bar{height:16px;background:#221b12;border-radius:3px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d59a2b,#ffd27a)}
.rn{font:700 22px ui-monospace,Menlo,Consolas,monospace;color:var(--amber)}
.result{font-size:15px;line-height:1.5;margin-top:10px;color:#f0e2c2}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:10px 0}.dots i{aspect-ratio:1;border-radius:50%;display:block}
.dots i.a,.k.a{background:#e8a43a}.dots i.b,.k.b{background:#4a4236}
.legend{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}.k{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:6px}
.k.s{background:#c9b994}.k.d{background:#5a4e40}.k.u{background:#ff4b3a}
.tabs{display:flex;gap:6px;margin:8px 0 10px}.tabs button{flex:1;background:#1c160e;border:1px solid #3a2d18;color:var(--dim);padding:8px;font:600 13px ui-monospace,Menlo,Consolas,monospace;border-radius:4px;cursor:pointer}.tabs button.on{color:#120d05;background:var(--amber);border-color:var(--amber)}
.wiresvg{width:100%;border-radius:4px;display:block}
.rrow{display:grid;grid-template-columns:130px 1fr 64px;gap:8px;align-items:center;margin:7px 0;font-size:13px}.rrow b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--amber);font-size:12px;text-align:right}
.rbar{height:14px;background:#221b12;border-radius:2px;overflow:hidden}.rbar i{display:block;height:100%;width:0;background:#b07a2a;transition:width .6s}.rbar i.hot{background:#ffcc66}
#sizes .rbar i{transition:none}
.tanks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}.tk{color:#c9a45a;transition:opacity .4s,color .4s}.tk.down{color:#3a3228;opacity:.5}.tk svg{width:100%;display:block}
#lus{width:100%;border-radius:4px;display:block;margin:8px 0}
.video{position:relative;margin:20px 0;border-radius:8px;overflow:hidden;cursor:pointer;background:#000;aspect-ratio:16/9}.video img{width:100%;height:100%;object-fit:cover;opacity:.75;display:block}.video button{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:70px;height:50px;border-radius:10px;border:0;background:rgba(213,154,43,.92);color:#120d05;font-size:24px;cursor:pointer}.vcap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,#000);font-size:13px;color:var(--ink)}.video iframe{width:100%;height:100%;border:0;display:block}
.qbox{border:1px solid var(--amber2);border-radius:8px;padding:16px 18px;margin:22px 0 0;background:linear-gradient(180deg,#1b140a,#120e08)}
.qlabel{font:700 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.qbox p{margin:0}.qbox ol{margin:0;padding-left:20px}.qbox li{margin:0 0 10px;font-size:16px;line-height:1.5}
.howto{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);margin-top:14px;line-height:2}.howto span{color:#120d05;background:var(--amber2);padding:2px 6px;border-radius:3px;margin:0 4px 0 0}
#navbar{position:fixed;left:0;right:430px;bottom:16px;display:flex;justify-content:center;gap:10px;align-items:center;z-index:5;transition:right .35s}
body.collapsed #navbar{right:0}
#navbar>button{background:rgba(14,12,9,.9);border:1px solid #4a3818;color:var(--amber);width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer}
#navbar>button:disabled{opacity:.3;cursor:default}
#dots{display:flex;gap:4px;background:rgba(14,12,9,.85);padding:6px;border-radius:30px;border:1px solid #3a2d18}
#dots button{min-width:34px;height:34px;border-radius:17px;border:0;background:transparent;color:var(--dim);font:600 12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
#dots button.on{background:var(--amber2);color:#120d05}
#top .prog{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);margin-top:6px;letter-spacing:.06em}
#dots button.seen{color:var(--amber);box-shadow:inset 0 -2px 0 var(--amber2)}
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#2a1d0b,#070708 70%);transition:opacity .9s;text-align:center;padding:24px}
#intro.gone{opacity:0;pointer-events:none}
#intro .iy{font:600 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4em;color:var(--amber2);animation:rise 1s .2s both}
#intro .it{font-weight:400;font-size:clamp(56px,10vw,128px);color:var(--amber);letter-spacing:.06em;margin:14px 0 10px;text-shadow:0 0 40px rgba(242,192,106,.25);animation:rise 1.2s .4s both}
#intro .is{max-width:560px;margin:0 auto;font-size:20px;line-height:1.5;color:#d8c9a8;font-style:italic;animation:rise 1.2s .8s both}
#intro button{margin-top:34px;background:transparent;border:1px solid var(--amber2);color:var(--amber);font:700 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;text-transform:uppercase;padding:16px 34px;cursor:pointer;animation:rise 1s 1.3s both;transition:background .3s,color .3s}
#intro button:hover{background:var(--amber2);color:#120d05}
#intro .ih{margin-top:22px;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);animation:rise 1s 1.6s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--amber);font:14px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;z-index:50}
@media (max-width:820px){#panel{top:auto;height:52%;width:100%;border-left:0;border-top:1px solid #3a2d18}#toggle{left:auto;right:12px;top:-40px;border-radius:6px 6px 0 0;border:1px solid #3a2d18;border-bottom:0}#navbar{right:0;bottom:calc(52% + 8px)}body.collapsed #navbar{bottom:16px}#dots{display:none}h2.ttl{font-size:30px}}
</style>

hed to war in 1914 believing the soldier with a rifle would decide it.",stats:[["Aimed shots a minute","15, for a well trained British soldier"],["Effective range","about 600 yards"],["British rifle","Short Magazine Lee-Enfield"],["American rifle","M1903 Springfield"]],story:["Before the war, the British Army drilled its men for the Mad Minute. A soldier had sixty seconds to put 15 aimed shots into a target 300 yards away, working the bolt and reloading as he went. Stories from the Battle of Mons in August 1914 claimed German officers believed they were facing machine guns when it was really trained riflemen.","Rifles never went away. Every soldier in this hall still carried one. What changed was everything around the rifleman. The weapons in the rest of this gallery could kill him from much farther away, and in much larger numbers, than any man with a bolt action could answer."],lab:"none",question:"A good rifleman could fire 15 aimed shots a minute. Keep that number in your head as you walk the hall. Which later exhibit do you think made that number look small, and why?"},{id:"mg",no:"II",title:"The Machine Gun",year:"1884 / 1914",kicker:"An American inventor living in London built the gun that stopped attacks dead on the Western Front.",stats:[["Rounds a minute","about 450 to 600"],["Crew","usually six men"],["German MG 08 with sled mount","about 140 pounds"],["Cooling","a jacket of water around the barrel"]],story:["Hiram Maxim, an American living in Britain, built the first fully automatic machine gun in 1884. The kick of each shot loaded the next round. As long as the canvas belt kept feeding, the gun kept firing. The British Vickers and the German MG 08 that faced each other in 1914 were both built on his design.","Firing that fast heated the barrel until the water in the jacket boiled. Vickers crews piped the steam into a can so they could pour the water back in. Two or three guns placed to sweep open ground could stop an attack made by hundreds of men, and that is exactly how the armies used them."],lab:"minute",video:{id:"GAYY-wPOkp4",title:"Historian Dan Snow test fires a Vickers gun (History Hit)"},question:"Run the One Minute of Fire lab. Using the numbers it gives you, explain what happens to a line of soldiers walking across open ground toward a single machine gun."},{id:"guns",no:"III",title:"The Big Guns",year:"1914 to 1918",kicker:"Soldiers feared the shells more than anything else on the battlefield.",stats:[["Wounds caused by shells","most estimates near 6 in 10"],["Shells fired before the Somme","about 1.5 million in 7 days"],["French 75 field gun","up to 15 rounds a minute"],["German Paris Gun, 1918","hit Paris from about 75 miles away"]],story:["Artillery fired from miles behind the front. The gunners almost never saw the men they killed, and the men they killed almost never saw the guns. A bursting shell threw jagged steel in every direction, and a near miss could bury a man alive in his own trench.","Before the Battle of the Somme in 1916, British guns fired about 1.5 million shells over seven days. Commanders expected the barrage to wreck the German trenches and shred the barbed wire. German soldiers rode out the storm in dugouts as deep as 30 feet. When the guns stopped on the morning of July 1, they climbed back up to their machine guns."],voice:{text:`What passing-bells for these who die as cattle?
Only the monstrous anger of the guns.`,who:'Wilfred Owen, British officer and poet, from "Anthem for Doomed Youth," 1917'},lab:"wounds",question:"Look at the 100 soldier grid. If shells caused most wounds, why would generals keep ordering infantry attacks instead of only firing artillery?"},{id:"gas",no:"IV",title:"Poison Gas",year:"1915",kicker:"Scientists in German labs turned a factory chemical into a weapon that drifted on the wind.",stats:[["First large attack","April 22, 1915, near Ypres, Belgium"],["Chlorine released that day","about 168 tons from 5,730 cylinders"],["Gas casualties, all armies","about 1.3 million"],["Gas deaths","roughly 90,000"]],story:["Late on the afternoon of April 22, 1915, German engineers opened thousands of steel cylinders along four miles of trench near Ypres. The wind carried a yellow green cloud across to French and Algerian colonial troops. Chlorine attacked their lungs as they breathed it in, and a hole about four miles wide opened in the Allied line.","Within months both sides were using gas. Every time masks improved, chemists developed a more dangerous gas. Mustard gas, used from July 1917, blistered skin and blinded eyes, and it soaked into the mud where it could hurt men days after the shells landed."],voice:{text:`Gas! GAS! Quick, boys!\u2014An ecstasy of fumbling,
Fitting the clumsy helmets just in time`,who:'Wilfred Owen, from "Dulce et Decorum Est," written 1917'},lab:"gases",question:"Gas killed far fewer men than artillery, yet soldiers dreaded it. Use the gas lab to explain why gas caused so much fear."},{id:"wire",no:"V",title:"Barbed Wire",year:"1874 / 1915",kicker:"A fence invented for cattle ranchers on the American plains.",stats:[["Patented","1874, by Joseph Glidden of DeKalb, Illinois"],["Original use","fencing cattle on the open range"],["German wire at the Somme","belts as much as 30 yards deep"],["Silent tool","screw pickets twisted into the ground at night"]],story:["Barbed wire spread across the American West because it was cheap and it kept cattle where ranchers wanted them. Forty years later the same idea stretched across France and Belgium in thick tangled belts. Wiring parties crawled into no man\u2019s land after dark to fix it, twisting corkscrew posts into the ground so no hammer would give them away.","Wire did not kill many men by itself. Its job was to hold attackers in place, and it always sat right where the machine guns were aimed. A soldier caught on the barbs could not move forward and could not get back."],lab:"wirecut",question:"Barbed wire was an American farm invention. Explain how a tool built for ranching turned deadly when it was paired with a machine gun."},{id:"flame",no:"VI",title:"The Flamethrower",year:"1915",kicker:"The most terrifying weapon in the hall had the shortest reach.",stats:[["German name","Flammenwerfer"],["First used against the British","July 30, 1915, at Hooge, Belgium"],["Range","about 20 to 40 yards"],["Crew","two men for the backpack version"]],story:["German assault engineers carried tanks of oil and pressurized gas on their backs. One man carried the tank and a second man aimed the nozzle, spraying a stream of burning oil into an enemy trench. At Hooge, near Ypres, British soldiers woke before dawn on July 30, 1915, to jets of fire pouring over their parapet.","The weapon could clear a trench in seconds, but its crews had to get within a few dozen yards to use it. Soldiers on both sides aimed for flamethrower teams first. Compare its reach with the other weapons in the lab and you can see why."],lab:"reach",question:"Use the Reach lab. How far could a flamethrower reach compared to a field gun? What does that tell you about how dangerous it was to carry one?"},{id:"tank",no:"VII",title:"The Tank",year:"1916",kicker:"Britain built it in secret to get across no man\u2019s land. The first ones broke down constantly.",stats:[["First battle","September 15, 1916, Flers-Courcelette, France"],["Weight","about 28 tons"],["Crew","8 men"],["Top speed","under 4 miles per hour, about a fast walk"]],story:["British designers hid their project behind a cover story. Factory workers were told they were building water carriers, and the code word tank stuck. The machine was meant to flatten barbed wire and cross trenches while machine gun bullets bounced off its armor, so infantry could follow behind it.","Inside, eight men shared the space with a roaring engine. Engine heat and exhaust fumes made crews sick, and bullets hitting the outside knocked hot flakes of steel off the inside walls. Early tanks broke down constantly. A year later at Cambrai, in November 1917, more than 400 British tanks attacked together and punched a hole several miles deep into the German line."],lab:"tanks49",video:{id:"a8Jq5lagUOw",title:"Tank Chats: the Mark I, from The Tank Museum"},question:"Run the Flers lab. If only 32 of 49 tanks even reached the start line, why did the British Army keep building them?"},{id:"plane",no:"VIII",title:"The Airplane",year:"1914 to 1918",kicker:"Eleven years after the Wright brothers, airplanes went to war.",stats:[["First job","scouting enemy movements"],["1915 breakthrough","a gear that fired bullets between propeller blades"],["The Red Baron","80 victories, killed April 21, 1918"],["Top American ace","Eddie Rickenbacker, 26 victories"]],story:["In 1914 airplanes were for watching. Pilots flew over enemy lines, marked troop movements on maps and dropped weighted message streamers to commanders below. During the Battle of the Marne, French scouts spotted a gap opening between two German armies, and the Allies attacked into it.","In 1915 the Dutch designer Anthony Fokker gave German planes an interrupter gear that timed each shot to pass between the spinning propeller blades. A pilot could now aim his whole airplane at an enemy and fire. Most Allied pilots flew without parachutes for the entire war."],lab:"none",question:"Airplanes started the war as scouts. How could knowing where the enemy was be just as valuable as shooting at him?"},{id:"zep",no:"IX",title:"The Zeppelin",year:"1915",kicker:"Bombs fell on British homes hundreds of miles from the trenches.",stats:[["First raid on Britain","January 19, 1915"],["Lifting gas","hydrogen, which burns"],["Length of later airships","about 650 feet, almost two football fields"],["People killed by Zeppelin raids in Britain","557"]],story:["German airships crossed the North Sea at night and dropped bombs on British towns and on London. Most raids did little military damage, but they shocked a country that had never been attacked from the sky. British towns began dimming their lights at night so the airship crews could not find them.","Searchlights and fighter pilots hunted the airships. Pilots learned that special bullets could set the hydrogen on fire. On the night of September 3, 1916, Lieutenant William Leefe Robinson shot down a German airship over Cuffley, north of London, and crowds across the city watched it fall in flames."],lab:"size",question:"Zeppelin raids killed relatively few people. Why might they still have mattered to how the British public felt about the war?"},{id:"uboat",no:"X",title:"The U-Boat",year:"1915 / 1917",kicker:"The weapon that pulled the United States into the war.",stats:[["Lusitania sunk","May 7, 1915, off the coast of Ireland"],["Died","1,198 people, 128 of them American"],["Unrestricted submarine warfare resumed","February 1, 1917"],["United States declares war","April 6, 1917"]],story:["The British Navy blockaded Germany to cut off its food and supplies. Germany answered with submarines, called U-boats, that sank ships headed for Britain. On May 7, 1915, a single torpedo from U-20 hit the British liner Lusitania. She sank in about 18 minutes.","American anger forced Germany to promise it would stop attacking passenger ships without warning. In February 1917 Germany broke that promise and resumed unrestricted submarine warfare, gambling it could starve Britain before America arrived. Combined with the Zimmermann Telegram, it brought the United States into the war that April."],lab:"lusitania",question:"Look at the Lusitania grid. The United States did not declare war until almost two years later. What finally changed in 1917?"}],es={title:"The Cost",lines:[["Soldiers killed, all nations","about 9 million"],["American military deaths","116,516"],["Of those, killed in battle","53,402"],["Of those, died of other causes, mostly disease","about 63,000"]],poem:`In Flanders fields the poppies blow
