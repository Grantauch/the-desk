<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">The Desk It Stopped At</title><desc id="d">Dark archival desk with a declassified memorandum.</desc><rect width="1600" height="900" fill="#111310"/><rect x="860" y="115" width="520" height="680" rx="8" fill="#d8d0bd" transform="rotate(3 1120 455)"/><g fill="#282922" font-family="monospace"><text x="930" y="270" font-size="34">13 MARCH 1962</text><text x="930" y="350" font-size="27">CHAIRMAN, JOINT CHIEFS</text><text x="930" y="395" font-size="27">TO: SECRETARY OF DEFENSE</text><text x="930" y="485" font-size="25">JUSTIFICATION FOR U.S.</text><text x="930" y="525" font-size="25">MILITARY INTERVENTION</text><text x="930" y="565" font-size="25">IN CUBA</text></g><g transform="rotate(-7 1260 220)"><rect x="1110" y="170" width="310" height="90" fill="none" stroke="#8b3d2e" stroke-width="8"/><text x="1135" y="230" fill="#8b3d2e" font-family="Arial Black,Arial" font-size="43" font-weight="900">DECLASSIFIED</text></g><text x="95" y="170" fill="#f0eadc" font-family="Arial Black,Arial" font-size="102" font-weight="900">THE DESK</text><text x="95" y="280" fill="#f0eadc" font-family="Arial Black,Arial" font-size="102" font-weight="900">IT STOPPED AT</text><text x="100" y="360" fill="#d87836" font-family="monospace" font-size="34">PROPOSAL ≠ APPROVAL ≠ EXECUTION</text><text x="100" y="790" fill="#c4cbb7" opacity=".8" font-family="monospace" font-size="28">Keep the status attached to the document.</text></svg>