<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Europe's political decision network in 1914</title>
<desc id="desc">A deliberately schematic network map. Approximate positions for London, Paris, Belgium, Berlin, Vienna, Sarajevo, Belgrade, Rome and St Petersburg; the connecting lines show diplomatic pressure, not historic borders or formal obligations.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22343b"/><stop offset="1" stop-color="#0f1b22"/></linearGradient>
 <pattern id="grid" width="74" height="74" patternUnits="userSpaceOnUse"><path d="M74 0H0V74" fill="none" stroke="#b9c0ae" stroke-opacity=".085" stroke-width="1"/></pattern>
 <radialGradient id="halo"><stop stop-color="#c3a775" stop-opacity=".22"/><stop offset="1" stop-color="#c3a775" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="650" fill="url(#paper)"/><rect width="1200" height="650" fill="url(#grid)"/>
<rect x="30" y="30" width="1140" height="590" fill="none" stroke="#9aa8a4" stroke-opacity=".27" stroke-width="1"/>
<g fill="none" stroke="#c4bb9f" stroke-opacity=".13" stroke-width="2">
 <path d="M90 200Q200 150 280 190T420 220T560 190T700 260T860 230T1040 150"/>
 <path d="M80 450Q190 370 300 415T470 470T610 410T770 485T1000 455"/>
 <path d="M130 320Q260 290 350 350T530 300T700 335T900 300T1090 380"/>
</g>
<text x="67" y="76" fill="#c6aa7f" font-family="Georgia,serif" font-size="34" letter-spacing="3">DECISION GEOGRAPHY</text>
<text x="69" y="110" fill="#cdd2c9" font-family="system-ui,sans-serif" font-size="16" letter-spacing="3">EUROPE · SUMMER 1914</text>
<path d="M190 200 L315 335 L560 220 L735 375 L840 510 L900 525" fill="none" stroke="#c7ac7d" stroke-opacity=".55" stroke-width="2" stroke-dasharray="8 10"/>
<path d="M560 220L995 135M315 335L735 375M560 220L840 510" fill="none" stroke="#a7c0c0" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 13"/>
<g fill="#c44935" opacity=".25">
 <circle cx="840" cy="510" r="74" fill="url(#halo)"/><circle cx="735" cy="375" r="65" fill="url(#halo)"/>
</g>
<g font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#f2ead7">
 <circle cx="190" cy="200" r="7" fill="#d7c6a5"/><text x="207" y="194">LONDON</text>
 <circle cx="315" cy="335" r="7" fill="#d7c6a5"/><text x="335" y="355">PARIS</text>
 <circle cx="385" cy="256" r="5" fill="#d7c6a5"/><text x="402" y="264" font-size="14">BELGIUM</text>
 <circle cx="560" cy="220" r="9" fill="#c44935"/><text x="580" y="218">BERLIN</text>
 <circle cx="735" cy="375" r="9" fill="#c44935"/><text x="753" y="369">VIENNA</text>
 <circle cx="840" cy="510" r="10" fill="#c44935"/><text x="860" y="504">SARAJEVO</text>
 <circle cx="900" cy="525" r="6" fill="#d7c6a5"/><text x="912" y="548" font-size="15">BELGRADE</text>
 <circle cx="650" cy="546" r="7" fill="#d7c6a5"/><text x="660" y="571" font-size="15">ROME</text>
 <circle cx="995" cy="135" r="7" fill="#d7c6a5"/><text x="1014" y="135" font-size="15">ST PETERSBURG</text>
</g>
<path d="M78 577H282" stroke="#c7ac7d" stroke-width="2"/>
<text x="78" y="596" fill="#c8c7be" font-family="system-ui,sans-serif" font-size="12" letter-spacing="1.4">SCHEMATIC, NOT HISTORICAL BORDERS</text>
<text x="1100" y="590" fill="#b4b6ad" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">A diagram of decisions, not an alliance map</text>
</svg>