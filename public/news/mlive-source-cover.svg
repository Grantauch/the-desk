<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">MLive source cover</title>
  <desc id="desc">A labeled source cover used when the publisher feed does not provide a working article photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081a18"/>
      <stop offset="1" stop-color="#11846e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="m945 80-70 125 52 55-80 67 45 61-93 101 40 106" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="18"/>
  <circle cx="910" cy="330" r="250" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="90"/>
  <text x="72" y="105" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">SOURCE COVER / MICHIGAN EDITION</text>
  <text x="72" y="420" fill="#fff" font-family="Arial, sans-serif" font-size="150" font-weight="800">MLIVE</text>
  <text x="78" y="491" fill="#fff" fill-opacity=".78" font-family="Arial, sans-serif" font-size="28" letter-spacing="2">PUBLISHER PHOTO UNAVAILABLE</text>
</svg>
