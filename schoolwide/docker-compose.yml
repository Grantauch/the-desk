services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grantdesk_schoolwide
      POSTGRES_USER: grantdesk
      POSTGRES_PASSWORD: grantdesk
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantdesk -d grantdesk_schoolwide"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - schoolwide_postgres:/var/lib/postgresql/data

volumes:
  schoolwide_postgres:
