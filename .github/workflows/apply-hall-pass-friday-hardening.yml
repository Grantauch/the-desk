name: Apply Hall Pass Friday hardening

on:
  push:
    branches:
      - hall-pass/friday-field-hardening

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hall-pass/friday-field-hardening

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Friday field-use hardening
        run: |
          node scripts/apply-hall-pass-friday-hardening.mjs
          node scripts/fix-hall-pass-friday-hardening.mjs

      - name: Verify Hall Pass
        run: npm run hall-pass:verify

      - name: Commit verified implementation
        run: |
          rm scripts/apply-hall-pass-friday-hardening.mjs
          rm scripts/fix-hall-pass-friday-hardening.mjs
          rm .github/workflows/apply-hall-pass-friday-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/hall-pass/Code.gs apps-script/hall-pass/Index.html scripts/test-hall-pass-runtime.cjs scripts/test-hall-pass-app.cjs scripts/apply-hall-pass-friday-hardening.mjs scripts/fix-hall-pass-friday-hardening.mjs .github/workflows/apply-hall-pass-friday-hardening.yml
          git commit -m "Harden Hall Pass after Friday field use"
          git push origin HEAD:hall-pass/friday-field-hardening
