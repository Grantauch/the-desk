name: site check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use the site Node version
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Classify release lane
        id: lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            node scripts/release-lane.mjs --base "$PR_BASE" --head "$PR_HEAD" --github-output
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/release-lane.mjs --base "$PUSH_BASE" --head "$PUSH_HEAD" --github-output
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "routes=" >> "$GITHUB_OUTPUT"
            echo "reason=No trustworthy comparison base; full verification selected." >> "$GITHUB_OUTPUT"
          fi

      - name: Show release lane
        run: |
          echo "Lane: ${{ steps.lane.outputs.mode }}"
          echo "Reason: ${{ steps.lane.outputs.reason }}"
          echo "Routes: ${{ steps.lane.outputs.routes }}"

      - name: Verify StoryHub-only release
        if: steps.lane.outputs.mode == 'storyhub'
        run: npm run verify:storyhub-fast

      - name: Verify full release
        if: steps.lane.outputs.mode != 'storyhub'
        run: npm run verify

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Check changed StoryHub pages in a real browser
        if: steps.lane.outputs.mode == 'storyhub'
        env:
          STORYHUB_TEST_ROUTES: ${{ steps.lane.outputs.routes }}
        run: npm run storyhub:browser:test

      - name: Check key site pages in a real browser
        if: steps.lane.outputs.mode != 'storyhub'
        run: npm run browser:test

      - name: Save browser screenshots and accessibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance
          path: browser-results/
          retention-days: 7
          if-no-files-found: ignore
