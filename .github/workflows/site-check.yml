name: site check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Use the site Node version
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Verify the release once, including the production build
        run: npm run verify

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Check key pages in a real browser
        run: npm run browser:test

      - name: Save browser screenshots and accessibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance
          path: browser-results/
          retention-days: 7
          if-no-files-found: ignore
