name: site check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Use the site Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate GrantDesk handoff and Hall Pass behavior
        run: npm run hall-pass:verify

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build the production site
        run: npm run build
