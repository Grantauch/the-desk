name: Homepage everyday tools patch

on:
  push:
    branches:
      - design/homepage-everyday-tools

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/homepage-everyday-tools
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --include=dev

      - name: Patch homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/index.astro')
          s = p.read_text(encoding='utf-8')

          new_links = """const quickLinks = [
            { href: '/check-in/', label: 'daily check-in', note: 'attendance + your daily point', tone: 'checkin', everyday: true },
            { href: '/pass/', label: siteContent.home.passLabel, note: siteContent.home.passNote, tone: 'pass', everyday: true },
            { href: siteContent.links.googleClassroom, label: siteContent.home.classroomLabel, note: siteContent.home.classroomNote, external: true, tone: 'classroom', everyday: true },
            { href: '/first-day-materials/', label: 'first day materials', note: 'syllabi, routines, notes, and the first month', tone: 'utility' },
            { href: '/announcements/', label: siteContent.home.announcementsLabel, note: siteContent.home.announcementsNote, tone: 'utility' },
            { href: '/calendar/', label: siteContent.home.calendarLabel, note: siteContent.home.calendarNote, tone: 'utility' },
          ];"""
          s, n = re.subn(r"const quickLinks = \[.*?\n\];", new_links, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'quickLinks replacement count={n}')

          old_anchor = "        <a href={link.href} target={link.external ? '_blank' : undefined} rel={link.external ? 'noopener' : undefined}>"
          new_anchor = "        <a href={link.href} class={`quick-dock__link quick-dock__link--${link.tone}${link.everyday ? ' quick-dock__link--everyday' : ''}`} target={link.external ? '_blank' : undefined} rel={link.external ? 'noopener' : undefined}>"
          if s.count(old_anchor) != 1:
              raise SystemExit('quick dock anchor did not match exactly once')
          s = s.replace(old_anchor, new_anchor, 1)

          old_body = "          <span><strong>{link.label}</strong><small>{link.note}</small></span>"
          new_body = "          <span>{link.everyday && <span class=\"quick-dock__cue\">every day</span>}<strong>{link.label}</strong><small>{link.note}</small></span>"
          if s.count(old_body) != 1:
              raise SystemExit('quick dock body did not match exactly once')
          s = s.replace(old_body, new_body, 1)

          css_start = s.index('  .quick-dock {')
          css_end = s.index('\n\n  .home-section', css_start)
          new_css = """  .quick-dock {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            border-top: 1px solid rgb(255 255 255 / 0.14);
            background: rgb(5 6 11 / 0.32);
          }

          .quick-dock a {
            --dock-accent: #949dff;
            --dock-glow: rgb(148 157 255 / 0.1);
            position: relative;
            display: grid;
            grid-column: span 2;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 0.8rem;
            align-items: center;
            min-height: 4.45rem;
            padding: 0.82rem 1rem;
            border-right: 1px solid rgb(255 255 255 / 0.12);
            border-bottom: 1px solid rgb(255 255 255 / 0.12);
            background: rgb(255 255 255 / 0.018);
            transition: background 160ms ease, color 160ms ease, transform 160ms ease;
          }

          .quick-dock a:nth-child(3n) { border-right: 0; }
          .quick-dock a:nth-last-child(-n + 3) { border-bottom: 0; }
          .quick-dock a:hover {
            z-index: 1;
            background: color-mix(in srgb, var(--dock-accent) 76%, #101117);
            transform: translateY(-1px);
          }

          .quick-dock__link--everyday {
            min-height: 6.2rem;
            background:
              radial-gradient(circle at 12% 0%, var(--dock-glow), transparent 58%),
              rgb(255 255 255 / 0.035);
          }

          .quick-dock__link--everyday::before {
            position: absolute;
            inset: 0 0 auto;
            height: 0.22rem;
            background: var(--dock-accent);
            content: '';
          }

          .quick-dock__link--checkin { --dock-accent: #24c58a; --dock-glow: rgb(36 197 138 / 0.2); }
          .quick-dock__link--pass { --dock-accent: #6874ff; --dock-glow: rgb(104 116 255 / 0.22); }
          .quick-dock__link--classroom { --dock-accent: #8ca9ff; --dock-glow: rgb(140 169 255 / 0.18); }
          .quick-dock__link--utility { --dock-accent: #949dff; --dock-glow: rgb(148 157 255 / 0.08); }

          .quick-dock__number {
            align-self: start;
            color: var(--dock-accent);
            font-family: var(--font-mono);
            font-size: 0.58rem;
            font-weight: 800;
          }

          .quick-dock__cue {
            display: block;
            margin-bottom: 0.18rem;
            color: var(--dock-accent);
            font-family: var(--font-mono);
            font-size: 0.48rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
          }

          .quick-dock a:hover .quick-dock__number,
          .quick-dock a:hover .quick-dock__cue { color: white; }
          .quick-dock strong { display: block; font-family: var(--font-display); font-size: 0.84rem; line-height: 1.2; }
          .quick-dock__link--everyday strong { font-size: 1rem; }
          .quick-dock small { display: block; margin-top: 0.15rem; color: rgb(255 255 255 / 0.46); font-size: 0.64rem; line-height: 1.35; }
          .quick-dock__link--everyday small { color: rgb(255 255 255 / 0.58); }
          .quick-dock a:hover small { color: rgb(255 255 255 / 0.8); }
          .quick-dock b { color: var(--dock-accent); font-family: var(--font-mono); font-size: 0.95rem; }
          .quick-dock a:hover b { color: white; }"""
          s = s[:css_start] + new_css + s[css_end:]

          m900 = s.index('  @media (max-width: 900px) {')
          q900 = s.index('    .quick-dock {', m900)
          c900 = s.index('    .course-grid', q900)
          new_900 = """    .quick-dock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .quick-dock a { grid-column: auto; border-right: 1px solid rgb(255 255 255 / 0.12); border-bottom: 1px solid rgb(255 255 255 / 0.12); }
            .quick-dock a:nth-child(3n) { border-right: 1px solid rgb(255 255 255 / 0.12); }
            .quick-dock a:nth-child(2n) { border-right: 0; }
            .quick-dock a:nth-last-child(-n + 3) { border-bottom: 1px solid rgb(255 255 255 / 0.12); }
            .quick-dock a:nth-last-child(-n + 2) { border-bottom: 0; }
          """
          s = s[:q900] + new_900 + s[c900:]

          m480 = s.index('  @media (max-width: 480px) {')
          q480 = s.index('    .quick-dock {', m480)
          maker480 = s.index('    .maker-mark', q480)
          new_480 = """    .quick-dock { grid-template-columns: 1fr; }
            .quick-dock a,
            .quick-dock a:nth-child(2n),
            .quick-dock a:nth-child(3n) { grid-column: auto; border-right: 0; border-bottom: 1px solid rgb(255 255 255 / 0.12); }
            .quick-dock a:last-child { border-bottom: 0; }
          """
          s = s[:q480] + new_480 + s[maker480:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify release
        run: npm run verify

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/homepage-everyday-tools-patch.yml
          git add src/pages/index.astro
          git commit -m "Promote everyday classroom tools on the homepage"
          git push origin HEAD:design/homepage-everyday-tools
