name: Homepage everyday tools patch

on:
  push:
    branches:
      - design/homepage-everyday-tools

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out design branch
        uses: actions/checkout@v4
        with:
          ref: design/homepage-everyday-tools
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Apply everyday-tools homepage hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/index.astro')
          text = path.read_text(encoding='utf-8')

          old_links = """const quickLinks = [
            { href: '/check-in/', label: 'daily check-in', note: 'attendance + your daily point' },
            { href: '/first-day-materials/', label: 'first day materials', note: 'syllabi, routines, notes, and the first month' },
            { href: siteContent.links.googleClassroom, label: siteContent.home.classroomLabel, note: siteContent.home.classroomNote, external: true },
            { href: '/pass/', label: siteContent.home.passLabel, note: siteContent.home.passNote },
            { href: '/announcements/', label: siteContent.home.announcementsLabel, note: siteContent.home.announcementsNote },
            { href: '/calendar/', label: siteContent.home.calendarLabel, note: siteContent.home.calendarNote },
          ];"""
          new_links = """const quickLinks = [
            { href: '/check-in/', label: 'daily check-in', note: 'attendance + your daily point', tone: 'checkin', everyday: true },
            { href: '/pass/', label: siteContent.home.passLabel, note: siteContent.home.passNote, tone: 'pass', everyday: true },
            { href: siteContent.links.googleClassroom, label: siteContent.home.classroomLabel, note: siteContent.home.classroomNote, external: true, tone: 'classroom', everyday: true },
            { href: '/first-day-materials/', label: 'first day materials', note: 'syllabi, routines, notes, and the first month', tone: 'utility' },
            { href: '/announcements/', label: siteContent.home.announcementsLabel, note: siteContent.home.announcementsNote, tone: 'utility' },
            { href: '/calendar/', label: siteContent.home.calendarLabel, note: siteContent.home.calendarNote, tone: 'utility' },
          ];"""

          old_markup = """      {quickLinks.map((link, index) => (
                <a href={link.href} target={link.external ? '_blank' : undefined} rel={link.external ? 'noopener' : undefined}>
                  <span class=\"quick-dock__number\">0{index + 1}</span>
                  <span><strong>{link.label}</strong><small>{link.note}</small></span>
                  <b aria-hidden=\"true\">{link.external ? '↗' : '→'}</b>
                </a>
              ))}"""
          new_markup = """      {quickLinks.map((link, index) => (
                <a
                  href={link.href}
                  class={`quick-dock__link quick-dock__link--${link.tone}${link.everyday ? ' quick-dock__link--everyday' : ''}`}
                  target={link.external ? '_blank' : undefined}
                  rel={link.external ? 'noopener' : undefined}
                >
                  <span class=\"quick-dock__number\">0{index + 1}</span>
                  <span>
                    {link.everyday && <span class=\"quick-dock__cue\">every day</span>}
                    <strong>{link.label}</strong>
                    <small>{link.note}</small>
                  </span>
                  <b aria-hidden=\"true\">{link.external ? '↗' : '→'}</b>
                </a>
              ))}"""

          old_css = """  .quick-dock {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border-top: 1px solid rgb(255 255 255 / 0.14);
          }

          .quick-dock a {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 0.7rem;
            align-items: center;
            min-height: 5rem;
            padding: 0.9rem 1rem;
            border-right: 1px solid rgb(255 255 255 / 0.12);
            background: rgb(255 255 255 / 0.025);
            transition: background 160ms ease, color 160ms ease;
          }

          .quick-dock a:last-child { border-right: 0; }
          .quick-dock a:hover { background: var(--color-accent); }

          .quick-dock__number {
            align-self: start;
            color: #949dff;
            font-family: var(--font-mono);
            font-size: 0.58rem;
            font-weight: 800;
          }

          .quick-dock a:hover .quick-dock__number { color: white; }
          .quick-dock strong { display: block; font-family: var(--font-display); font-size: 0.87rem; line-height: 1.2; }
          .quick-dock small { display: block; margin-top: 0.15rem; color: rgb(255 255 255 / 0.45); font-size: 0.65rem; }
          .quick-dock a:hover small { color: rgb(255 255 255 / 0.76); }
          .quick-dock b { font-family: var(--font-mono); font-size: 0.9rem; }"""
          new_css = """  .quick-dock {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            border-top: 1px solid rgb(255 255 255 / 0.14);
            background: rgb(5 6 11 / 0.32);
          }

          .quick-dock a {
            --dock-accent: #949dff;
            --dock-glow: rgb(148 157 255 / 0.1);
            position: relative;
            display: grid;
            grid-column: span 2;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 0.8rem;
            align-items: center;
            min-height: 4.45rem;
            padding: 0.82rem 1rem;
            border-right: 1px solid rgb(255 255 255 / 0.12);
            border-bottom: 1px solid rgb(255 255 255 / 0.12);
            background: rgb(255 255 255 / 0.018);
            transition: background 160ms ease, color 160ms ease, transform 160ms ease;
          }

          .quick-dock a:nth-child(3n) { border-right: 0; }
          .quick-dock a:nth-last-child(-n + 3) { border-bottom: 0; }
          .quick-dock a:hover {
            z-index: 1;
            background: color-mix(in srgb, var(--dock-accent) 76%, #101117);
            transform: translateY(-1px);
          }

          .quick-dock__link--everyday {
            min-height: 6.2rem;
            background:
              radial-gradient(circle at 12% 0%, var(--dock-glow), transparent 58%),
              rgb(255 255 255 / 0.035);
          }

          .quick-dock__link--everyday::before {
            position: absolute;
            inset: 0 0 auto;
            height: 0.22rem;
            background: var(--dock-accent);
            content: '';
          }

          .quick-dock__link--checkin { --dock-accent: #24c58a; --dock-glow: rgb(36 197 138 / 0.2); }
          .quick-dock__link--pass { --dock-accent: #6874ff; --dock-glow: rgb(104 116 255 / 0.22); }
          .quick-dock__link--classroom { --dock-accent: #8ca9ff; --dock-glow: rgb(140 169 255 / 0.18); }
          .quick-dock__link--utility { --dock-accent: #949dff; --dock-glow: rgb(148 157 255 / 0.08); }

          .quick-dock__number {
            align-self: start;
            color: var(--dock-accent);
            font-family: var(--font-mono);
            font-size: 0.58rem;
            font-weight: 800;
          }

          .quick-dock__cue {
            display: block;
            margin-bottom: 0.18rem;
            color: var(--dock-accent);
            font-family: var(--font-mono);
            font-size: 0.48rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
          }

          .quick-dock a:hover .quick-dock__number,
          .quick-dock a:hover .quick-dock__cue { color: white; }
          .quick-dock strong { display: block; font-family: var(--font-display); font-size: 0.84rem; line-height: 1.2; }
          .quick-dock__link--everyday strong { font-size: 1rem; }
          .quick-dock small { display: block; margin-top: 0.15rem; color: rgb(255 255 255 / 0.46); font-size: 0.64rem; line-height: 1.35; }
          .quick-dock__link--everyday small { color: rgb(255 255 255 / 0.58); }
          .quick-dock a:hover small { color: rgb(255 255 255 / 0.8); }
          .quick-dock b { color: var(--dock-accent); font-family: var(--font-mono); font-size: 0.95rem; }
          .quick-dock a:hover b { color: white; }"""

          old_900 = """    .quick-dock { grid-template-columns: repeat(2, 1fr); }
              .quick-dock a:nth-child(2n) { border-right: 0; }
              .quick-dock a:not(:last-child) { border-bottom: 1px solid rgb(255 255 255 / 0.12); }
              .quick-dock a:last-child:nth-child(odd) { grid-column: 1 / -1; border-right: 0; }"""
          new_900 = """    .quick-dock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
              .quick-dock a { grid-column: auto; border-right: 1px solid rgb(255 255 255 / 0.12); border-bottom: 1px solid rgb(255 255 255 / 0.12); }
              .quick-dock a:nth-child(3n) { border-right: 1px solid rgb(255 255 255 / 0.12); }
              .quick-dock a:nth-child(2n) { border-right: 0; }
              .quick-dock a:nth-last-child(-n + 3) { border-bottom: 1px solid rgb(255 255 255 / 0.12); }
              .quick-dock a:nth-last-child(-n + 2) { border-bottom: 0; }"""

          old_480 = """    .quick-dock { grid-template-columns: 1fr; }
              .quick-dock a:last-child { grid-column: auto; }
              .quick-dock a { border-right: 0; border-bottom: 1px solid rgb(255 255 255 / 0.12); }
              .quick-dock a:last-child { border-bottom: 0; }"""
          new_480 = """    .quick-dock { grid-template-columns: 1fr; }
              .quick-dock a,
              .quick-dock a:nth-child(2n),
              .quick-dock a:nth-child(3n) { grid-column: auto; border-right: 0; border-bottom: 1px solid rgb(255 255 255 / 0.12); }
              .quick-dock a:last-child { border-bottom: 0; }"""

          replacements = [
              (old_links, new_links, 'quick links'),
              (old_markup, new_markup, 'quick dock markup'),
              (old_css, new_css, 'quick dock styles'),
              (old_900, new_900, 'tablet quick dock'),
              (old_480, new_480, 'mobile quick dock'),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run canonical verification
        run: npm run verify

      - name: Commit verified design patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/homepage-everyday-tools-patch.yml
          git add src/pages/index.astro
          git commit -m "Promote everyday classroom tools on the homepage"
          git push origin HEAD:design/homepage-everyday-tools
