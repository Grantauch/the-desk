name: WWI no-graphics classroom fallback

on:
  pull_request:
    paths:
      - 'public/hubs/wwi-gallery-reader.html'
      - 'public/hubs/ush9-the-arsenal.html'
      - 'public/hubs/ush9-over-the-top.html'
      - 'scripts/test-wwi-gallery-reader.mjs'
      - '.github/workflows/wwi-readable-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install chromium
      - name: Test mobile/desktop guide and simulated unsupported WebGL2
        run: node scripts/test-wwi-gallery-reader.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwi-readable-fallback-screenshots
          path: browser-results/wwi-readable-fallback/
          retention-days: 14
          if-no-files-found: ignore
