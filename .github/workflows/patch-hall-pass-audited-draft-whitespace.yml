name: Patch Hall Pass audited draft whitespace

on:
  push:
    branches:
      - fix/hall-pass-audited-draft-whitespace
    paths:
      - 'scripts/patch-hall-pass-audited-draft-whitespace.cjs'
      - '.github/workflows/patch-hall-pass-audited-draft-whitespace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/hall-pass-audited-draft-whitespace
          fetch-depth: 1

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact audited draft patch
        run: node scripts/patch-hall-pass-audited-draft-whitespace.cjs

      - name: Syntax and bridge self-test
        run: |
          node --check scripts/deploy-hall-pass-apps-script.mjs
          node scripts/deploy-hall-pass-apps-script.mjs --self-test

      - name: Run canonical release gate
        run: npm run verify

      - name: Commit bridge patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GrantDesk Release Bot'
          git config user.email 'grantdesk-release@users.noreply.github.com'
          git add scripts/deploy-hall-pass-apps-script.mjs
          git commit -m 'Recognize exact audited Hall Pass draft whitespace'
          git rm scripts/patch-hall-pass-audited-draft-whitespace.cjs .github/workflows/patch-hall-pass-audited-draft-whitespace.yml
          git commit -m 'Remove temporary Hall Pass draft patch machinery'
          git push origin HEAD:fix/hall-pass-audited-draft-whitespace
