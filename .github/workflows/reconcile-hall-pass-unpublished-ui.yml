name: Reconcile Hall Pass unpublished UI

on:
  push:
    branches:
      - reconcile/hall-pass-unpublished-ui
    paths:
      - 'scripts/reconcile-hall-pass-unpublished-ui.cjs'
      - '.github/workflows/reconcile-hall-pass-unpublished-ui.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/hall-pass-unpublished-ui
          fetch-depth: 1

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply audited unpublished UI refinements
        run: node scripts/reconcile-hall-pass-unpublished-ui.cjs

      - name: Verify reconciled release
        run: npm run verify

      - name: Verify required wording and selector
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'overdue passes' apps-script/hall-pass/Index.html
          grep -Fq "overdue \${late === 1 ? 'pass' : 'passes'}" apps-script/hall-pass/Index.html
          ! grep -Fq "pass needs' : 'passes need'} a check" apps-script/hall-pass/Index.html
          grep -Fq '[data-pass-access-email]' apps-script/hall-pass/Index.html
          grep -Fq 'teacherIsEditing()) return;' apps-script/hall-pass/Index.html

      - name: Commit reconciled source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GrantDesk Release Bot'
          git config user.email 'grantdesk-release@users.noreply.github.com'
          git add apps-script/hall-pass/Index.html
          git commit -m 'Reconcile unpublished Hall Pass UI refinements'
          git rm scripts/reconcile-hall-pass-unpublished-ui.cjs .github/workflows/reconcile-hall-pass-unpublished-ui.yml
          git commit -m 'Remove temporary Hall Pass reconciliation machinery'
          git push origin HEAD:reconcile/hall-pass-unpublished-ui
