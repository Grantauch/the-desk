name: finalize medium batch 3

on:
  push:
    branches:
      - maintenance/medium-batch-3-stamp-curiosity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the batch branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/medium-batch-3-stamp-curiosity
          fetch-depth: 0

      - name: Apply the batch patch
        run: python scripts/apply-medium-batch-3.py

      - name: Commit the final source
        shell: bash
        run: |
          rm scripts/apply-medium-batch-3.py
          rm .github/workflows/finalize-medium-batch-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CuriosityDesk.astro scripts/test-browser-ui.mjs scripts/apply-medium-batch-3.py .github/workflows/finalize-medium-batch-3.yml
          git commit -m "Lazy-load Curiosity Desk collections and guard stamp integration"
          git push origin HEAD:maintenance/medium-batch-3-stamp-curiosity
