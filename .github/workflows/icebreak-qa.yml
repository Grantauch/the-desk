name: ICEBREAK physics and browser QA

on:
  pull_request:
    paths:
      - 'public/hubs/icebreak.html'
      - 'tests/icebreak/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/icebreak-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icebreak-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  icebreak:
    name: ICEBREAK gameplay, WebGL and Canvas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ICEBREAK_EVIDENCE: browser-results/icebreak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact project dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Run complete ICEBREAK source tests
        run: npm run icebreak:test
      - name: Run real browser renderer, touch and contact tests
        run: npm run icebreak:browser
      - name: Preserve screenshots and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icebreak-browser-evidence-${{ github.run_number }}
          path: browser-results/icebreak/
          retention-days: 7
          if-no-files-found: warn
