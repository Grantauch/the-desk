name: temporary audit relock

on:
  push:
    branches:
      - maintenance/audit-safety-net-20260909

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/audit-safety-net-20260909

      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for audit security override"
          git push origin HEAD:maintenance/audit-safety-net-20260909
