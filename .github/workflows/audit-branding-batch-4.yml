name: audit branding batch 4

on:
  push:
    branches:
      - maintenance/branding-audit-batch-4

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/branding-audit-batch-4
      - name: Scan branding and low-risk maintenance smells
        shell: bash
        run: |
          set +e
          echo '=== LEGACY / BRAND VARIANTS ==='
          grep -RniE --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' 'Mr\.?[[:space:]]+Auch|Grant[[:space:]]+Auch|Mr[[:space:]]+Grant|Mr\. Grant' . || true
          echo
          echo '=== KNOWN STALE / RETIRED STRINGS ==='
          grep -RniE --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' 'mr-grant-approved-transparent|school starts tuesday|loading all five live collections|verdict: it.s complicated' . || true
          echo
          echo '=== TODO / FIXME / HACK ==='
          grep -RniE --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' '\b(TODO|FIXME|HACK)\b' . || true
          echo
          echo '=== LOCALHOST / LOOPBACK REFERENCES ==='
          grep -RniE --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' 'localhost|127\.0\.0\.1' src public netlify scripts editor 2>/dev/null || true
          echo
          echo '=== DIRECT MAIN WRITE CLUES ==='
          grep -RniE --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' "ref:[[:space:]]*['\"]main['\"]|heads/main|branch:[[:space:]]*['\"]main['\"]" src netlify scripts editor 2>/dev/null || true
          echo
          echo '=== ASTRO CHECK ==='
          npm ci --include=dev >/dev/null 2>&1
          npm run check || true
