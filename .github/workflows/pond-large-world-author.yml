name: Pond large-world author build
on:
  pull_request:
permissions:
  contents: write
jobs:
  pond:
    if: github.repository == 'Grantauch/the-desk' && github.event.pull_request.head.repo.full_name == 'Grantauch/the-desk' && github.head_ref == 'feat/pond-discovery-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Pond PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/pond-discovery-workbench
          fetch-depth: 0
      - name: Configure Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pond/package-lock.json
      - name: Install Pond
        run: npm ci --prefix apps/pond --include=dev
      - name: Pond unit tests
        run: npm --prefix apps/pond test
      - name: Build Pond and create public output
        run: npm run pond:build
      - name: Verify published output checksums
        run: npm run pond:test
      - name: Install Playwright harness
        run: npm ci --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser QA for mobile and desktop pan zoom and saves
        run: node scripts/test-pond-discovery-browser.mjs
      - name: Commit generated Pond bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/hubs/pond
          if git diff --cached --quiet; then
            echo "Pond assets already match sources."
          else
            git commit -m "Build large-world Pond renderer and camera"
            git push origin HEAD:feat/pond-discovery-workbench
          fi
