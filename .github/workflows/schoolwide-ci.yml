name: Schoolwide CI

on:
  push:
    branches:
      - 'schoolwide/**'
    paths:
      - 'schoolwide/**'
      - '.github/workflows/schoolwide-ci.yml'
  pull_request:
    paths:
      - 'schoolwide/**'
      - '.github/workflows/schoolwide-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: grantdesk_schoolwide
          POSTGRES_USER: grantdesk
          POSTGRES_PASSWORD: grantdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantdesk -d grantdesk_schoolwide"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: schoolwide

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://grantdesk:grantdesk@127.0.0.1:5432/grantdesk_schoolwide
      LEGACY_PRODUCTION_WRITES: forbidden
      SCHOOLWIDE_INSTANCE_ID: ci
      SCHOOLWIDE_BASE_REF: origin/main

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Schoolwide dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Prove migration repeatability
        run: npm run db:migrate

      - name: Verify Schoolwide foundation
        run: npm run verify
      - name: Verify offline teacher preview and build reproducible training-only ZIP
        run: python3 scripts/test-teacher-kit.py && python3 scripts/build-teacher-kit.py && python3 scripts/build-teacher-kit.py --verify

      - name: Verify teacher preview in real Chrome at mobile and desktop sizes
        run: node scripts/test-teacher-kit-browser.mjs

      - name: Upload PRELAUNCH teacher preview (not a student installer)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: schoolwide-teacher-prelaunch-v0.1.0-${{ github.sha }}
          path: schoolwide/out/Schoolwide_Teacher_Prelaunch_v0.1.0.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create isolated synthetic classroom-load database
        run: node scripts/prepare-ci-load-db.mjs

      - name: Apply migrations to isolated classroom-load database
        env:
          DATABASE_URL: postgresql://grantdesk:grantdesk@127.0.0.1:5432/grantdesk_schoolwide_load
        run: npm run db:migrate

      - name: Verify 35 simultaneous synthetic Check-Ins and retries
        env:
          DATABASE_URL: postgresql://grantdesk:grantdesk@127.0.0.1:5432/grantdesk_schoolwide_load
        run: node --import tsx --test src/checkins/checkins.concurrency-load.integration.test.ts

      - name: Check VPS staging operator scripts syntax
        run: bash -n scripts/vps-host-preflight.sh scripts/vps-staging-backup.sh scripts/vps-host-staging-backup.sh scripts/vps-host-backup-audit.sh && node --check scripts/vps-host-probe.mjs && node --check scripts/vps-host-classroom-probe.mjs && node --check scripts/vps-host-pass-queue-probe.mjs && node --check scripts/vps-host-pin-http-probe.mjs && node --check scripts/prepare-ci-load-db.mjs

      - name: Verify isolated VPS staging Compose configuration
        env:
          SCHOOLWIDE_DB_PASSWORD: synthetic_ci_only_1234567890
          SCHOOLWIDE_RELEASE_SHA: ${{ github.sha }}
        run: docker compose -f deploy/vps-staging.compose.yml config --format json | node scripts/verify-vps-staging-compose.mjs
