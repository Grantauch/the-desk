name: Hall Pass Issue 73 Hotfix Builder

on:
  push:
    branches:
      - hotfix/hall-pass-issue-73-builder
    paths:
      - '.github/workflows/hall-pass-hotfix-73.yml'

permissions:
  contents: write

jobs:
  build-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/hall-pass-issue-73-builder
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/hotfix-73.py')
          s = p.read_text()
          old = '''for label in ["initial PIN early re-enable", "action PIN early re-enable"]:
    html = replace_once(
        html,
        "            button.disabled = false;\\n            if (state.requiresClassSelection) renderClassSelection();\\n            else await completeAuthorizedAction();\\n",
        "            if (state.requiresClassSelection) renderClassSelection();\\n            else await completeAuthorizedAction();\\n",
        label,
    )
'''
          new = '''pin_early_enable = "            button.disabled = false;\\n            if (state.requiresClassSelection) renderClassSelection();\\n            else await completeAuthorizedAction();\\n"
pin_locked = "            if (state.requiresClassSelection) renderClassSelection();\\n            else await completeAuthorizedAction();\\n"
if html.count(pin_early_enable) != 2:
    raise SystemExit(f"PIN early re-enable: expected exactly 2 matches, found {html.count(pin_early_enable)}")
html = html.replace(pin_early_enable, pin_locked, 2)
'''
          if old not in s:
              raise SystemExit('builder loop not found')
          p.write_text(s.replace(old, new, 1))
          PY
          set +e
          python3 scripts/hotfix-73.py > /tmp/hotfix-73.log 2>&1
          status=$?
          cat /tmp/hotfix-73.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/hotfix-73.log scripts/hotfix-73-error.txt
            git config user.name 'GrantDesk Hotfix Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add scripts/hotfix-73-error.txt
            git commit -m 'Capture Issue 73 builder diagnostic'
            git push origin HEAD:hotfix/hall-pass-issue-73-builder
            exit "$status"
          fi
      - name: Verify Hall Pass
        run: npm run hall-pass:verify
      - name: Verify repository
        run: npm run verify
      - name: Commit verified hotfix
        run: |
          git config user.name 'GrantDesk Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/hall-pass/Code.gs apps-script/hall-pass/Index.html scripts/test-hall-pass-app.cjs scripts/test-hall-pass-runtime.cjs
          git commit -m 'Fix Hall Pass duplicate action race (#73)'
          git push origin HEAD:hotfix/hall-pass-issue-73-builder
