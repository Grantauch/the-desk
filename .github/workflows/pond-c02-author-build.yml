# Temporary authoring workflow for Pond C02. This is removed before PR review.
name: Pond C02 mobile workbench author build

on:
  push:
    branches:
      - feat/pond-mobile-workbench-c02-20261122
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pond-mobile-workbench-c02
  cancel-in-progress: false

jobs:
  pond-author:
    if: github.repository == 'Grantauch/the-desk' && github.ref == 'refs/heads/feat/pond-mobile-workbench-c02-20261122' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the isolated author branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Pond source dependencies
        run: npm ci --prefix apps/pond --include=dev --no-audit --no-fund
      - name: Test Pond engine and ecology
        run: npm --prefix apps/pond run test
      - name: Build and publish Pond source
        run: npm --prefix apps/pond run build
      - name: Verify published Pond source and bundle checksum
        run: node scripts/validate-pond-build.mjs
      - name: Install locked site test dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise Pond on 320px, 390px and desktop
        run: node scripts/test-pond-discovery-browser.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pond-c02-mobile-qa
          path: browser-results/pond-discovery/
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit compiled Pond bundle on this feature branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/hubs/pond/
          if git diff --cached --quiet; then
            echo 'Compiled Pond bundle already up to date.'
            exit 0
          fi
          git commit -m 'Pond C02: publish verified mobile workbench bundle'
          git push origin "HEAD:${GITHUB_REF_NAME}"
