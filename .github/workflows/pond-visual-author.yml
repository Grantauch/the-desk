name: Pond visual polish author build
on:
  pull_request:
permissions:
  contents: write
jobs:
  pond-visual:
    if: github.repository == 'Grantauch/the-desk' && github.event.pull_request.head.repo.full_name == 'Grantauch/the-desk' && github.head_ref == 'feat/pond-visual-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out visual development branch
        uses: actions/checkout@v7
        with:
          ref: feat/pond-visual-polish
          fetch-depth: 0
      - name: Configure Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pond/package-lock.json
      - name: Install locked Pond dependencies
        run: npm ci --prefix apps/pond --include=dev
      - name: Test Pond graphics and gameplay
        run: npm --prefix apps/pond test
      - name: Build published Pond assets
        run: npm run pond:build
      - name: Verify Pond source and output integrity
        run: npm run pond:test
      - name: Install browser QA dependencies
        run: npm ci --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check graphics on mobile and desktop
        run: node scripts/test-pond-discovery-browser.mjs
      - name: Archive graphical QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pond-visual-browser-screens
          path: browser-results/pond-discovery/
          if-no-files-found: ignore
      - name: Commit versioned bundle to visual branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/hubs/pond
          if git diff --cached --quiet; then
            echo "Bundle already matches."
          else
            git commit -m "Build Pond rich pixel visuals"
            git push origin HEAD:feat/pond-visual-polish
          fi
