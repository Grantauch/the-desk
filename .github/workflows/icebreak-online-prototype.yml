name: ICEBREAK online room prototype

on:
  pull_request:
    paths:
      - 'prototypes/icebreak-online/**'
      - '.github/workflows/icebreak-online-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-room-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: npm run check
        working-directory: prototypes/icebreak-online
      - name: Simulate eight independent WebSocket devices
        run: npm test
        working-directory: prototypes/icebreak-online
