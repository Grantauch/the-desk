name: Pond bundle candidate

on:
  pull_request:
    paths:
      - "apps/pond/**"
      - "scripts/pond-build-manifest.mjs"
      - "scripts/validate-pond-build.mjs"
      - ".github/workflows/pond-bundle-candidate.yml"

permissions:
  contents: read

jobs:
  package:
    # This workflow builds review artifacts only. It never deploys, pushes,
    # changes branches, or accesses credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Use the Pond Node version
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pond/package-lock.json

      - name: Install Pond authoring dependencies
        run: npm ci --prefix apps/pond --no-audit --no-fund

      - name: Author Pond bundle and provenance manifest
        run: npm run pond:build

      - name: Verify output and source hashes
        run: |
          node scripts/validate-pond-build.mjs
          test -f public/hubs/pond/build.json
          echo "Candidate commit: $(git rev-parse HEAD)"
          sha256sum public/hubs/pond/build.json

      - name: Upload verified candidate, not to production
        uses: actions/upload-artifact@v7
        with:
          name: pond-candidate-${{ github.event.pull_request.head.sha }}
          path: public/hubs/pond/
          if-no-files-found: error
          retention-days: 7
