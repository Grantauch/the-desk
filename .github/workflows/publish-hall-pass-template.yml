name: Publish Hall Pass classroom template

# Copies the tested Hall Pass source into the blank template spreadsheet other
# teachers copy. It never changes the production Hall Pass project or deployment.
on:
  workflow_dispatch:
    inputs:
      template_sheet_id:
        description: First run only — ID of the blank template spreadsheet in the school account's Drive
        required: false
        type: string
      template_script_id:
        description: Updates — the template script ID printed by the first run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hall-pass-template
  cancel-in-progress: false

jobs:
  publish:
    name: Publish classroom template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hall-pass-production
    steps:
      - name: Require main
        if: github.ref_name != 'main'
        run: |
          echo "The template may be published only from main." >&2
          exit 1

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Hall Pass checks
        run: npm run hall-pass:verify

      - name: Publish template source
        env:
          GAS_OAUTH_JSON: ${{ secrets.GAS_OAUTH_JSON }}
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          TEMPLATE_SHEET_ID: ${{ inputs.template_sheet_id }}
          TEMPLATE_SCRIPT_ID: ${{ inputs.template_script_id || vars.HALL_PASS_TEMPLATE_SCRIPT_ID }}
        run: node scripts/publish-hall-pass-template.mjs
