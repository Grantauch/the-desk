name: L018 asset promotion

on:
  push:
    branches:
      - storyhub/ush9-l018-post-publish-qa
    paths:
      - .github/workflows/l018-asset-promote.yml
      - .l018-debug/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storyhub/ush9-l018-post-publish-qa
      - name: Inspect staged binary blobs
        run: |
          set -eux
          ls -lh .l018-debug
          file .l018-debug/* || true
          wc -c .l018-debug/*
          sha1sum .l018-debug/*
          sha256sum .l018-debug/*
