# Branch-scoped authoring: C03 source/build/QA only. Remove before review.
name: Pond C03 ink-and-water author build
on:
  push:
    branches:
      - feat/pond-naturalist-worktable-c03-20261122
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pond-c03-ink-water
  cancel-in-progress: false
jobs:
  pond-author:
    if: github.repository == 'Grantauch/the-desk' && github.ref == 'refs/heads/feat/pond-naturalist-worktable-c03-20261122' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Pond dependencies
        run: npm ci --prefix apps/pond --include=dev --no-audit --no-fund
      - name: Pond physics, ecology and discovery unit tests
        run: npm --prefix apps/pond run test
      - name: Compile Pond and publish static bundle
        run: npm --prefix apps/pond run build
      - name: Validate source and published asset fingerprints
        run: node scripts/validate-pond-build.mjs
      - name: Install site testing dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Pond 320px, 390px, desktop interaction and visual QA
        run: node scripts/test-pond-discovery-browser.mjs
      - name: Retain QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pond-c03-visual-qa
          path: browser-results/pond-discovery/
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit generated Pond assets only
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/hubs/pond/
          if git diff --cached --quiet; then
            echo 'Pond bundle is already synchronized.'
            exit 0
          fi
          git commit -m 'Pond C03: commit verified ink-and-water bundle'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
