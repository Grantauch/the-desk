name: Apply late check-in implementation

on:
  push:
    branches:
      - feature/late-checkin-review-20260909
    paths:
      - scripts/apply-late-checkins.py
      - scripts/apply-late-checkins-handoff.py
      - .github/workflows/apply-late-checkins.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/late-checkin-review-20260909
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply late check-in implementation
        run: |
          python scripts/apply-late-checkins.py
          python scripts/apply-late-checkins-handoff.py

      - name: Install locked dependencies
        run: npm ci

      - name: Run canonical GrantDesk release gate
        run: npm run verify

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-late-checkins.py scripts/apply-late-checkins-handoff.py .github/workflows/apply-late-checkins.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: record and review late daily check-ins"
          git push origin HEAD:feature/late-checkin-review-20260909
