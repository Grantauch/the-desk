name: Patch Daily Check-In green identity

on:
  push:
    branches:
      - design/checkin-green-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out design branch
        uses: actions/checkout@v4
        with:
          ref: design/checkin-green-identity
          fetch-depth: 1

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply check-in green identity
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps-script/hall-pass/Index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = """      /* Hall Pass workspace: shared visual language across every private role. */\n      body { background: radial-gradient(ellipse at 8% 0%, #e9eaff 0, transparent 42%), var(--paper); }\n"""
          css_insert = """      /* Hall Pass workspace: shared visual language across every private role. */\n      body { background: radial-gradient(ellipse at 8% 0%, #e9eaff 0, transparent 42%), var(--paper); }\n      body.checkin-mode {\n        --accent: var(--green);\n        --accent-dark: #04503d;\n        --accent-soft: var(--green-soft);\n        background: radial-gradient(ellipse at 8% 0%, #dff5ec 0, transparent 42%), #f5faf8;\n      }\n      body.checkin-mode .mode { border-color:#b9dfd2; background:var(--green-soft); color:var(--accent-dark); }\n      body.checkin-mode .primary { box-shadow:0 4px 10px rgba(8,118,90,.15); }\n      body.checkin-mode .pin-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(8,118,90,.12); }\n"""
          if 'body.checkin-mode {' in text:
              raise SystemExit('Check-in green identity already present; refusing duplicate patch.')
          if text.count(css_anchor) != 1:
              raise SystemExit('CSS anchor not found exactly once.')
          text = text.replace(css_anchor, css_insert, 1)

          js_anchor = "      document.body.classList.toggle('teacher-mode', APP_MODE === 'teacher');\n"
          js_insert = "      document.body.classList.toggle('teacher-mode', APP_MODE === 'teacher');\n      document.body.classList.toggle('checkin-mode', APP_MODE === 'checkin');\n"
          if text.count(js_anchor) != 1:
              raise SystemExit('JS mode anchor not found exactly once.')
          text = text.replace(js_anchor, js_insert, 1)

          path.write_text(text, encoding='utf-8')

      - name: Run canonical release gate
        run: npm run verify

      - name: Commit design patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GrantDesk Release Bot"
          git config user.email "grantdesk-release@users.noreply.github.com"
          git add apps-script/hall-pass/Index.html
          git commit -m "Give Daily Check-In a green visual identity"
          rm .github/workflows/patch-checkin-green-identity.yml
          git add -u .github/workflows/patch-checkin-green-identity.yml
          git commit -m "Remove temporary Check-In design patch workflow"
          git push origin HEAD:design/checkin-green-identity
